<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本社会政治監視機構</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --text: #1d2126; --muted: #68707a; --line: #dedbd3;
  --accent: #1f4e79; --accent-soft: #e4edf5; --user: #e9eef3; --warn: #8a4b00; --warn-bg: #fdf1dc;
  --government: #1f4e79; --party: #8a2c4a; --union: #2d6a4f; --business: #7a5a12;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15181c; --panel: #1e2227; --text: #e6e8ea; --muted: #98a1ab; --line: #333a42;
    --accent: #8ab8e0; --accent-soft: #24384a; --user: #2a3038; --warn: #f0c27a; --warn-bg: #3a2c14;
    --government: #8ab8e0; --party: #e39ab3; --union: #8fd0ae; --business: #dcc07a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.75 "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  display: flex; flex-direction: column;
}
header {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
header .sub { color: var(--muted); font-size: 12px; }
#status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.pill { padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.pill.gpu { color: var(--union); border-color: currentColor; }
.pill.cpu { color: var(--warn); border-color: currentColor; }
button { font: inherit; color: inherit; cursor: pointer; }
#new { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; font-size: 12px; }

main { flex: 1; overflow-y: auto; }
#log { max-width: 820px; margin: 0 auto; padding: 20px 16px 8px; }
.notice { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 16px; }

#welcome { padding: 6vh 0 0; }
#welcome h2 { font-size: 20px; margin: 0 0 6px; }
#welcome p { color: var(--muted); margin: 0 0 18px; }
.examples { display: flex; flex-direction: column; gap: 8px; }
.examples button {
  text-align: left; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 13px;
}
.examples button:hover { border-color: var(--accent); }

.turn { margin-bottom: 22px; }
.q { background: var(--user); border-radius: 12px; padding: 8px 14px; margin-left: auto; width: fit-content; max-width: 85%; white-space: pre-wrap; }
.a { margin-top: 12px; }
.a h3 { font-size: 16px; margin: 18px 0 6px; }
.a h4 { font-size: 15px; margin: 14px 0 4px; }
.a p { margin: 6px 0; }
.a ul { margin: 4px 0; padding-left: 1.4em; }
.a li.l1 { margin-left: 1.4em; }
.a li.l2 { margin-left: 2.8em; }
.a hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
.cite {
  display: inline-block; min-width: 1.5em; padding: 0 5px; margin: 0 1px; border: 0; border-radius: 5px;
  background: var(--accent-soft); color: var(--accent); font-size: 12px; line-height: 1.5; vertical-align: 1px;
}
.cite:hover { outline: 1px solid var(--accent); }
.wait { color: var(--muted); font-size: 13px; }
.wait::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.error { color: #c0392b; }

.sources { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
.sources > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.src { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; font-size: 13px; }
.src.hit { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.src > summary { cursor: pointer; padding: 7px 11px; list-style: none; display: flex; gap: 8px; align-items: baseline; }
.src > summary::-webkit-details-marker { display: none; }
.src .num { color: var(--accent); font-weight: 600; }
.src .title { flex: 1; }
.src .meta { color: var(--muted); font-size: 12px; }
.org { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; }
.org.government, .org.public { color: var(--government); } .org.party { color: var(--party); }
.org.association, .org.local { color: var(--muted); }
.org.commentary { color: var(--muted); border-style: dashed; } /* 非公式の論評 */
.org.union { color: var(--union); } .org.business { color: var(--business); }
.src .body { padding: 0 11px 10px; border-top: 1px dashed var(--line); }
.src .excerpt { white-space: pre-wrap; color: var(--muted); margin: 8px 0; max-height: 220px; overflow-y: auto; }
.src a { color: var(--accent); word-break: break-all; }

footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px 12px; }
form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
textarea {
  flex: 1; resize: none; font: inherit; color: inherit; background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; max-height: 160px;
}
textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
#send { background: var(--accent); color: var(--panel); border: 0; border-radius: 10px; padding: 8px 18px; }
#send:disabled { opacity: .45; cursor: default; }
#filters { max-width: 820px; margin: 0 auto 8px; font-size: 13px; }
#filters > summary { cursor: pointer; color: var(--muted); }
#filters > summary b { color: var(--accent); font-weight: 600; }
.frow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.frow .label { color: var(--muted); width: 5em; flex: none; }
.chip { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 1px 11px; font-size: 12px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--panel); }
#clear { background: none; border: 0; color: var(--accent); font-size: 12px; text-decoration: underline; padding: 0; }
.used { color: var(--muted); font-size: 12px; text-align: right; margin-top: 3px; }
.foot-note { max-width: 820px; margin: 6px auto 0; color: var(--muted); font-size: 11px; }
#me { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
#me button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; font-size: 12px; }
#login { display: block; max-width: 360px; margin: 10vh auto 0; padding: 0 16px; }
#login h2 { font-size: 18px; margin: 0 0 4px; }
#login p { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
#login label { display: block; font-size: 13px; color: var(--muted); margin-top: 10px; }
#login input {
  width: 100%; font: inherit; color: inherit; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; margin-top: 3px;
}
#login input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
#login button { margin-top: 16px; width: 100%; background: var(--accent); color: var(--panel); border: 0; border-radius: 8px; padding: 8px; }
#login .error { font-size: 13px; margin-top: 10px; min-height: 1.5em; }
body.locked main, body.locked footer, body.locked #status, body.locked #new, body.locked #me, body.locked #views { display: none; }
body:not(.locked) #login { display: none; }

/* ---- 表示の切り替え (チャット / タイムライン) ---- */
#views { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 13px; }
#views button { background: none; border: 0; padding: 3px 12px; }
#views button.on { background: var(--accent); color: var(--panel); }
#timeline { display: none; flex: 1; overflow-y: auto; }
body.view-timeline #timeline { display: block; }
body.view-timeline main, body.view-timeline footer, body.view-timeline #new { display: none; }
body.locked #timeline { display: none; }

/* ---- タイムライン ---- */
.tl-wrap { max-width: 1280px; margin: 0 auto; padding: 14px 16px 24px; }
.tl-controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; margin-bottom: 8px; }
.tl-controls select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.tl-controls label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.tl-controls .frow { margin: 0; }
.tl-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
.tl-legend i { display: inline-block; vertical-align: -1px; margin-right: 4px; }
.tl-note { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
.tl-body { display: flex; gap: 14px; align-items: flex-start; }
.tl-scroll { flex: 1; min-width: 0; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.tl-grid { position: relative; }
.tl-row { display: flex; border-top: 1px solid var(--line); }
.tl-row.axis { border-top: 0; position: sticky; top: 0; z-index: 3; background: var(--panel); }
.tl-label {
  position: sticky; left: 0; z-index: 2; flex: none; width: 76px; padding: 8px 8px; background: var(--panel);
  border-right: 1px solid var(--line); font-size: 13px; font-weight: 600; display: flex; flex-direction: column; gap: 2px;
}
.tl-label small { font-weight: 400; color: var(--muted); font-size: 11px; }
.tl-label.government { color: var(--government); } .tl-label.party { color: var(--party); }
.tl-track { position: relative; flex: none; }
.tl-undated { position: sticky; right: 0; z-index: 2; background: var(--panel); flex: none; width: 150px; border-left: 1px dashed var(--line); padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.tl-axis-tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); font-size: 11px; color: var(--muted); padding: 4px 0 0 4px; white-space: nowrap; }
.tl-gridline { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); opacity: .5; pointer-events: none; }
.tl-today { position: absolute; top: 0; bottom: 0; border-left: 2px solid #d0502a; z-index: 1; pointer-events: none; }
.tl-today-label { position: absolute; top: 3px; transform: translateX(-50%); background: #d0502a; color: #fff; font-size: 11px; padding: 0 6px; border-radius: 4px; z-index: 2; white-space: nowrap; }
.ev {
  position: absolute; height: 22px; display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 22px;
  background: none; border: 0; padding: 0 4px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; color: var(--text);
}
.ev .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--c); background: var(--c); }
.ev.planned .dot { background: var(--panel); }
.ev.ongoing .dot { background: linear-gradient(90deg, var(--c) 50%, var(--panel) 50%); }
.ev .t { overflow: hidden; text-overflow: ellipsis; }
.ev.span { border: 1.5px solid var(--c); border-radius: 5px; background: color-mix(in srgb, var(--c) 14%, var(--panel)); padding: 0 6px; }
.ev.span.planned { border-style: dashed; background: var(--panel); }
.ev.span.open { border-right-style: dotted; border-top-right-radius: 0; border-bottom-right-radius: 0; }
.ev.personal { opacity: .75; } .ev.personal .t { font-style: italic; }
.ev.overdue .t { color: var(--muted); text-decoration: underline dotted; }
.ev:hover .t, .ev.sel .t { text-decoration: underline; }
.ev.sel { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 5px; z-index: 1; }
.ev.undated { position: static; width: 100%; }
.ev.many { color: var(--accent); }
.tl-more { position: absolute; right: 4px; bottom: 2px; font-size: 11px; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 4px; padding: 0 6px; z-index: 1; }
.c-government { --c: var(--government); } .c-party { --c: var(--party); }

.tl-detail { width: 360px; flex: none; position: sticky; top: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; max-height: calc(100vh - 120px); overflow-y: auto; }
.tl-detail:empty { display: none; }
.tl-detail h3 { font-size: 15px; margin: 6px 0; line-height: 1.5; }
.tl-detail .close { float: right; background: none; border: 0; color: var(--muted); font-size: 16px; line-height: 1; }
.tl-detail .badges { display: flex; flex-wrap: wrap; gap: 4px; }
.badge { font-size: 11px; padding: 0 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.badge.done { color: var(--union); border-color: currentColor; } .badge.ongoing { color: var(--accent); border-color: currentColor; }
.badge.planned { color: var(--warn); border-color: currentColor; border-style: dashed; }
.tl-detail .warn { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 6px 9px; margin: 8px 0; font-size: 12px; }
.tl-detail .ev-src { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; }
.tl-detail blockquote { margin: 6px 0; padding: 4px 10px; border-left: 3px solid var(--line); color: var(--muted); white-space: pre-wrap; }
.tl-detail a { color: var(--accent); word-break: break-all; }
.tl-detail .ask { margin-top: 12px; background: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 6px; padding: 3px 10px; font-size: 12px; }
.tl-empty { padding: 40px 16px; text-align: center; color: var(--muted); }

/* 一覧表示 (幅の狭い画面) */
.tl-list { display: flex; flex-direction: column; gap: 6px; }
.tl-list .month { font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 2px; }
.tl-list .today-bar { border-top: 2px solid #d0502a; color: #d0502a; font-size: 12px; padding-top: 2px; margin: 10px 0 4px; }
.tl-item { display: flex; gap: 8px; align-items: baseline; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 13px; width: 100%; }
.tl-item .who { flex: none; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; border: 1px solid var(--c); color: var(--c); }
.tl-item .when { flex: none; font-size: 11px; color: var(--muted); }
.tl-item.sel { border-color: var(--accent); }
@media (max-width: 900px) {
  .tl-body { flex-direction: column; }
  .tl-detail { width: 100%; position: static; max-height: none; }
}
</style>
</head>
<body class="locked">
<header>
  <h1>日本社会政治監視機構</h1>
  <span class="sub">一次資料にもとづく情勢分析</span>
  <div id="views" role="tablist">
    <button type="button" class="on" data-view="chat" role="tab">チャット</button>
    <button type="button" data-view="timeline" role="tab">タイムライン</button>
  </div>
  <div id="status"></div>
  <div id="me"></div>
  <button id="new" type="button">新しい会話</button>
</header>

<form id="login" autocomplete="on">
  <h2>ログイン</h2>
  <p>試用中のため、登録された方だけが使えます。</p>
  <label>利用者名<input id="username" name="username" autocomplete="username" required maxlength="64"></label>
  <label>パスワード<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
  <button type="submit">ログイン</button>
  <div class="error" id="login-error"></div>
</form>

<main id="scroll">
  <div id="log">
    <div id="notice"></div>
    <div id="welcome">
      <h2>省庁・政党・労働組合・経済団体の公表資料から答えます</h2>
      <p>回答の各文には根拠にした資料の番号が付きます。番号を押すと該当箇所を確認できます。</p>
      <div class="examples">
        <button type="button">経団連の経労委報告に対して、労働組合はどのような見解を示しているか</button>
        <button type="button">最近の消費者保護に関する行政の動きを整理してください</button>
        <button type="button">各政党は物価高対策について何を主張しているか</button>
      </div>
    </div>
  </div>
</main>

<section id="timeline">
  <div class="tl-wrap">
    <div class="tl-controls">
      <label>分野 <select id="tl-field"><option value="">すべて</option></select></label>
      <span class="frow" id="tl-range">
        <button type="button" class="chip" data-months="3">前後3か月</button>
        <button type="button" class="chip on" data-months="6">前後6か月</button>
        <button type="button" class="chip" data-months="12">前後1年</button>
        <button type="button" class="chip" data-months="0">全期間</button>
      </span>
      <label><input type="checkbox" id="tl-personal"> 議員個人の発言も表示</label>
      <label>表示 <select id="tl-mode"><option value="auto">自動</option><option value="lanes">年表</option><option value="list">一覧</option></select></label>
    </div>
    <div class="frow" id="tl-actors" style="margin: 0 0 8px"></div>
    <div class="tl-legend">
      <span><i class="dot-ic" style="width:10px;height:10px;border-radius:50%;background:var(--muted)"></i>実施済み</span>
      <span><i style="width:10px;height:10px;border-radius:50%;background:linear-gradient(90deg,var(--muted) 50%,transparent 50%);border:2px solid var(--muted)"></i>進行中</span>
      <span><i style="width:10px;height:10px;border-radius:50%;border:2px solid var(--muted)"></i>予定・目標</span>
      <span><i style="width:22px;height:10px;border:1.5px solid var(--muted);border-radius:3px"></i>期間のあるもの (点線は予定)</span>
      <span><i style="width:2px;height:12px;background:#d0502a"></i>今日</span>
    </div>
    <p class="tl-note" id="tl-note"></p>
    <div class="tl-body">
      <div style="flex:1;min-width:0" id="tl-main"></div>
      <aside class="tl-detail" id="tl-detail"></aside>
    </div>
  </div>
</section>

<footer>
  <details id="filters">
    <summary>資料の絞り込み: <b id="fsummary">なし</b></summary>
    <div class="frow"><span class="label">発行主体</span><span id="f-org" class="frow" style="margin:0"></span></div>
    <div class="frow"><span class="label">分野</span><span id="f-field" class="frow" style="margin:0"></span></div>
    <div class="frow"><span class="label">期間</span><span id="f-period" class="frow" style="margin:0">
      <button type="button" class="chip" data-days="30">直近1か月</button>
      <button type="button" class="chip" data-days="90">直近3か月</button>
      <button type="button" class="chip" data-days="365">直近1年</button>
    </span></div>
    <div class="frow"><button type="button" id="clear">絞り込みを解除</button></div>
  </details>
  <form id="form">
    <textarea id="input" rows="1" placeholder="質問を入力 (Enterで送信、Shift+Enterで改行)" maxlength="2000"></textarea>
    <button id="send" type="submit">送信</button>
  </form>
  <div class="foot-note">収集済みの資料だけを根拠にします。資料にないことは答えられません。回答は原文で確認してください。</div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send"), scroller = $("scroll");
let history = [];      // [{role, content}] サーバーに渡す過去のやりとり
let controller = null; // 生成中の通信 (中止用)

const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// 回答 (Markdown の一部) を HTML にする。先にエスケープするので資料由来の文字列がタグになることはない
function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[(\d+(?:\s*[,、]\s*\d+)*)\]/g, (_, nums) =>
      nums.split(/\s*[,、]\s*/).map((n) => `<button type="button" class="cite" data-n="${n}">${n}</button>`).join(""));
}
function render(md) {
  const out = [];
  let inList = false;
  const closeList = () => { if (inList) { out.push("</ul>"); inList = false; } };
  for (const line of md.split("\n")) {
    const heading = line.match(/^\s*(#{1,6})\s+(.*)$/);
    const bullet = line.match(/^(\s*)(?:[-*・]|\d+[.)])\s+(.*)$/);
    if (heading) {
      closeList();
      const tag = heading[1].length <= 2 ? "h3" : "h4";
      out.push(`<${tag}>${inline(heading[2])}</${tag}>`);
    } else if (bullet) {
      if (!inList) { out.push("<ul>"); inList = true; }
      const level = Math.min(2, Math.floor(bullet[1].length / 2));
      out.push(`<li class="l${level}">${inline(bullet[2])}</li>`);
    } else if (/^\s*-{3,}\s*$/.test(line)) {
      closeList(); out.push("<hr>");
    } else if (line.trim()) {
      closeList(); out.push(`<p>${inline(line)}</p>`);
    } else {
      closeList();
    }
  }
  closeList();
  return out.join("");
}

function sourcesHtml(sources) {
  const items = sources.map((s) => `
    <details class="src" data-n="${s.n}">
      <summary>
        <span class="num">[${s.n}]</span>
        <span class="title">${esc(s.title || "無題")}${s.page ? ` <span class="meta">p.${s.page}</span>` : ""}</span>
        <span class="org ${esc(s.org_type)}">${esc(s.org_label)}</span>
        <span class="meta">${esc(s.source_name)} ・ ${esc(s.date || "日付不明")}</span>
      </summary>
      <div class="body">
        ${s.treatment ? `<div class="meta">${s.org_type === "commentary" ? "扱い" : "発言の扱い"}: ${esc(s.treatment)}</div>` : ""}
        <div class="excerpt">${esc(s.text)}</div>
        <a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a>
      </div>
    </details>`).join("");
  return `<details class="sources" open><summary>参照した資料 ${sources.length} 件</summary>${items}</details>`;
}

// ---- 資料の絞り込み ----
const orgLabels = {};
function currentFilters() {
  const on = (id) => [...$(id).querySelectorAll(".chip.on")];
  const filters = { org_types: on("f-org").map((c) => c.dataset.value), fields: on("f-field").map((c) => c.dataset.value) };
  const parts = [...filters.org_types.map((v) => orgLabels[v] || v), ...filters.fields];
  const period = on("f-period")[0];
  if (period) {
    const from = new Date(Date.now() - period.dataset.days * 86400000);
    filters.date_from = from.toLocaleDateString("sv-SE"); // YYYY-MM-DD
    parts.push(period.textContent);
  }
  return { filters, label: parts.join("、") };
}
const updateSummary = () => { $("fsummary").textContent = currentFilters().label || "なし"; };
$("filters").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (chip) {
    if (chip.dataset.days && !chip.classList.contains("on")) {
      $("f-period").querySelectorAll(".chip.on").forEach((c) => c.classList.remove("on")); // 期間は1つだけ
    }
    chip.classList.toggle("on");
  } else if (e.target.id === "clear") {
    $("filters").querySelectorAll(".chip.on").forEach((c) => c.classList.remove("on"));
  } else return;
  updateSummary();
});
function loadOptions() {
  return fetch("/api/options").then((r) => r.json()).then((o) => {
    const chip = (value, label) => `<button type="button" class="chip" data-value="${esc(value)}">${esc(label)}</button>`;
    o.org_types.forEach((t) => { orgLabels[t.value] = t.label; });
    $("f-org").innerHTML = o.org_types.map((t) => chip(t.value, t.label)).join("");
    $("f-field").innerHTML = o.fields.map((f) => chip(f, f)).join("");
  });
}

const nearBottom = () => scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80;
const toBottom = () => { scroller.scrollTop = scroller.scrollHeight; };

async function ask(question) {
  $("welcome")?.remove();
  const turn = document.createElement("div");
  turn.className = "turn";
  const { filters, label } = currentFilters();
  turn.innerHTML = `<div class="q">${esc(question)}</div>${label ? `<div class="used">絞り込み: ${esc(label)}</div>` : ""}<div class="a"></div><div class="wait"></div><div class="srcbox"></div>`;
  log.appendChild(turn);
  const [answerEl, waitEl, srcEl] = [".a", ".wait", ".srcbox"].map((s) => turn.querySelector(s));
  toBottom();

  const started = Date.now();
  let phase = "資料を検索しています";
  const tick = () => { waitEl.textContent = `${phase}… ${Math.round((Date.now() - started) / 1000)}秒`; };
  tick();
  const timer = setInterval(tick, 1000);

  let answer = "", failed = false;
  const handle = (ev) => {
    if (ev.type === "queued") {
      phase = "順番待ちです (他の質問の回答を生成中)";
      tick();
    } else if (ev.type === "sources") {
      if (ev.sources.length) srcEl.innerHTML = sourcesHtml(ev.sources);
      phase = "回答を作成しています";
    } else if (ev.type === "delta") {
      const stick = nearBottom();
      answer += ev.text;
      answerEl.innerHTML = render(answer);
      if (stick) toBottom();
    } else if (ev.type === "done") {
      if (typeof ev.remaining === "number") showRemaining(ev.remaining);
    } else if (ev.type === "error") {
      failed = true;
      answerEl.insertAdjacentHTML("beforeend", `<p class="error">${esc(ev.message)}</p>`);
    }
  };

  controller = new AbortController();
  send.textContent = "中止";
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, history, filters }), signal: controller.signal,
    });
    if (res.status === 401) { lock(); throw new Error("ログインが切れました。もう一度ログインしてください"); }
    if (!res.ok) {
      const detail = (await res.json().catch(() => ({}))).detail;
      throw new Error(detail || `サーバーエラー ${res.status}`);
    }
    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) if (line.trim()) handle(JSON.parse(line));
    }
  } catch (e) {
    failed = true;
    const message = e.name === "AbortError" ? "中止しました。" : e.message;
    answerEl.insertAdjacentHTML("beforeend", `<p class="error">${esc(message)}</p>`);
  } finally {
    clearInterval(timer);
    controller = null;
    send.textContent = "送信";
    waitEl.className = "wait-done";
    waitEl.textContent = "";
    if (!failed && answer) {
      // 資料本文は履歴に入れない (質問と回答だけを次の文脈にする)
      history.push({ role: "user", content: question }, { role: "assistant", content: answer });
    }
    input.focus();
  }
}

// ---- タイムライン (政府・各党の出来事と予定) ----
const TL = { options: null, data: null, selected: null, expanded: new Set(), hidden: new Set(), seq: 0 };
const STATUS_LABEL = { done: "実施済み", ongoing: "進行中", planned: "予定・目標" };
const LABEL_W = 76, UNDATED_W = 150, ROW_H = 26, MAX_ROWS = 5, MONTH_MIN_PX = 60;
const today = new Date(); today.setHours(0, 0, 0, 0);
const iso = (d) => d.toLocaleDateString("sv-SE");
const addMonths = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, d.getDate());

// "2026" / "2026-04" / "2026-04-15" → 日付 (年・月だけのときはその中ほど)
function parseWhen(s, end = false) {
  if (!s) return null;
  const [y, m, d] = s.split("-").map(Number);
  if (d) return new Date(y, m - 1, d);
  if (m) return end ? new Date(y, m, 0) : new Date(y, m - 1, 15);
  return end ? new Date(y, 11, 31) : new Date(y, 6, 1);
}
function whenText(ev) {
  const f = (s) => { if (!s) return ""; const [y, m, d] = s.split("-"); return d ? `${y}年${+m}月${+d}日` : m ? `${y}年${+m}月` : `${y}年`; };
  if (!ev.start) return "時期未定";
  return ev.end ? `${f(ev.start)} 〜 ${f(ev.end)}` : f(ev.start);
}
const overdue = (ev) => ev.status === "planned" && ev.start && parseWhen(ev.end || ev.start, true) < today;
const actorClass = (id) => (id === "government" ? "government" : "party");

function tlRange() {
  const months = +$("tl-range").querySelector(".chip.on").dataset.months;
  if (months) return [addMonths(today, -months), addMonths(today, months)];
  const o = TL.options || {};
  const from = parseWhen(o.min_date) || addMonths(today, -12), to = parseWhen(o.max_date, true) || today;
  return [new Date(Math.min(from, addMonths(today, -1))), new Date(Math.max(to, addMonths(today, 3)))];
}

async function loadTimelineOptions() {
  const o = await fetch("/api/timeline/options").then((r) => r.json());
  TL.options = o;
  $("tl-field").innerHTML = `<option value="">すべて</option>` + o.fields.map((f) => `<option>${esc(f)}</option>`).join("");
  $("tl-actors").innerHTML = `<span class="label" style="color:var(--muted);font-size:13px">表示する行</span>` +
    o.actors.filter((a) => a.count).map((a) =>
      `<button type="button" class="chip on" data-actor="${esc(a.id)}" title="${esc(a.name)}">${esc(a.label)} ${a.count}</button>`).join("");
  $("tl-note").textContent = o.scanned
    ? "収集した資料から LLM で取り出した出来事です。各項目の出典 (原文の一節) で確認してください。予定・目標はその後に実施されたとは限りません。"
    : "";
}

async function loadTimeline() {
  const [from, to] = tlRange();
  const params = new URLSearchParams({ date_from: iso(from), date_to: iso(to), personal: $("tl-personal").checked });
  if ($("tl-field").value) params.set("fields", $("tl-field").value);
  const seq = ++TL.seq;
  $("tl-main").innerHTML = `<div class="tl-empty wait">読み込んでいます</div>`;
  const res = await fetch("/api/timeline?" + params);
  if (res.status === 401) { lock(); return; }
  const data = await res.json();
  if (seq !== TL.seq) return; // 後から出した条件の結果を優先する
  TL.data = data;
  renderTimeline();
}

function visibleActors() {
  return TL.data.actors.filter((a) => !TL.hidden.has(a.id));
}

function renderTimeline() {
  const main = $("tl-main"), data = TL.data;
  if (!data) return;
  if (!TL.options?.scanned) {
    main.innerHTML = `<div class="tl-empty">まだ出来事が取り出されていません。<br>サーバーで <code>python main.py events</code> を実行すると、収集した資料から取り出します (要 LLM)。</div>`;
    return;
  }
  const events = data.events.filter((e) => !TL.hidden.has(e.actor));
  if (!events.length) {
    main.innerHTML = `<div class="tl-empty">この条件に当てはまる出来事は、収集した資料にはありません。</div>`;
    return;
  }
  const mode = $("tl-mode").value;
  const narrow = innerWidth < 720; // 詳細パネルの開閉で表示が切り替わらないよう、画面の幅で決める
  if (mode === "list" || (mode === "auto" && narrow)) renderList(events); else renderLanes(events);
  TL.renderedWidth = main.clientWidth;
  if (TL.selected && !events.some((e) => e.id === TL.selected)) closeDetail(); // 条件を変えて見えなくなった
}
// 詳細パネルの開閉で年表の幅が変わったら描き直す
const refit = () => { if ($("tl-main").clientWidth !== TL.renderedWidth) renderTimeline(); };
function closeDetail() {
  TL.selected = null;
  $("tl-detail").innerHTML = "";
  document.querySelectorAll("#tl-main .sel").forEach((el) => el.classList.remove("sel"));
  refit();
}

function eventButton(ev, cls, style) {
  const classes = ["ev", ev.status, `c-${actorClass(ev.actor)}`, cls, ev.personal ? "personal" : "", overdue(ev) ? "overdue" : "",
    TL.selected === ev.id ? "sel" : ""].filter(Boolean).join(" ");
  const tip = `${whenText(ev)} ${STATUS_LABEL[ev.status]}: ${ev.title}${ev.sources.length > 1 ? ` (資料 ${ev.sources.length} 件)` : ""}`;
  return `<button type="button" class="${classes}" data-ev="${ev.id}" style="${style}" title="${esc(tip)}">` +
    `${cls.includes("span") ? "" : `<span class="dot"></span>`}<span class="t">${esc(ev.title)}</span></button>`;
}

function renderLanes(events) {
  const [from, to] = tlRange();
  const span = to - from;
  const months = Math.max(1, Math.round(span / (30.4 * 86400000)));
  const avail = $("tl-main").clientWidth - LABEL_W - UNDATED_W - 2;
  const W = Math.max(avail, months * MONTH_MIN_PX);
  const x = (d) => ((d - from) / span) * W;

  // 目盛り (月)。月が多いときは間引く
  const step = months > 30 ? 6 : months > 15 ? 3 : 1;
  let ticks = "", lines = "";
  for (let d = new Date(from.getFullYear(), from.getMonth() + 1, 1); d <= to; d = addMonths(d, 1)) {
    const px = x(d);
    lines += `<div class="tl-gridline" style="left:${px}px"></div>`;
    if (d.getMonth() % step === 0) {
      ticks += `<div class="tl-axis-tick" style="left:${px}px">${d.getMonth() === 0 || !ticks ? `${d.getFullYear()}年` : ""}${d.getMonth() + 1}月</div>`;
    }
  }
  const todayX = x(today);
  const todayLine = todayX >= 0 && todayX <= W ? `<div class="tl-today" style="left:${todayX}px"></div>` : "";

  let rows = `<div class="tl-row axis"><div class="tl-label"><small>主体</small></div>
    <div class="tl-track" style="width:${W}px;height:26px">${ticks}${todayLine ? `<div class="tl-today-label" style="left:${todayX}px">今日</div>` : ""}</div>
    <div class="tl-undated" style="font-size:11px;color:var(--muted);padding-top:4px">時期未定の予定</div></div>`;

  for (const actor of visibleActors()) {
    const own = events.filter((e) => e.actor === actor.id);
    if (!own.length) continue;
    const dated = own.filter((e) => e.start).sort((a, b) => parseWhen(a.start) - parseWhen(b.start));
    const undated = own.filter((e) => !e.start);
    // 重ならないように段に詰める (左から順に、空いている一番上の段へ)
    const lanes = [], placed = [];
    for (const ev of dated) {
      const s = parseWhen(ev.start);
      const e = ev.end ? parseWhen(ev.end, true) : ev.status === "ongoing" && s < today ? today : null;
      let left = Math.max(0, x(s)), width;
      if (e && x(e) - x(s) > 14) {
        width = Math.max(x(Math.min(e, to)) - left, 40);
      } else {
        left = Math.max(0, left - 6);
        width = Math.min(240, 26 + ev.title.length * 12);
      }
      if (x(s) > W || (e ? x(e) : x(s)) < 0) continue; // 範囲外
      const labelEnd = left + Math.max(width, e ? Math.min(240, 16 + ev.title.length * 12) : width);
      let row = lanes.findIndex((end) => end < left);
      if (row < 0) { row = lanes.length; lanes.push(0); }
      lanes[row] = labelEnd + 6;
      placed.push({ ev, left, width, row, isSpan: !!e, open: !ev.end && !!e });
    }
    const expanded = TL.expanded.has(actor.id);
    const shownRows = expanded ? lanes.length : Math.min(lanes.length, MAX_ROWS);
    const hiddenCount = placed.filter((p) => p.row >= shownRows).length;
    const height = Math.max(1, shownRows) * ROW_H + 8 + (hiddenCount || expanded && lanes.length > MAX_ROWS ? 16 : 0);
    const items = placed.filter((p) => p.row < shownRows).map((p) =>
      eventButton(p.ev, p.isSpan ? `span${p.open ? " open" : ""}` : "",
        `left:${p.left}px;top:${4 + p.row * ROW_H}px;${p.isSpan ? `width:${p.width}px` : `max-width:${p.width}px`}`)).join("");
    const more = hiddenCount ? `<button type="button" class="tl-more" data-expand="${esc(actor.id)}">ほか ${hiddenCount} 件を表示</button>`
      : expanded && lanes.length > MAX_ROWS ? `<button type="button" class="tl-more" data-expand="${esc(actor.id)}">折りたたむ</button>` : "";
    const undatedHtml = undated.slice(0, expanded ? undefined : 4).map((ev) => eventButton(ev, "undated", "")).join("") +
      (undated.length > 4 && !expanded ? `<button type="button" class="ev many undated" data-expand="${esc(actor.id)}">ほか ${undated.length - 4} 件</button>` : "");
    rows += `<div class="tl-row"><div class="tl-label ${actorClass(actor.id)}" title="${esc(actor.name)}">${esc(actor.label)}<small>${own.length} 件</small></div>
      <div class="tl-track" style="width:${W}px;height:${height}px">${lines}${todayLine}${items}${more}</div>
      <div class="tl-undated">${undatedHtml}</div></div>`;
  }
  $("tl-main").innerHTML = `<div class="tl-scroll" id="tl-scroll"><div class="tl-grid" style="width:${LABEL_W + W + UNDATED_W}px">${rows}</div></div>`;
  // 初めは今日が見えるように横に送る
  const sc = $("tl-scroll");
  if (sc.scrollWidth > sc.clientWidth) sc.scrollLeft = Math.max(0, todayX - (sc.clientWidth - LABEL_W - UNDATED_W) / 2);
}

function renderList(events) {
  const label = Object.fromEntries(TL.data.actors.map((a) => [a.id, a.label]));
  const key = (e) => (e.start ? parseWhen(e.start) : new Date(8.64e15));
  const sorted = [...events].sort((a, b) => key(b) - key(a)); // 新しい順 (未定の予定が先頭)
  let html = "", lastMonth = null, todayShown = false;
  for (const ev of sorted) {
    const d = ev.start ? parseWhen(ev.start) : null;
    if (!todayShown && d && d <= today) { html += `<div class="today-bar">今日 ${iso(today)} ↑ 予定 ／ ↓ これまで</div>`; todayShown = true; }
    const month = d ? `${d.getFullYear()}年${d.getMonth() + 1}月` : "時期未定の予定";
    if (month !== lastMonth) { html += `<div class="month">${month}</div>`; lastMonth = month; }
    html += `<button type="button" class="tl-item c-${actorClass(ev.actor)} ${TL.selected === ev.id ? "sel" : ""}" data-ev="${ev.id}">
      <span class="who">${esc(label[ev.actor] || ev.actor)}</span>
      <span class="badge ${ev.status}">${STATUS_LABEL[ev.status]}</span>
      <span style="flex:1">${esc(ev.title)}${ev.personal ? ` <span class="badge">議員個人</span>` : ""}</span>
      <span class="when">${esc(whenText(ev))}</span></button>`;
  }
  $("tl-main").innerHTML = `<div class="tl-list">${html}</div>`;
}

function showDetail(id, scroll = true) {
  const ev = TL.data?.events.find((e) => e.id === id);
  if (!ev) { closeDetail(); return; }
  TL.selected = id;
  document.querySelectorAll("#tl-main .sel").forEach((el) => el.classList.remove("sel"));
  document.querySelectorAll(`#tl-main [data-ev="${id}"]`).forEach((el) => el.classList.add("sel"));
  const actor = TL.data.actors.find((a) => a.id === ev.actor);
  const sources = ev.sources.map((s) => `
    <div class="ev-src">
      <div><b>${esc(s.source_name)}</b> <span class="meta">${esc(s.org_label)} ・ ${esc(s.date || "日付不明")}</span></div>
      <div>${esc(s.title || "無題")}</div>
      ${s.treatment ? `<div class="meta">発言の扱い: ${esc(s.treatment)}</div>` : ""}
      <blockquote>${esc(s.quote)}</blockquote>
      <a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">原文を開く</a>
    </div>`).join("");
  $("tl-detail").innerHTML = `
    <button type="button" class="close" aria-label="閉じる" data-close>×</button>
    <div class="badges"><span class="badge ${ev.status}">${STATUS_LABEL[ev.status]}</span><span class="badge">${esc(ev.kind)}</span>${ev.field ? `<span class="badge">${esc(ev.field)}</span>` : ""}</div>
    <h3>${esc(actor ? actor.name : ev.actor)}: ${esc(ev.title)}</h3>
    <div class="meta">${esc(whenText(ev))}</div>
    ${ev.personal ? `<div class="warn">議員個人の発言から取り出したものです。党の立場としては扱いません。</div>` : ""}
    ${overdue(ev) ? `<div class="warn">予定の時期を過ぎています。その後に実施されたかは、収集した資料では確認できていません。</div>` : ""}
    <p>${esc(ev.summary || "")}</p>
    <div class="meta">出典 ${ev.sources.length} 件</div>
    ${sources}
    <button type="button" class="ask" data-ask>この件をチャットで質問する</button>`;
  refit();
  if (scroll && innerWidth <= 900) $("tl-detail").scrollIntoView({ behavior: "smooth", block: "start" });
}

$("tl-main").addEventListener("click", (e) => {
  const exp = e.target.closest("[data-expand]");
  if (exp) {
    const id = exp.dataset.expand;
    TL.expanded.has(id) ? TL.expanded.delete(id) : TL.expanded.add(id);
    renderTimeline();
    return;
  }
  const item = e.target.closest("[data-ev]");
  if (item) showDetail(+item.dataset.ev);
});
$("tl-detail").addEventListener("click", (e) => {
  if (e.target.closest("[data-close]")) {
    closeDetail();
  } else if (e.target.closest("[data-ask]")) {
    const ev = TL.data.events.find((x) => x.id === TL.selected);
    setView("chat");
    input.value = `「${ev.title}」について、政府と各党のこれまでの動きと今後の予定を整理してください`;
    input.dispatchEvent(new Event("input"));
    input.focus();
  }
});
$("tl-range").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip || chip.classList.contains("on")) return;
  $("tl-range").querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === chip));
  loadTimeline();
});
$("tl-actors").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  chip.classList.toggle("on");
  chip.classList.contains("on") ? TL.hidden.delete(chip.dataset.actor) : TL.hidden.add(chip.dataset.actor);
  renderTimeline();
});
$("tl-field").addEventListener("change", loadTimeline);
$("tl-personal").addEventListener("change", loadTimeline);
$("tl-mode").addEventListener("change", renderTimeline);
let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderTimeline, 150); });

function setView(view) {
  document.body.classList.toggle("view-timeline", view === "timeline");
  $("views").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.view === view));
  try { localStorage.setItem("view", view); } catch {}
  if (view === "timeline" && !TL.options) loadTimelineOptions().then(loadTimeline).catch(() => {
    $("tl-main").innerHTML = `<div class="tl-empty error">タイムラインを読み込めませんでした。</div>`;
  });
}
$("views").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-view]");
  if (b) setView(b.dataset.view);
});
unlock().then(() => {
  let saved = null;
  try { saved = localStorage.getItem("view"); } catch {}
  if (saved === "timeline" && !document.body.classList.contains("locked")) setView("timeline");
});
</script>
</body>
</html>
