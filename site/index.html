okkai.ndl.go.jp/txt/122215385X00320261028/89","2026-10-28","国会会議録","デジタル田園都市国家構想の下で、数値目標、これは二〇二六年度までに二百三十万人を育成するということを、目標を策定しまして、リスキリングを踏まえた、含んだ支援策を講じるなど、関係省庁が連携して取り組んできております。"]],"id":1050},{"a":"government","s":"ongoing","k":"政策の実施","f":"行政・デジタル","t":"府省・デジタル庁による内部人材育成計画の実施","m":"各府省は業務特性に合わせた人材確保・育成計画を作成し、独自の研修や人事配置に取り組んでいる。デジタル庁も府省横断での情報システム統一研修を実施している。","d":"2026-04-01","e":"","r":"government","n":1,"src":[["参議院 デジタル社会の形成及び人工知能の活用等に関する特別委員会 第3号（デジタル大臣・内閣府特命担当大臣（知的財産戦略・科学技術政策・宇宙政策・人工知能戦略・海洋政策・サイバー安全保障）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215385X00320261028/89","2026-10-28","国会会議録","各府省がそれぞれの業務特性に合わせた人材確保・育成計画を作成しまして、独自の研修や採用、キャリアパスを見据えた人事配置などに計画的に取り組んでいるほか、デジタル庁においても府省横断での情報システム統一研修を実施しまして、各省庁のデジタル人材育成を後押ししているところでございます。"]],"id":1051},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"子育て・教育","t":"部活動改革の実行期間を設定し取り組みを推進","m":"部活動の地域展開と教師の働き方改革を目的とし、今年度から六年間を改革実行期間と位置付けて取り組んでいる。","d":"2026-04-01","e":"2031-03-31","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（スポーツ庁次長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/111","2026-10-27","国会会議録","スポーツ庁では今年度からの六年間を改革実行期間と位置付けて取組を進めているところでございます。"]],"id":1191},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"部活動の地域展開のための補助金を新設","m":"休日の地域クラブ活動費等の支援に加え、平日も含めた地域展開の加速を目指し、補助金を新設し対応策の検証を行っている。","d":"2026-04-01","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（スポーツ庁次長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/111","2026-10-27","国会会議録","今年度からは部活動の地域展開等のための補助金を新設しているところでございます。"]],"id":1193},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"子育て・教育","t":"休日における部活動の地域展開実現を目指す","m":"改革実行期間中、自治体と協働し、休日については原則全ての部活動で地域展開の実現を目指している。","d":"2026-04-01","e":"2031-03-31","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（スポーツ庁次長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/111","2026-10-27","国会会議録","この改革実行期間中の中で、自治体と協働して、休日については原則全ての部活動で地域展開の実現を目指しております。"]],"id":1194},{"a":"government","s":"done","k":"その他","f":"子育て・教育","t":"教育委員会に対する策定状況のフォローアップ調査を実施","m":"各服務監督教育委員会に対し、本年4月1日時点の策定状況等についてのフォローアップ調査を実施した。未策定の教育委員会（323自治体）は今年度中に策定予定である。","d":"2026-04-01","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/44","2026-10-27","国会会議録","各服務監督教育委員会に対しまして、本年四月一日時点の策定状況等についてのフォローアップ調査をいたしました。そのところ、策定済みの教育委員会が八二・二％、千四百八十七自治体、そのうち既に計画を公表している教育委員会は六一・九％、九百二十一自治体でございます。残りの、計画が未策定である教育委員会、一七・八％、三百二十三自治体についても今年度中に策定予定との結果となってございます。"]],"id":1219},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"環境・エネルギー","t":"気候変動適応計画等の見直しと施策推進","m":"気候変動適応計画と熱中症対策実行計画の今年度中の見直しを進め、地域支援策や適応ビジネスの海外展開、高齢者への見守りなどを進める。","d":"2026-04-01","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第2号（環境省地球環境局長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00220261027/21","2026-10-27","国会会議録","適応策については、気候変動適応計画と熱中症対策実行計画の今年度中の見直しに向け、関係省庁などと議論を進めているところでございます。計画の見直しを通じまして、猛暑や自然災害、農作物の被害など、幅広い気候変動影響に対する地域における取組への支援策や適応ビジネスの海外展開、熱中症対策につきましては、高齢者への見守り、声かけ強化などを進めることで、適応策の社会実装の実効性を高めてまいりたいと考えております。"]],"id":1384},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"全国ひとり親世帯調査を実施","m":"母子世帯約430世帯、父子世帯約210世帯、養育者世帯約200世帯を対象に調査を実施する。調査は訪問、郵送、オンラインのいずれかの方法で行う。","d":"2026-04-01","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（こども家庭庁長官官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/119","2026-10-27","国会会議録","今年度実施する全国ひとり親世帯調査の対象世帯数は、母子世帯約四千三百世帯、父子世帯約二千百世帯、養育者世帯約二百世帯を想定しております。"]],"id":1409},{"a":"government","s":"done","k":"予算・税制","f":"福祉","t":"更生保護委託費の単価増に係る経費を予算措置","m":"近時の物価高騰等を踏まえ、更生保護委託費の単価増に係る経費を令和八年度予算において措置した。","d":"2026-04-01","e":"2027-03-31","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/10","2026-10-27","国会会議録","近時の物価高騰等を踏まえた更生保護委託費の単価増に係る経費については、令和八年度予算において措置されたところでありますけれども"]],"id":1446},{"a":"government","s":"ongoing","k":"政策の実施","f":"経済・産業","t":"本人確認におけるICチップ情報読み取りへの移行促進","m":"不正対策として効果が高いICチップ情報の読み取りへの移行を促し、期限を前倒しで設定している。","d":"2026-04-01","e":"2026-04-30","r":"government","n":1,"src":[["参議院 財政金融委員会 第 ["衆議院 文部科学委員会 第3号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/37","2026-10-30","国会会議録","医療関係者や教育関係者から成ります有識者会議を開催し、本年九月に中間まとめを公表したところでございます。"]],"id":573},{"a":"government","s":"done","k":"政策の実施","f":"農林水産","t":"備蓄米の買戻しを全量成約","m":"備蓄米の買戻しについて、9月18日に見積合わせを行い、21万トン全量成約した。現在、受託事業体と売り渡した事業者との引渡し調整を行っている。","d":"2026-09","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（農林水産省農産局農産政策部長の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/172","2026-10-28","国会会議録","九月十八日に見積合わせを行ってございまして、二十一万トン全量成約したところでございます。現在、国が販売や保管、管理を委託している受託事業体におきまして、売り渡した事業者との引渡しに関しての調整を行っている段階にございます。"]],"id":942},{"a":"government","s":"done","k":"会議・協議","f":"外交・安全保障","t":"国連総会で外相会合を共催","m":"海洋の安全と安定の確保に向けた協力に関する外相会合を共催し、ホルムズ海峡、バブエルマンデブ海峡の自由で安全な航行の早期回復の重要性について多くの国の賛同を得た。","d":"2026-09","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/162","2026-10-28","国会会議録","九月の国連総会では、海洋の安全と安定の確保に向けた協力に関する外相会合、私、共催をいたしまして、ホルムズ海峡、そしてバブエルマンデブ海峡、この自由で安全な航行の早期回復の重要性について多くの国の賛同を得ることができたところであります。"]],"id":957},{"a":"government","s":"done","k":"提言・要望","f":"経済・産業","t":"有識者会議に税制見直し案に関する意見書を提出","m":"国税庁の見直し案が中堅・中小企業に与える事業承継や成長投資への悪影響を懸念し、国の政策的方向性に逆行しないよう意見を提出した。","d":"2026-09","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（中小企業庁事業環境部長の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/32","2026-10-27","国会会議録","こうした声も踏まえまして、九月の有識者会議において経済産業省から意見書を提出をさせていただきました。株式評価額が大幅に増大することで、納税資金を捻出するために事業用資産を第三者に売却せざるを得なくなる、さらには廃業に追い込まれるといった事業承継に深刻な支障を来すことや、納税資金確保のために成長投資を抑制されるおそれがあるといったような懸念を御指摘をしつつ、中堅・中小企業の稼ぐ力を強化をし、地方を含めた賃上げの実現という国の政策的方向性に逆行するような見直しとならないようにしていただきたいという意見を提出をさせていただいたところでございます。"]],"id":1562},{"a":"government","s":"done","k":"閣議決定・計画","f":"環境・エネルギー","t":"クビアカツヤカミキリ防除戦略を決定","m":"対策本部において、「クビアカツヤカミキリ防除戦略」が決定された。","d":"2026-09-01","e":"","r":"government","n":2,"src":[["参考３_令和８年度特定外来生物防除等対策事業（概要）[PDF 509KB]","https://www.env.go.jp/content/000441670.pdf","2026-11-12","環境省","また、令和８年9月に対策本部において、「クビアカツヤカミキリ防除戦略」を決定した。"],["参考２_特定外来生物防除等対策事業実施要領[PDF 266KB]","https://www.env.go.jp/content/000441669.pdf","2026-11-12","環境省","ウ）クビアカツヤカミキリ防除戦略（令和８年９月11 日クビアカツヤカミキリ対策本部決定）に沿って行なわれる防除であること。"]],"id":224},{"a":"government","s":"ongoing","k":"会議・協議","f":"行政・デジタル","t":"2027年度以降の育成政策検討のための有識者会議立ち上げ","m":"今後のデジタル人材育成の方向性や2027年度以降の政府目標について、デジタル庁が本年9月に有識者会議を立ち上げ、検討を開始している。","d":"2026-09-01","e":"","r":"government","n":1,"src":[["参議院 デジタル社会の形成及び人工知能の活用等に関する特別委員会 第3号（デジタル大臣・内閣府特命担当大臣（知的財産戦略・科学技術政策・宇宙政策・人工知能戦略・海洋政策・サイバー安全保障）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215385X00320261028/89","2026-10-28","国会会議録","今後のデジタル人材の育成の方向性や、育成政策の方向性や、あるいは二〇二七年度以降の政府目標につきましては、デジタル庁において本年九月に有識者会議を立ち上げまして検討を行っており、その中で、育成された人材が経済社会で活躍する上での課題、これはキャリア形成を含んでですけれども、そうしたことも議論されているところでございます。"]],"id":1053},{"a":"government","s":"done","k":"閣議決定・計画","f":"財政・税制","t":"地方交付税総額を適切に確保する大綱を閣議決定","m":"食料品消費税率の臨時的な引下げに伴う減収に対応するため、各年度において必要な地方交付税総額を適切に確保することとした。","d":"2026-09-15","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（総務省大臣官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/193","2026-10-27","国会会議録","九月十五日に閣議決定しました大綱におきまして、各年度において必要な地方交付税総額を適切に確保することとしております。"]],"id":1458},{"a":"government","s":"done","k":"会議・協議","f":"環境・エネルギー","t":"インドにおけるパリ協定６条実施促進ビジネスフォーラムを開催","m":"日本環境省とインド環境・森林・気候変動省の主催により、インド・デリーでビジネスフォーラムを開催。JCMの最新動向や両国企業による脱炭素技術を紹介した。","d":"2026-09-28","e":"","r":"government","n":1,"src":[["日・インド間の二国間クレジット制度（JCM）の詳細規則（Operational Manual）を策定しました","https://www.env.go.jp/press/press_05634.html","2026-11-09","環境省","2026年９月28日には、日本環境省とインド共和国 環境・森林・気候変動省（MoEFCC）との主催により、インド・デリーにおいて、インドにおけるパリ協定６条実施促進に関するビジネスフォーラム「INDIA ARTICLE 6 FORUM : Advancing International Carbon Markets for Climate Action and Sustainable Development」を開催しました。"]],"id":424},{"a":"government","s":"done","k":"法案・制度","f":"環境・エネルギー","t":"日・インド間のJCM詳細規則（Operational Manual）を策定","m":"パリ協定第６条に沿って日・インド間の二国間クレジット制度（JCM）を実施するための詳細規則であるOperational Manualを策定し、具体的なJCMの運用方法を定めた。","d":"2026-09-30","e":"","r":"government","n":1,"src":[["日・インド間の二国間クレジット制度（JCM）の詳細規則（Operational Manual）を策定しました","https://www.env.go.jp/press/press_05634.html","2026-11-09","環境省","日・インド間の二国間クレジット制度（Joint Crediting Mechanism: JCM）をパリ協定第６条に沿って実施するための詳細規則であるOperational Manualを発表しました。"]],"id":423},{"a":"komei","s":"ongoing","k":"その他","f":"行政・デジタル","t":"調査報道プロジェクト「みんこえ」を開始","m":"当事者の悩みを調査するプロジェクト「みんなの声 調査室」（みんこえ）を始動させ、現在も複数の声を調査している。","d":"2026-10","e":"","r":"opposition","n":1,"src":[["一通の依頼、胸に金沢へ","https://www.komei.or.jp/komeinews/p515803/","2026-11-13","公明党","10月から始動した本紙の調査報道プロジェクト『みんなの声 調査室』（略称・みんこえ）宛てに一通の取材依頼が届いた。現在も複数の声を調査中。"]],"id":24},{"a":"government","s":"ongoing","k":"会議・協議","f":"住宅・都市","t":"施設系ミートアップの開催","m":"総合職施設系・一般職施設系対象に対し、建築・機械・電気の専門性を求めるミートアップを開催する。","d":"2026-10","e":"2026-11","r":"government","n":1,"src":[["業務説明会・職員訪問","https://www.mext.go.jp/b_menu/saiyou/sougoujimu/setumei/1421199_00009.htm","2026-11-13","文部科学省","【総合職施設系・一般職施設系対象】文科省施設系ミートアップ -建築・機械・電気の専門性を求む！- （令和8年10月，11月）（申込期限：各開催日前日正午）"]],"id":90},{"a":"government","s":"ongoing","k":"政策の実施","f":"経済・産業","t":"オンライン決済サービスの調達に向けた市場調査の実施","m":"令和9年度の運用に伴い、オンライン決済基盤の調達を行うため、事業者等から広く意見を収集し、今後の調達の参考とする。","d":"2026-10","e":"2026-11","r":"government","n":1,"src":[["国家資格等情報連携・活用システムにおけるオンライン決済サービスの調達に係る市場調査（PDF／308KB）","https://www.digital.go.jp/assets/contents/node/basic_page/field_ref_resources/e98a2d2e-f6da-4dce-a3c3-360a38616d8d/4ceb358a/20261029_procurement_request_for_information_1.pdf","2026-11-13","デジタル庁","令和９年度の本システムの運用に伴い、国家資格等に関する手続に係るオンライン決済を利用可能とするに当たって、オンライン決済サービスの調達（以下「本調達」という。）において、...事業者等から広く意見を収集し、今後の調達の参考とするものである。"]],"id":117},{"a":"government","s":"planned","k":"政策の実施","f":"医療","t":"学校医等の公務災害補償制度の政令を改正","m":"公立学校の学校医等の公務災害補償制度について、他の公務員制度との均衡を図るため、男女差の解消措置を盛り込む政令を今年度中に改正し、令和九年四月一日から施行する予定。","d":"2026-10","e":"2027-03","r":"government","n":1,"src":[["衆議院 文部科学委員会 第3号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/9","2026-10-30","国会会議録","今後、他の公務員に係る災害補償制度と均衡を失しないよう、今年度中に政令を改正し、他の制度と同様に令和九年四月一日から施行できるように準備する予定でございます。"]],"i anned","k":"政策の実施","f":"子育て・教育","t":"民間教育保育等事業者への周知・情報提供を自治体に要請","m":"性暴力防止の徹底の観点から、民間教育保育等事業者に対して、認定に係る積極的な周知、情報提供に取り組むよう各自治体に対応を求めている。","d":"2026-10-01","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（スポーツ庁次長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/152","2026-10-28","国会会議録","今年の十月に、性暴力防止の徹底の観点から、民間教育保育等事業者に対して、認定に係る積極的な周知、情報提供に取り組んでいただきたい旨、各自治体に対応をお願いしているところでございます。"]],"id":813},{"a":"government","s":"planned","k":"閣議決定・計画","f":"行政・デジタル","t":"サイバー攻撃対策の強化と官民連携の推進","m":"サイバー対処能力強化法に基づき、設立された協議会を活用し、情報共有や官民連携を強化する。従来の注意喚起に加え、アクセス・無害化措置を含め、戦略的に選択し未然防止に取り組む。","d":"2026-10-01","e":"","r":"government","n":1,"src":[["参議院 デジタル社会の形成及び人工知能の活用等に関する特別委員会 第3号（内閣官房内閣審議官の発言）","https://kokkai.ndl.go.jp/txt/122215385X00320261028/158","2026-10-28","国会会議録","政府といたしましては、今後とも、サイバー対処能力強化法に基づきまして、十月一日に設立された協議会を活用し、一連のサイバー攻撃に関する情報共有を行うなど、官民連携を更に強化するとともに、従来の注意喚起等の措置に加えまして、新たに導入されましたアクセス・無害化措置の効果的かつ適切な実施を含めまして、あらゆる対象オプションを戦略的に選択することにより、サイバー攻撃の未然防止、被害拡大の防止に取り組んでまいります。"]],"id":1004},{"a":"government","s":"done","k":"法案・制度","f":"行政・デジタル","t":"サイバー対処能力強化法のアクセス・無害化措置施行","m":"内閣官房によるサイバー対処能力強化法に基づき、アクセス・無害化措置が施行された。","d":"2026-10-01","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（財務大臣・内閣府特命担当大臣（金融）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/175","2026-10-27","国会会議録","内閣官房の、サイバー対処能力強化法のアクセス・無害化措置、これ今月の一日から施行したばかりで"]],"id":1473},{"a":"government","s":"done","k":"声明・談話","f":"外交・安全保障","t":"アメリカ側に対し抗議と再発防止策を申し入れ","m":"強盗殺人事件を受け、アメリカ側に対し強く抗議するとともに、捜査への全面的な協力、隊員教育の徹底、綱紀粛正、事件・事故防止、遺族への適切な対応を厳正に申し入れた。","d":"2026-10-04","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（防衛大臣政務官・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/39","2026-10-28","国会会議録","この事案を受け、十月四日、アメリカ側に対し、強く抗議するとともに、捜査への全面的な協力を求め、このような悲劇が繰り返されることがないよう、隊員に対する教育の徹底、綱紀粛正、事件、事故防止の徹底、そして被害者の御遺族に対する適切な対応を厳正に申し入れました。"]],"id":994},{"a":"government","s":"planned","k":"閣議決定・計画","f":"環境・エネルギー","t":"予備費に係る交付金の対象事業の閣議決定","m":"令和8年10月6日に閣議決定された予備費に係る交付金の対象事業が定められた。対象は、特定外来生物防 61027/104","2026-10-27","国会会議録","給特法の見直しを中心に現場目線でお伺いをしたいと思います。...こうした形骸化を国としてどのように把握し改善を促していくのか、その方針をお伺いします。"]],"id":1197},{"a":"cdp","s":"done","k":"提言・要望","f":"福祉","t":"学校の状況把握のための調査協力要請","m":"都道府県教育委員会などを通じて、学校の状況を文科省が把握できるよう、調査への協力を求める。","d":"2026-10-27","e":"","r":"opposition","n":1,"src":[["参議院 文教科学委員会 第2号（立憲民主・無所属の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/66","2026-10-27","国会会議録","都道府県教育委員会とか私学担当課を通じて、それぞれの学校に、このような調査があるけれども、文科省としてやっぱり把握する必要があると思うから協力をしてくれと言うことは可能だというふうに思いますので、是非お願いをさせていただきたいと思います。"]],"id":1209},{"a":"cdp","s":"done","k":"提言・要望","f":"子育て・教育","t":"学校への養護教諭必置のための制度改正要求","m":"不登校などの状況に対応するため、学校に養護教諭をしっかり配置するための制度改正が必要であると提言した。","d":"2026-10-27","e":"","r":"opposition","n":1,"src":[["参議院 文教科学委員会 第2号（立憲民主・無所属の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/66","2026-10-27","国会会議録","この養教を必置とするために必要な制度改正を行うべきではないかと考えますけれども、まず、このことについてのお考えをお伺いをいたします。"]],"id":1210},{"a":"cdp","s":"ongoing","k":"提言・要望","f":"司法・治安","t":"性暴力対策における手続き簡便化の協議を要望","m":"児童生徒に対する教員の性暴力について、不必要な手続きをなくし、今あるシステムの中で簡便な措置ができるよう、文科省と家庁で協議を行うよう要望した。","d":"2026-10-27","e":"","r":"opposition","n":1,"src":[["参議院 文教科学委員会 第2号（立憲民主・無所属の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/43","2026-10-27","国会会議録","それが一体どこがどのように簡便な措置ができるのかというのを、今、今井副大臣もおっしゃっていただいたように、文科省さんとこ家庁さんで十分ちょっと協議をしていただきたい。"]],"id":1220},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"私用端末の業務外利用防止に向けた指導の実施","m":"私用端末で児童生徒等を業務外の目的で撮影することがないよう、端末利用やデータに関するルールの明確化が必要である旨を示し、各教育委員会に対して指導している。","d":"2026-10-27","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/28","2026-10-27","国会会議録","文部科学省といたしましては、この私用端末で児童生徒等を業務外の目的で撮影することがないように、端末の利用やデータとかについてのルールの明確化、これが必要である旨を示すとともに、様々な機会を捉えて各教育委員会に対して指導しているところではございます。"]],"id":1226},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"教員の性暴力等防止等に基づく基本指針の徹底","m":"教員の性暴力等防止等に基づく基本指針を定めているが、その趣旨を現場の教職員に徹底・理解させ、児童生徒等への性暴力等の根絶に向けて全力で取り組んでいく。","d":"2026-10-27","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/28","2026-10-27","国会会議録","文部科学省といたしましては、教員の性暴力等防止等に基づく基本指針を定めておるところではございますが、ルールを設定するだけではなくて、繰り返しになりますが、その趣旨を現場の教職員に徹底、理解させ、理解徹底していただくこと、このことが何よりも重要でございまして、日常的な取組を粘り強くしてまいりたいと思いますし、今後、各自治体においても、そういうふうなルールの設定状況の把握や設定等の周知も含めまして、児童生徒等への性暴力等の根絶、これに向けて全力で取り組んでまいりたいと思います。"]],"id":1227},{"a":"cdp","s":"done","k":"提言・要望","f":"政治・選挙","t":"議員会館パーティー支出に関する情報開示を要求","m":"議員会館のパーティーにおける支出（おすし屋への5万円など）や参加人数、パーティー券の価格など、詳細な情報を明らかにするよう理事会に申し入れた。","d":"2026-10-27","e":"","r":"opposition","n":2,"src":[["参議院 文教科学委員会 第2号（立憲民主・無所属の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/23","2026-10-27","国会会議録","申し訳ない、これちょっと理事会で、是非この今質問で申し上げた中身について提出をしていただくようにお取り計らい願えませんか。"],["参議院 外交防衛委員会 第2号（立憲民主・無所属の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/119","2026-10-27","国会会議録","Ｇ７オンライン会議について、議長国フランスから開催日、開催時刻がいつ日本に連絡が来たのか、時系列に沿って説明、総理大臣が欠席した理由、外務大臣が欠席した理由、そして、これを政府の、もうみんなばらばらばらばら言うことが違うんですよ、統一した見解を本委員会に出していただきたいことと、一回目から十七回目までのＧ７首脳オンライン会議の出席者の一覧を本委員会に提出することを求めます。"]],"id":1228},{"a":"government","s":"done","k":"提言・要望","f":"外交・安全保障","t":"アメリカ側に対し、事件を受けて申入れを実施","m":"那覇市における事件を受け、アメリカ側に対して様々なレベルから申入れを行った。","d":"2026-10-27","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（防衛大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/199","2026-10-27","国会会議録","今回の事件を受けて、アメリカ側に対しては、私を含め様々なレベルから申入れを行ってきたところであります。"]],"id":1239},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"人権・共生","t":"外国人受入れの基本方針を政府全体で検討","m":"外国人の受入れの基本的な在り方について、内閣官房を中心に政府全体で総合的に検討を進めている。","d":"2026-10-27","e":"2027-03","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/196","2026-10-27","国会会議録","政府として本年度中に基本方針を取りまとめるべく、司令塔たる内閣官房を中心に政府全体で総合的に今検討を進めているところであります。"]],"id":1241},{"a":"government","s":"done","k":"その他","f":"外交・安全保障","t":"沖縄コミュニティ・パートナーシップを創設","m":"米軍、日本政府、沖縄県を含む地元関係者との協力のための枠組みとして「沖縄コミュニティ・パー うこと、それから、特に本則課税に移行することが困難な農林漁業者について、経営継続が困難とならないような個別の売上高を踏まえた金額を給付する仕組みを導入するなど、既に関係者との議論は相当綿密に丁寧に長いことやっておりますが、そうもう開きはないなと思っておりますけれども、更に丁寧に耳を傾けながら検討を進めて結論を得たいと思っております。"]],"id":1465},{"a":"government","s":"ongoing","k":"政策の実施","f":"経済・産業","t":"食品・外食事業者への支援策の検討","m":"食品事業者や外食事業者に対し、業態や事業環境の違いを考慮し、実情重視で丁寧に寄り添う支援策を検討している。","d":"2026-10-27","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（財務大臣・内閣府特命担当大臣（金融）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/183","2026-10-27","国会会議録","食品事業者、外食事業者につきましても、...具体的にどのように寄り添ったら一番いいのかということにつきましても、一くくりではなく実情重視で丁寧に講じられるように検討しておりますが、"]],"id":1466},{"a":"government","s":"ongoing","k":"政策の実施","f":"経済・産業","t":"金融機関の個別事情に即した適切な対応を徹底","m":"被害者と銀行間の協議における不安を踏まえ、金融機関に対し、個別の事情に即した柔軟で適切な対応を取るよう確認し、徹底を促す。","d":"2026-10-27","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（金融庁銀行・証券監督局長の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/178","2026-10-27","国会会議録","そういった声を踏まえて、当行が柔軟に個別の事情に即した適切な対応を取るように、我々としても改めてよく促して、それを求めて徹底していくようにしていかなきゃいけないというふうに思っております。"]],"id":1467},{"a":"government","s":"ongoing","k":"政策の実施","f":"行政・デジタル","t":"被害組織からの情報提供に基づき支援や措置を講じる","m":"被害組織から様々な情報提供を受けた上で、その事情に応じまして必要な支援や措置を講じることとしております。","d":"2026-10-27","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（内閣官房内閣審議官の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/176","2026-10-27","国会会議録","政府では、被害組織から様々な情報提供を受けた上で、その事情に応じまして必要な支援や措置を講じることとしております。"]],"id":1468},{"a":"government","s":"ongoing","k":"政策の実施","f":"司法・治安","t":"被害の申告を受け、必要に応じて捜査を実施","m":"警察当局におきましても、被害の申告を受けて、必要に応じて捜査を行うことになります。","d":"2026-10-27","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（内閣官房内閣審議官の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/176","2026-10-27","国会会議録","また、警察当局におきましても、被害の申告を受けて、必要に応じて捜査を行うことになります。"]],"id":1469},{"a":"government","s":"planned","k":"法案・制度","f":"財政・税制","t":"補助金等の透明化に向けた具体化検討の実施","m":"企業の経営戦略や事務負担に配慮しつつ、補助金等の交付先名公表を踏まえ、一層の透明化を図る観点から具体化に向けた検討を行う。令和九年度税制改正で結論を得る予定。","d":"2026-10-27","e":"2027-09","r":"government ,"m":"不正アクセスによる情報漏えい等の事案を踏まえ、教育委員会に対してサイバーセキュリティー対策等について注意喚起や情報提供を行っている。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/192","2026-10-28","国会会議録","改めまして教育委員会に対してサイバーセキュリティー対策等について注意喚起や情報提供を行っております。"]],"id":784},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"子育て・教育","t":"教育データの利活用に係る留意事項の周知徹底","m":"教育データの利活用について、個人情報の適正な取扱いと適切なセキュリティー対策を確保するため、文部科学省が留意事項を取りまとめ、今後も様々な機会を捉えて周知徹底に取り組む。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省大臣官房学習基盤審議官の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/190","2026-10-28","国会会議録","文部科学省といたしましては、昨今の不正アクセスによる漏えい等の事案を受けまして、教育委員会などに対して、個人情報の取扱いを委託するような場合にも個人情報の適正な取扱いや適切なセキュリティー対策が行われるよう、今ガイドラインのお話もありましたが、今後とも引き続き様々な機会を捉えて、教育データの利活用に係る留意事項を始めとしまして、その中身の周知徹底に取り組んでまいりたいと思っております。"]],"id":786},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"教育委員会等への個人情報取扱いの留意事項提示","m":"教育委員会に対し、漏えい等の事案発生時の迅速な対応体制整備、委託先での個人情報範囲の必要最低限化、委託終了時の個人情報消去に関する契約書への明記を求めている。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省大臣官房学習基盤審議官の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/190","2026-10-28","国会会議録","例えば、この留意事項の中で、文部科学省としては、教育委員会において漏えい等の事案の発生又は兆候を把握した場合には適切かつ迅速に対応するための体制を整備してください、また、委託先において取り扱う個人情報の範囲は業務内容に照らして必要最低限にしてください、また、委託終了時には個人情報の消去に関する事項も契約書に取り入れてください、こういったものをお示しさせていただいているところでございます。"]],"id":787},{"a":"government","s":"done","k":"政策の実施","f":"福祉","t":"合理的配慮の明記等に関する通知の実施","m":"特別支援学校等の児童生徒に対する個別の教育支援計画の作成及び情報共有に関して、合理的配慮の内容明記や進学時の情報引継ぎについて各教育委員会へ通知した。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/182","2026-10-28","国会会議録","文部科学省から各教育委員会への通知等におきまして、合理的配慮の内容を個別の教育支援計画に明記することや、進学等における情報の適切な引継ぎについて示しております。"]],"id":793},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"教職員向けオンライン講義配信と会議の実施","m":"国立特別支援教育総合研究所が実施するオンライン講義配信を活用し、文科省が主宰する教育委員会の担当者対象会議で周知を図り、高次脳障害に関する内容の充実を図る。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/156","2026-10-28","国会会議録","国立特別支援教育総合研究所が実施する教職員向けのオンライン講義配信、これをしっかりと活用しながら、高次脳障害に関する内容の充実を図っているとともに、文科省が主宰する教育委員会の担当者を対象とした会議でこういったことの周知をしっかりと図ってまいりたいと思います。"]],"id":811},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"地域クラブに対し情報配信と認定取得を促進","m":"地域クラブに対し、性暴力防止の対応を徹底させるため、関係者向けに分かりやすい情報を積極的に配信し、認定の取得を促す。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（スポーツ庁次長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/152","2026-10-28","国会会議録","今後も、関係者向けに分かりやすい情報を積極的に配信し、部活動改革ガイドラインに基づく認定の取得、さらには子供性暴力防止法に基づく認定の取得を促してまいりたいと考えております。"]],"id":814},{"a":"government","s":"done","k":"政策の実施","f":"子育て・教育","t":"地域クラブ活動の性暴力防止対策費用を国庫補助","m":"地域クラブ活動の運営団体が子供性暴力防止法に基づく認定を受けた場合、相談体制整備や指導者研修等の費用について国庫補助の対象としている。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（スポーツ庁次長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/150","2026-10-28","国会会議録","これらを実施するために必要な地域クラブ活動の運営団体等の人件費や自治体の体制整備につきましては、国庫補助の対象としております。"]],"id":816},{"a":"government","s":"done","k":"政策の実施","f":"子育て・教育","t":"教育改革先導校40校を採択","m":"多様な学習ニーズに対応した教育機会の確保に取り組む先導校を募集し、都道府県の課題に対応した具体的な教育改革の取組として評価できる40校を採択した。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/140","2026-10-28","国会会議録","都道府県の課題に対応した具体的な教育改革の取組として評価できる四十校を今般採択したところでございます。"]],"id":825},{"a":"government","s":"done","k":"法案・制度","f":"子育て・教育","t":"通信教育に係るガイドラインを設置","m":"通信教育本体の授業料とサポート施設費用の区別、および生徒・保護者への事前説明を求めている。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省大臣官房学習基盤審議官の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/138","2026-10-28","国会会議録","文科省では、通信教育に係るガイドラインを設けておりまして、その中では、通信教育本体に係る授業料とサポート施設などが独自で行う活動、こういった費用を明確に区別すること、区別した上でちゃんと生徒や保護者さんに事前に分かるように説明するように、こういったこともお示ししてお願いしているところでございます。"]],"id":829},{"a":"government","s":"planned","k":"政策の実施","f":"子育て・教育","t":"高校教育改革交付金による支援の実施","m":"都道府県が策定する高校教育改革実行計画に基づいた取り組みに対し、交付金による支援を行い、公立高校全体の教育の質の向上を図る。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/102","2026-10-28","国会会議録","現在、都道府県で策定されます高校教育改革実行計画、これにつけられました取組に対して、この交付金による面での支援を行ってまいりたい、高校の教育改革の全国的な実装、加速をしっかりと図ってまいりまして、公立高校全体の教育の質の向上に取り組んでまいりたい、そのように考えているところでございます。"]],"id":867},{"a":"government","s":"done","k":"政策の実施","f":"環境・エネルギー","t":"放射線教育に関する出前授業を実施","m":"児童生徒等を対象として、放射線教育についての出前授業を実施している。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/84","2026-10-28","国会会議録","文部科学省といたしましては、児童生徒等を対象といたしました放射線教育についての出前授業を実施しているほか"]],"id":878},{"a":"government","s":"done","k":"政策の実施","f":"環境・エネルギー","t":"原子力教育支援事業交付金による教育支援","m":"原子力・エネルギー教育支援事業交付金により、都道府県が主体的に実施する原子力教育を支援している。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/84","2026-10-28","国会会議録","原子力・エネルギー教育支援事業交付金によりまして、都道府県が主体的に実施する原子力教育を支援しているところでございます。"]],"id":879},{"a":"government","s":"done","k":"予算・税制","f":"財政・税制","t":"公立学校施設整備費として4,380億円を要求","m":"公立学校施設整備費として四千三百八億円を要求している。また、補助単価についても物価高騰を勘案し、令和八年度比で22.7％増の引上げを要求している。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省大臣官房文教施設企画・防災部長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/74","2026-10-28","国会会議録","令和九年度概算要求におきましては、公立学校施設整備費として四千三百八億円を要求しており、この中で、補助単価につきましても、物価高騰の動向等を勘案して、令和八年度比で二二・七％増の引上げを要求しているところでございます。"]],"id":882},{"a":"government","s":"done","k":"政策の実施","f":"子育て・教育","t":"就学前教育等に関する施策を実施","m":"こども家庭庁と連携し、就学前の子供に対する教育・保育の充実、いじめ・不登校・自殺対策、子供性暴力防止法の施行など幅広い分野で施策を実施してきた。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/69","2026-10-28","国会会議録","就学前の子供に対する教育、保育の充実や、総合的ないじめ、不登校、自殺対策、子供性暴力防止法の施行など子供への性暴力防止といった幅広い分野でこども家庭庁と連携して施策の実施に取り組んできたところでございます。"]],"id":894},{"a":"government","s":"planned","k":"政策の実施","f":"福祉","t":"自殺リスク生徒への対策ガイドラインを策定・周知","m":"有識者会議での議論を経てガイドラインを策定し、学校現場へ速やかに周知する。オーバードーズの問題も含め、自殺リスクを抱えた生徒への重点的な取り組みを行う。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/63","2026-10-28","国会会議録","今後、有識者会議での議論を経まして、策定次第速やかに学校現場へ周知してまいりまして、オーバードーズの問題も含めました自殺のリスクを抱えた生徒たちに対して一人でも多く、そして、できるだけ少なく、そのようなことが起こらないように重点的に取組を行ってまいりたいと思います。"]],"id":897},{"a":"government","s":"ongoing","k":"会議・協議","f":"行政・デジタル","t":"AI法を含む関連法制度のあり方検討のためのWGを立ち上げ","m":"AIのリスクが複雑化・深刻化する状況を踏まえ、有識者から成るワーキンググループを立ち上げ、AI法を含む関連法制度のあり方について検討を進める。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（内閣府科学技術・イノベーション推進事務局審議官の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/23","2026-10-28","国会会議録","新たに有識者から成るワーキンググループを立ち上げまして、ＡＩ法を含みます関連法制度の在り方につきまして検討を進めることとしておりまして、本日、この後、第一回目を開催し、精力的に検討をこれから進めていくこととしてございます。"]],"id":914},{"a":"government","s":"done","k":"政策の実施","f":"子育て・教育","t":"高校教育改革のパイロットケースを採択","m":"理工系人材などの改革のパイロットケースとして、158の改革先導校を採択した。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/19","2026-10-28","国会会議録","まずは理工系人材などの改革のパイロットケースとして、先般、百五十八の改革先導校を採択したところでございます。"]],"id":919},{"a":"government","s":"done","k":"声明・談話","f":"子育て・教育","t":"東京大学の説明責任の重要性を繰り返し表明","m":"文部科学省は、関大臣が閣議後会見において、東京大学が説明責任を果たすことが重要である旨を繰り返し述べてきた。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省高等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/5","2026-10-28","国会会議録","文部科学省としては、関大臣が閣議後会見におきまして、東京大学として説明責任を果たすことが重要である旨、繰り返し述べてきたところであり"]],"id":929},{"a":"government","s":"planned","k":"法案・制度","f":"医療","t":"特定B型肝炎ウイルス感染者給付金等支給法案を提出","m":"特定B型肝炎ウイルス感染者給付金等を支給するための措置を講じるため、給付金の請求期限を令和14年3月31日まで延長する。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第3号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00320261028/2","2026-10-28","国会会議録","このため、請求期限を令和十四年三月三十一日まで延長することとします。"]],"id":931},{"a":"jimin","s":"done","k":"会議・協議","f":"医療","t":"特定B型肝炎ウイルス感染者給付金法案を議題とする会議開催","m":"内閣提出の特定B型肝炎ウイルス感染者給付金等の支給に関する特別措置法の一部を改正する法律案について、趣旨の説明を聴取した。","d":"2026-10-28","e":"","r":"ruling","n":1,"src":[["衆議院 厚生労働委員会 第3号（自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00320261028/1","2026-10-28","国会会議録","内閣提出、特定Ｂ型肝炎ウイルス感染者給付金等の支給に関する特別措置法の一部を改正する法律案を議題といたします。"]],"id":932},{"a":"government","s":"done","k":"声明・談話","f":"外交・安全保障","t":"米国大使を召喚し、遺憾の意と協力・再発防止を強く申し入れ","m":"米国大使を外務省に召喚し、今回の事件について極めて遺憾であること、捜査への全面的な協力、綱紀粛正、再発防止を強く申し入れた。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/180","2026-10-28","国会会議録","米国大使、グラス大使を外務省に召喚いたしまして、そこで、今回の事件については極めて遺憾である、捜査に対する全面的な協力、そしてまた綱紀粛正、さらには今後の再発防止、これも強く申し入れたところであります。"]],"id":938},{"a":"government","s":"ongoing","k":"会議・協議","f":"外交・安全保障","t":"日米間のハイレベル事務方で再発防止策を協議","m":"日米間のハイレベルの事務方で協議を進めており、教育、パトロール、リバティー制度の在り方など、具体的な再発防止につながる措置について検討している。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/180","2026-10-28","国会会議録","既に日米間のハイレベルの事務方で協議を進めているところであります。今の段階で協議の結果について予断を持って申し上げることはできないのでありますけれども、議論の対象としては、例えば、教育の問題はどうしていくのか、またパトロールの問題はどうしていくのか、さらにはリバティー制度の在り方等々も考えられると思っておりまして、これらについてしっかりと検討して、単に検討するだけではなくて、具体的な再発防止につながるような措置につなげていきたい、そう考えています。"]],"id":939},{"a":"government","s":"done","k":"法案・制度","f":"農林水産","t":"食糧法を改正し民間備蓄を創設","m":"機動的な放出を可能とするため、民間事業者の商流を活用する民間備蓄を、政府備蓄を補完するものとして創設した。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（農林水産省農産局農産政策部長の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/172","2026-10-28","国会会議録","食糧法を改正いたしまして、民間事業者の商流を活用する民間備蓄を、政府備蓄を補完するものとして創設をいたしております。"]],"id":940},{"a":"government","s":"done","k":"政策の実施","f":"外交・安全保障","t":"ウクライナに対する総額約200億ドルの支援を実施","m":"総額約二百億ドルのウクライナ支援を表明し、実施してきた。","d":"2026-10-28","e":"","r":"government","n":2,"src":[["衆議院 外務委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/160","2026-10-28","国会会議録","我が国としては、これまで、総額約二百億ドルのウクライナ支援を表明し、実施をしてきました。"],["衆議院 外務委員会 第2号（外務省大臣官房参事官の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/130","2026-10-28","国会会議録","我が国は、これまで、総額約二百億ドルにもわたるウクライナ支援を表明し、実施してきたところでございます。こういった支援が適切に実施されるということは、委員御指摘のとおり極めて重要でございまして、これまでもウクライナ政府を始めとした関係機関と密接に連携してしかるべき対応をしてきているところでございます。"]],"id":959},{"a":"dpfp","s":"done","k":"提言・要望","f":"防災・災害","t":"仙台防災枠組の取り組み加速を政府に要望","m":"仙台防災枠組の取り組みを加速させる機会として、来年のアジア太平洋防災閣僚級会議に向けて、成果や調整状況を政府に確認するよう求めた。","d":"2026-10-28","e":"","r":"opposition","n":1,"src":[["衆議院 外務委員会 第2号（国民民主党・無所属クラブの発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/140","2026-10-28","国会会議録","この機会に、是非、実際により強く動かしていくための合意を残していただきたいなというふうに思いますけれども、ここでも茂木外務大臣にお伺いさせていただきます。"]],"id":970},{"a":"government","s":"done","k":"政策の実施","f":"外交・安全保障","t":"ウクライナへの財政・復旧復興・人道支援を実施","m":"ウクライナに対し、財政、復旧復興、人道の分野で、総額約二百億ドルの支援を表明し、着実に実施している。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/124","2026-10-28","国会会議録","ウクライナに対しては、財政、さらには復旧復興、人道の分野で、これまで、総額約二百億ドルの支援というものを表明して、着実に実施をしてきているところであります。"]],"id":975},{"a":"government","s":"done","k":"政策の実施","f":"外交・安全保障","t":"ロシアに対する追加制裁の発動","m":"国際社会の根幹を揺るがすロシアによる侵略に対し、追加の制裁を発動した。これはウクライナ戦争だけでなく、ロ朝の軍事協力の文脈で行われている。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/118","2026-10-28","国会会議録","先日発表したロシアに対する追加の制裁でありますけれども、これは単にウクライナ戦争ということだけでなくて、もちろん国際社会の根幹を揺るがすロシアによります侵略というものは暴挙でありまして、許容できない"]],"id":978},{"a":"government","s":"done","k":"政策の実施","f":"環境・エネルギー","t":"原油の放出を実施","m":"日本がどこよりも早く原油の放出を実施した。","d":"2026-10-28","e":"","r":"government","n":1,"sr 支援を民間事業者に対してしていくことができるのか、その認識をお伺いいたします。"]],"id":1058},{"a":"dpfp","s":"ongoing","k":"提言・要望","f":"財政・税制","t":"必要な予算確保と施策の拡充を要望","m":"補正の当初化の状況を踏まえ、予算要求の在り方や財務折衝の中身が変化している中で、必要な予算を確保し、施策の拡充を求める。","d":"2026-10-28","e":"","r":"opposition","n":1,"src":[["参議院 デジタル社会の形成及び人工知能の活用等に関する特別委員会 第3号（国民民主党・新緑風会の発言）","https://kokkai.ndl.go.jp/txt/122215385X00320261028/65","2026-10-28","国会会議録","しっかりと必要な予算確保していただきたいと思います。今回、補正の当初化ということで、予算要求の在り方であったりですとか財務折衝の中身も随分様変わりしているんじゃないかなと思いますけれども、是非ともその大臣の御決意の下、しっかり拡充をしてもらいたいと思います。"]],"id":1061},{"a":"dpfp","s":"ongoing","k":"提言・要望","f":"行政・デジタル","t":"マイナンバー制度の拡充と一体となった制度改正を提言","m":"各省庁所管の課題が足並みを揃えないため、デジタル庁が全体を底上げし、マイナンバー制度を拡充した一体となった制度改正を行うべきと提言。","d":"2026-10-28","e":"","r":"opposition","n":1,"src":[["参議院 デジタル社会の形成及び人工知能の活用等に関する特別委員会 第3号（国民民主党・新緑風会の発言）","https://kokkai.ndl.go.jp/txt/122215385X00320261028/65","2026-10-28","国会会議録","この一体となった制度改正に向けての大臣の御決意をお伺いできますか。"]],"id":1062},{"a":"government","s":"ongoing","k":"会議・協議","f":"行政・デジタル","t":"地方税の電子化推進に関する検討会で課題を議論","m":"総務省、地方税共同機構、地方団体等で構成する検討会において、電子請求・交付の対象証明書やシステム構成などの導入課題について議論を行っている。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["参議院 デジタル社会の形成及び人工知能の活用等に関する特別委員会 第3号（総務省大臣官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122215385X00320261028/62","2026-10-28","国会会議録","現在、同検討会におきまして、例えば電子請求・交付の対象とする証明書について、地方団体ごとに記載事項等が異なる場合があることや、改修規模やコスト等の観点からどのようなシステム構成が望ましいかなど、導入に当たっての課題について議論を行っているところであります。"]],"id":1063},{"a":"government","s":"done","k":"政策の実施","f":"行政・デジタル","t":"制度所管省庁への情報照会件数データ提供と実態調査","m":"会計検査院の報告を受け、制度所管省庁に対し事務手続ごとの情報照会件数データを提供し、自治体の課題把握のための実態調査を実施した。","d":"2026-10-28","e":"","r":"government","n":1,"src":[["参議院 デジタル社会の形成及び人工知能の活用等に関する特別委員会 第3号（デジタル大臣政務官・内閣府大臣政務官・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215385X00320261028/58","2026-10-28","国会会議録","デジタル庁では、制度所管省庁に対して、事務手続ごとの情報照会件数のデータを提供するとともに、自治体がマイナンバー情報連携を実施する上での課題を把握するために実態調査を行いました。"]],"id":1066},{"a":"government","s":"done","k":"政策の実施","f":"行政・デジタル","t":"法務省への専門人材派遣とシステム支援","m":"出入国管理に係るシステムについて、法務省へ専門人材を派遣し、システム統合 理の指示を受け、米国や韓国等と緊密に連携しつつ、情報収集・分析に全力を挙げること、不測の事態の発生に備え、引き続き警戒監視に万全を期すよう指示を出した。","d":"2026-10-29","e":"","r":"government","n":1,"src":[["北朝鮮のミサイル等関連情報（続報）について","https://www.mod.go.jp/j/press/news/2026/10/29d.html","2026-10-29","防衛省","また、防衛省においては、防衛大臣が総理指示を受け、米国、韓国等と緊密に連携しつつ、情報収集・分析に全力を挙げること不測の事態の発生に備え、引き続き警戒監視に万全を期すことの２点について指示を出しました。"]],"id":777},{"a":"government","s":"ongoing","k":"声明・談話","f":"外交・安全保障","t":"追加情報を入手した場合、速やかに公表する方針","m":"国民の生命・財産を守るため、引き続き米国や韓国等と緊密に連携し、情報の収集・分析及び警戒監視に全力を挙げるとともに、今後追加して公表すべき情報を入手した場合には速やかに発表する。","d":"2026-10-29","e":"","r":"government","n":1,"src":[["北朝鮮のミサイル等関連情報（続報）について","https://www.mod.go.jp/j/press/news/2026/10/29d.html","2026-10-29","防衛省","国民の生命・財産を守り抜くため、引き続き、米国や韓国等とも緊密に連携し、情報の収集・分析及び警戒監視に全力をあげるとともに、今後追加して公表すべき情報を入手した場合には、速やかに発表することとします。"]],"id":778},{"a":"sanseito","s":"done","k":"提言・要望","f":"医療","t":"B型肝炎給付金制度の改善を要求","m":"B型肝炎の給付金制度について、本人提訴のハードルを下げるよう求め、弁護士費用負担軽減手当金の乖離を指摘し、給付金を全額受け取れる環境整備を要求した。","d":"2026-10-30","e":"","r":"opposition","n":1,"src":[["【国会質疑・厚生労働委員会】 B型肝炎給付金制度の課題と今後の支援を問う｜豊田真由子（R8.10.30）","https://sanseito.jp/news/n11677/","2026-11-10","参政党","和解が前提であることや、自力で準備可能な書類が多く本人提訴が可能である事実を周知しハードルを下げるよう求めました。あわせて、弁護士費用負担を軽減する手当金が給付金額の4％であるのに対し実際の費用が20％に達する乖離を挙げ、給付金を全額受け取れる環境整備を要求。"]],"id":338},{"a":"sanseito","s":"done","k":"提言・要望","f":"医療","t":"新薬の迅速な医療費助成と要件緩和を要請","m":"B型肝炎等の新薬「ベピロビルセン」について、自治体実務の遅れを防ぐ迅速な医療費助成を要請し、肝癌や重度肝硬変等の助成要件である月数要件の緩和を求めた。","d":"2026-10-30","e":"","r":"opposition","n":1,"src":[["【国会質疑・厚生労働委員会】 B型肝炎給付金制度の課題と今後の支援を問う｜豊田真由子（R8.10.30）","https://sanseito.jp/news/n11677/","2026-11-10","参政党","続いて豊田議員は、自身の免疫による機能的治癒が期待されるB型肝炎等の新薬「ベピロビルセン（商品名ヒブサーゴ）」について、自治体実務の遅れを防ぐ迅速な医療費助成を要請。あわせて、肝癌や重度肝硬変等の助成要件である「高額療養費で24か月中2か月以上該当」という月数要件の緩和を求めました。"]],"id":339},{"a":"sanseito","s":"done","k":"提言・要望","f":"経済・産業","t":"創薬への資金供給拡大を提案","m":"創薬スタートアップへのリスクマネー供給不足を問題視し、GPIF（年金積立金管理運用独立行政法人）のオルタナティブ投資枠の余力を生かした創薬への資金供給を提案した。","d":"2026-10-30","e":"","r":"opposition","n":1,"src":[["【国会質疑・厚生労働委員会】 B型肝炎給付金制度の課題と今後の支援を問う｜豊田真由子（R8.10.30）","https://sanseito.jp/news/n11677/","2026-11-10","参政党","投資規模が約93倍に達する米国の年金基金の先行例を提示し、GPIF（年金積立金管理運用独立行政法人）のオルタナティブ投資枠の余力を生かした創薬への資金供給を提案しました。"]],"id":340},{"a":"sanseito","s":"done","k":"提言・要望","f":"科学技術","t":"創薬エコシステム構築のための人材育成を要求","m":"創薬の国家戦略として、研究・知財・経営などを担う専門人材の育成や、オープンイノベーションの促進を求めた。","d":"2026-10-30","e":"","r":"opposition","n":1,"src":[["【国会質疑・厚生労働委員会】 B型肝炎給付金制度の課題と今後の支援を問う｜豊田真由子（R8.10.30）","https://sanseito.jp/news/n11677/","2026-11-10","参政党","さらに、豊田議員は創薬の国家戦略を取り上げ、研究・知財・経営などを担う専門人材の育成や、オープンイノベーションの促進を求めました。"]],"id":341},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"学校健診に関する制度・運用の見直しを進める","m":"中間まとめを踏まえ、学校健診に関する制度や運用の見直し、先進的な取組事例の普及などを進めていく。","d":"2026-10-30","e":"","r":"government","n":2,"src":[["衆議院 文部科学委員会 第3号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/37","2026-10-30","国会会議録","今後、中間まとめを踏まえました学校健診に関する制度、運用の見直しや先進的な取組事例の普及などを進めていくとともに"],["衆議院 文部科学委員会 第3号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/29","2026-10-30","国会会議録","文部科学省としては、こうした制度、運用の見直しを進めてまいります。"]],"id":574},{"a":"government","s":"ongoing","k":"その他","f":"医療","t":"健康診断の実施体制の在り方について検討","m":"健康診断の充実と学校医等の負担軽減との両立を図る観点から、今後も実施体制の在り方について検討していく。","d":"2026-10-30","e":"","r":"government","n":2,"src":[["衆議院 文部科学委員会 第3号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/37","2026-10-30","国会会議録","健康診断の充実と学校医等の負担軽減との両立を図る観点から今後も実施体制の在り方について検討してまいりたいと考えております。"],["衆議院 厚生労働委員会 第4号（文部科学省大臣官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/47","2026-10-30","国会会議録","現在、文部科学省において有識者会議を開催し、教育関係者や医療関係者の意見等を踏まえながら議論をしているところでございまして、学齢期における健康診断の在り方についてもその中で検討してまいりたいと考えております。"]],"id":575},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"健康診断の重要性に関する資料作成と周知啓発","m":"児童生徒や保護者に対する健康診断の重要性に関する資料を作成し、周知啓発を図る。また、学校医が勤務する医療機関で受診できる取組事例の普及に努める。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第3号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/31","2026-10-30","国会会議録","総務省からは、児童生徒や保護者に対する健康診断の重要性に関する資料を作成し、周知啓発を図ることや、学校医が勤務する医療機関で受診できる取組事例の普及に努めることなどが求められており、まずはこうした取組を速やかに進めてまいります。"]],"id":577},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"医療","t":"健康診断を受けられなかった児童生徒の健康管理の検討","m":"文部科学省の有識者会議において、先進的に取り組んでいる自治体へのヒアリングを実施。その事例を参考に、健康診断を受けることができなかった児童生徒等の健康管理の在り方について検討を進める。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第3号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/31","2026-10-30","国会会議録","現在、文部科学省の有識者会議におきまして先進的に取り組んでいる自治体へのヒアリングを実施しておりまして、こうした取組事例も参考にしながら、健康診断を受けることができなかった児童生徒等の健康管理の在り方につきまして検討を進めてまいりたいと考えております。"]],"id":578},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"医療","t":"健康診断の持続可能な実施体制構築に取り組む","m":"有識者会議での議論を踏まえ、学校等と地域の関係機関が連携した健康診断の実施体制の在り方について検討を進め、持続可能な実施体制の構築に取り組む。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第3号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/29","2026-10-30","国会会議録","そこでの議論も踏まえまして持続可能な実施体制の構築に向けて取り組んでまいります。"]],"id":580},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"学校健診に関する通知の趣旨の周知徹底","m":"関係者間で通知の趣旨が共有されるよう、更なる周知に努める。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第3号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/25","2026-10-30","国会会議録","関係者間で通知の趣旨が共有されますように更なる周知に努めてまいります。"]],"id":581},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"学校健診の検査項目や実施時期の見直し","m":"学校医等の負担軽減を進めるため、学校健診における検査項目や実施時期の見直しを進める。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第3号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/25","2026-10-30","国会会議録","学校健診におきます検査項目や実施時期の見直しを進めまして、学校医等の負担軽減を進めてまいります。"]],"id":582},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"医療","t":"持続可能な学校健診実施体制の構築に向けた検討","m":"有識者会議等で、学校や教育委員会と地域の関係機関が連携した健康診断の実施体制の在り方について今後検討を進め、持続可能な実施体制の構築に取り組む。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第3号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/25","2026-10-30","国会会議録","文部科学省の有識者会議では、学校や教育委員会等と地域の関係機関が連携しました健康診断の実施体制の在り方につきまして今後検討を進めることとしておりまして、そこでの議論も踏まえながら、児童生徒の健康の保持増進と学校医等の負担軽減に資する持続可能な実施体制の構築に向けまして取り組んでまいります。"]],"id":583},{"a":"government","s":"done","k":"政策の実施","f":"医療","t":"児童生徒の健康診断に関する通知を発出","m":"健康診断の実施にあたり、正確な検査・診察と同時に、児童生徒等のプライバシーや心情に配慮することが重要であるとの考え方を示した。具体的には、男女別の検査や個別スペースの確保などを進めるよう求めている。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第3号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/21","2026-10-30","国会会議録","お尋ねの通知では、児童生徒等の健康診断の実施について、正確な検査、診察を実施するとともに、児童生徒等のプライバシーや心情に配慮することが重要であるとの考え方を示しております。"]],"id":588},{"a":"government","s":"planned","k":"政策の実施","f":"医療","t":"健康診断通知の趣旨について一層の周知に努める","m":"有識者会議の中間まとめを受け、通知の趣旨について学校、学校医、保護者の間で十分共有されるよう、文部科学省として一層の周知に努める方針である。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第3号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/21","2026-10-30","国会会議録","文部科学省としては一層の周知に努めてまいりたいと考えております。"]],"id":589},{"a":"government","s":"done","k":"政策の実施","f":"医療","t":"医療機関等への委託による代替医師の確保","m":"配置状況が100%でない場合、地域に医師等がいないなどのやむを得ない事情があるとき、医療機関等への委託を通じて代替となる医師を確保し、学校の保健管理が滞りなく行われるようにしている。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第3号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/19","2026-10-30","国会会議録","地域に医師、歯科医師、薬剤師がいないなど、やむを得ない事情がある場合には、医療機関等への委託によりまして学校医等の代替となる医師等を確保し、各学校の保健管理が滞りなく行われるようにしているところでございます。"]],"id":591},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"児童生徒の健康診断制度の見直しと体制構築","m":"有識者会議の提言（一部検査項目の省略、実施時期の緩和など）を踏まえ、制度及び運用の見直しを進める。健康診断の質を確保しつつ、学校医等の負担軽減に資する持続可能な実施体制の構築に取り組む。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第3号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/13","2026-10-30","国会会議録","文部科学省といたしましては、まずは提言を踏まえました制度及び運用の見直しを進めますとともに、健康診断の質を確保しながら、学校医等の負担軽減にも資する持続可能な実施体制の構築に向けまして取り組んでまいります。"]],"id":595},{"a":"government","s":"done","k":"法案・制度","f":"年金","t":"国家公務員災害補償法等の改正案を提出","m":"国家公務員災害補償法や地方公務員災害補償法の改正案を臨時国会に提出。消滅時効期間の見直しや、遺族補償年金の受給資格要件・年金額の男女差解消を図る改正を行う。","d":"2026-10-30","e":"","r":"government","n":2,"src":[["衆議院 文部科学委員会 第3号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/9","2026-10-30","国会会議録","この臨時国会に提出されております国家公務員災害補償法や地方公務員災害補償法の改正案では、消滅時効期間の見直しのほか、遺族補償年金の受給資格要件や年金額に係る男女差の解消を図る改正が予定されているものと承知しております。"],["衆議院 文部科学委員会 第3号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/7","2026-10-30","国会会議録","制度の均衡を図るため、今般の改正法を提出しているものでございます。"]],"id":596},{"a":"government","s":"done","k":"法案・制度","f":"医療","t":"学校医等災害補償法に関する所要の見直しを実施","m":"国家公務員災害補償制度の改正に合わせて、学校医等災害補償法に関する所要の見直しを行ってきた。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第3号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/5","2026-10-30","国会会議録","こうした趣旨を踏まえ、国家公務員災害補償制度の改正に合わせて所要の見直しを行ってきたところでございます。"]],"id":599},{"a":"jimin","s":"done","k":"会議・協議","f":"医療","t":"公務災害補償法改正案の審議開始","m":"内閣提出の公立学校の学校医、学校歯科医及び学校薬剤師の公務災害補償に関する法律の一部を改正する法律案について、審議を開始し、政府参考人の出席を求めた。","d":"2026-10-30","e":"","r":"ruling","n":1,"src":[["衆議院 文部科学委員会 第3号（自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/1","2026-10-30","国会会議録","内閣提出、公立学校の学校医、学校歯科医及び学校薬剤師の公務災害補償に関する法律の一部を改正する法律案を議題といたします。"]],"id":600},{"a":"government","s":"planned","k":"政策の実施","f":"医療","t":"当該事業の更なる普及啓発と利用促進","m":"引き続き、当該事業の更なる普及啓発を行って、利用の促進を行っていきたいと考えている。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/112","2026-10-30","国会会議録","引き続き、当該事業の更なる普及啓発を行って、利用の促進を行っていきたいと考えております。"]],"id":605},{"a":"jcp","s":"planned","k":"提言・要望","f":"医療","t":"医療費の助成対象化を提言","m":"B型肝炎の根治薬について、患者の経済的負担を減らすため、自己負担一万円となる医療費の助成対象化を求める。","d":"2026-10-30","e":"","r":"opposition","n":1,"src":[["衆議院 厚生労働委員会 第4号（日本共産党の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/111","2026-10-30","国会会議録","患者の経済的負担を少なく新薬を使えるように、自己負担一万円となる医療費の助成対象化、これは歓迎をしたいというふうに思います。"]],"id":606},{"a":"jcp","s":"done","k":"法案・制度","f":"福祉","t":"B型肝炎被害者への給付金請求期限延長法案を支持","m":"集団予防接種の注射器連続使用によりB型肝炎ウイルスに感染した方々に対する給付金の請求期限を5年間延長する法案を支持した。","d":"2026-10-30","e":"","r":"opposition","n":1,"src":[["衆議院 厚生労働委員会 第4号（日本共産党の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/109","2026-10-30","国会会議録","本法案は、集団予防接種の際に注射器を交換せず連続使用したことによりＢ型肝炎ウイルスに感染した方々に対する給付金の請求期限を五年間延長するものであり、賛成をいたします。"]],"id":610},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"肝炎ウイルス検査の受検促進に努める","m":"感染に気づいていない方のために、肝炎ウイルス検査の受検促進や、検査結果を正しく認識できるような努力を続ける。","d":"2026-10-30","e":"","r":"government","n":2,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/102","2026-10-30","国会会議録","引き続き、検査を受検できる環境を整備をして、より一層の受診勧奨を図ることで、一人でも多くの方の給付につながるように取り組んでいきます。...ウイルス検査の一層の受検勧奨やあるいは無症候性キャリアの方に合わせた周知、これを行っていくことによりまして、できる限り多くの方に提訴をいただいて、早期の救済を図っていきたいと考えています。"],["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/75","2026-10-30","国会会議録","肝炎ウイルス検査の受検促進や、受検者が検査を受けたことを自覚して検査結果を正しく認識できることにより、一人でも多くの方が給付に結びつくよう努めてまいりたいと考えております。"]],"id":616},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"肝炎医療費助成制度の対象医療化","m":"B型肝炎ウイルス持続感染における機能的治癒の達成割合向上を目的とし、肝炎医療費助成制度の対象医療とすること。現在、必要な手続を進め、都道府県への説明や医療機関への周知を迅速に進める。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/90","2026-10-30","国会会議録","肝炎医療費助成制度の対象医療とすることが適当とされました。これらを踏まえまして、現在、必要な手続を進めております。各都道府県において早期の助成開始ができるように、今後、都道府県への説明、あるいは医療機関等への周知、これを迅速に進めていきます。"]],"id":629},{"a":"government","s":"planned","k":"予算・税制","f":"医療","t":"肝がん治療研究促進事業の要件緩和検討","m":"患者団体からの要望を受け、肝がん・重度肝硬変治療研究促進事業について、月数要件の更なる要件緩和を含め、今後の事業の在り方や必要な対応を予算編成過程で検討する。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/90","2026-10-30","国会会議録","これを踏まえまして、今後の事業の在り方につきましては、この月数要件の更なる要件緩和を含めまして、予算編成過程において必要な対応、これを検討してまいりたいと考えております。"]],"id":630},{"a":"government","s":"planned","k":"政策の実施","f":"医療","t":"B型肝炎特措法に基づき被害者の解決と救済を推進","m":"B型肝炎特別措置法に基づき、被害に遭われた方の早期の解決と救済が進むよう努める。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/79","2026-10-30","国会会議録","いずれにしても、Ｂ型肝炎特措法に基づきまして、被害に遭われた方の早期の解決と救済が進むよう努めてまいりたいと考えております。"]],"id":636},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"適切な情報提供のための周知を継続","m":"国から支給する訴訟手当金が給付金の四％である点を踏まえ、厚生労働省ホームページ上で対象者に適切な情報を提供する周知を今後も行う。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/77","2026-10-30","国会会議録","今後とも、厚生労働省ホームページ上において、対象者の方に適切な情報が提供されるよう、必要な周知を行ってまいりたいと思っております。"]],"id":637},{"a":"government","s":"done","k":"政策の実施","f":"医療","t":"電話相談窓口設置と訴訟手引きの掲載","m":"提訴を検討中の方へのきめ細やかな相談支援のため専用の電話相談窓口を設置し、手続の流れや必要書類をまとめた「B型肝炎訴訟の手引き」をホームページに掲載している。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/77","2026-10-30","国会会議録","従前より、専用の電話相談窓口の設置による、提訴を検討中の方へのきめ細やかな相談の支援、それから、御自身で提訴を考えている方向けの手続の流れや必要な書類についてまとめた「Ｂ型肝炎訴訟の手引き」のホームページへの掲載などを行っているところでございます。"]],"id":639},{"a":"government","s":"planned","k":"閣議決定・計画","f":"福祉","t":"給付金請求期限を5年間とする方針を提示","m":"給付金の請求期限について、制度の運用状況を適時検証する機会を勘案し、5年間という期間で運用したいと考えている。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/75","2026-10-30","国会会議録","そのような状況の変化ということをしっかり捉えるという意味では、五年間の請求期限という形にさせていただきたいというふうに考えておるところでございます。"]],"id":641},{"a":"government","s":"done","k":"会議・協議","f":"医療","t":"肝炎ウイルス検査結果の確実な伝達の要請","m":"自治体および肝炎診療の拠点病院との会議において、肝炎ウイルス検査の結果を確実に患者に伝えるよう要請した。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/73","2026-10-30","国会会議録","また、自治体、それから拠点病院、これは肝炎診療の拠点病院でございますが、との会議におきまして、肝炎ウイルス検査を確実に伝えるようお願いをしてきました。"]],"id":644},{"a":"government","s":"done","k":"政策の実施","f":"行政・デジタル","t":"戦没者の遺骨収集を法に基づいて実施","m":"沖縄と硫黄島において、法に基づき戦没者の遺骨収集を実施している。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/57","2026-10-30","国会会議録","国内における戦没者の遺骨収集におきましては、法に基づいて沖縄と硫黄島で実施をしているところでございます。"]],"id":652},{"a":"government","s":"done","k":"政策の実施","f":"行政・デジタル","t":"遺骨収集における独自の取組を実施","m":"国の取り組みに加え、沖縄県からの要望を踏まえ、ボランティア団体への支援などの独自の取り組みを実施している。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/57","2026-10-30","国会会議録","沖縄における遺骨収集に当たりましては、国の取組に加えまして、沖縄県からの要望も踏まえ、ボランティア団体への支援などの独自の取組も実施をしているところであります。"]],"id":653},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"健康日本21に基づき生活習慣病対策を推進","m":"国民の健康づくり運動である健康日本21に基づき、栄養、食生活、身体活動、運動、飲酒などの生活習慣の改善について目標を設定し、普及啓発を含む様々な取組を推進している。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/37","2026-10-30","国会会議録","国民の健康づくり運動である健康日本21に基づきまして、栄養、食生活、身体活動、運動、飲酒などの生活習慣の改善について目標を設定し、普及啓発を含む様々な取組を推進することで発症予防につなげております。"]],"id":659},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"肝炎対策基本方針に基づき診療体制を整備","m":"肝炎対策基本方針に基づき、肝疾患診療連携拠点病院や肝疾患専門医療機関において、非ウイルス性肝炎を含めて、肝疾患全般の専門的な診療が行われている。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/37","2026-10-30","国会会議録","肝炎対策基本方針に基づきまして、ウイルス性肝炎患者の診療体制を整備するために設置しています肝疾患診療連携拠点病院や肝疾患専門医療機関において、非ウイルス性肝炎を含めて、肝疾患全般の専門的な診療が行われております。"]],"id":660},{"a":"government","s":"planned","k":"政策の実施","f":"医療","t":"無症候性キャリア向け広報・リーフレット作成など新たな広報を実施","m":"無症候性キャリアの方を念頭に置いた広報やリーフレットの作成、駅等での広報など新たな工夫を加え、提訴につながるよう最大限努力する。","d":"2026-10-30","e":"2031-10-30","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/33","2026-10-30","国会会議録","とりわけ無症候性キャリアの方を十分念頭に置いた広報、リーフレットの作成など、しっかりやっていきたいと考えておりますし、また、一般の方に多く目にしていただけるような駅等での広報など、そうした新たな工夫も加えてしっかりとした広報をやることによりまして、できるだけこの五年間の間に多くの方の提訴につながるように、我々も最大限努力をしていきたいと考えています。"]],"id":669},{"a":"government","s":"done","k":"政策の実施","f":"医療","t":"都道府県等への通知と研修内容への明記","m":"肝炎医療コーディネーターの養成及び活用に関する都道府県等への通知において、コーディネーターの活動内容の例や研修内容に給付金制度を明記している。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/31","2026-10-30","国会会議録","その養成及び活用に関する都道府県等への通知において、コーディネーターの活動内容の例や都道府県が実施します研修内容に給付金制度を明記して研修していただいているという"]],"id":672},{"a":"government","s":"done","k":"政策の実施","f":"医療","t":"ハンドブックに給付金制度の内容を掲載","m":"コーディネーターが活動する際に使われるハンドブック（ポケットマニュアル）に、給付金制度に関する内容を掲載している。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/31","2026-10-30","国会会議録","コーディネーターの方が活動する際に使われるハンドブック、ポケットマニュアルという名称でございますけれども、ハンドブックにおいて、給付金制度に関する内容を掲載をしているところでございます。"]],"id":673},{"a":"government","s":"done","k":"政策の実施","f":"医療","t":"肝炎ウイルス検査結果にかかわらず患者への説明を通知","m":"厚生労働省は、手術前等に行われる肝炎ウイルス検査について、検査結果にかかわらず、患者本人への説明を適切に行うよう、医療機関や関係団体に通知している。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/29","2026-10-30","国会会議録","厚生労働省としては、手術前等に行われる肝炎ウイルス検査について、検査結果にかかわらず、患者本人への説明を適切に行うよう、医療機関や関係団体に通知をしております。"]],"id":674},{"a":"government","s":"done","k":"法案・制度","f":"医療","t":"診療報酬上、検査結果の文書提供を規定","m":"診療報酬上、手術前医学管理料及び短期滞在手術等基本料において、肝炎ウイルス検査を実施した場合、陰性の場合を含め、患者に結果を説明し文書により提供することとしている。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/29","2026-10-30","国会会議録","また、診療報酬上も、手術前医学管理料及び短期滞在手術等基本料におきまして、肝炎ウイルス検査を実施した場合には、陰性の場合を含め、患者に結果を説明し、文書により提供することとしております。"]],"id":675},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"検査結果を踏まえた受診・フォローアップの推進を依頼","m":"手術前に行われる肝炎ウイルス検査の結果を踏まえた受診、受療、フォローアップの推進について、医療機関に協力を依頼している。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/29","2026-10-30","国会会議録","さらに、手術前に行われる肝炎ウイルス検査の結果を踏まえた受診、受療、フォローアップの推進につきまして、医療機関に協力を依頼しておるところでございます。"]],"id":676},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"給付金制度の周知のためリーフレット配布を依頼","m":"B型肝炎訴訟給付金制度の周知について、毎年度、肝疾患連携拠点病院や肝疾患医療機関、医師会等に対し、リーフレットを配布して案内を行うようお願いしている。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/29","2026-10-30","国会会議録","こうした中で、Ｂ型肝炎訴訟給付金制度の周知については、毎年度、肝疾患連携拠点病院や肝疾患医療機関、それから医師会等に対してリーフレットを配布して、Ｂ型肝炎患者、感染者に対して給付金制度の案内を行っていただけるようお願いしておるところでございます。"]],"id":677},{"a":"government","s":"done","k":"政策の実施","f":"医療","t":"自治体における肝炎ウイルス検査体制の整備","m":"自治体において、無料または低額での肝炎ウイルス検査の実施、土日・夜間検査、医療機関委託による検査体制の整備を実施している。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/27","2026-10-30","国会会議録","自治体においては、無料又は低額での肝炎ウイルス検査の実施に加えまして、土日、夜間検査や、医療機関委託による検査体制の整備等の取組、これを行っております。"]],"id":679},{"a":"jimin","s":"done","k":"提言・要望","f":"司法・治安","t":"厚労省に対し給付金制度等の周知徹底を提言","m":"救済対象者が身近な法律事務所等で相談できるよう、厚労省に対し、給付金制度や和解手続、必要書類等を全国の弁護士事務所や司法書士事務所に周知徹底すべきと提言した。","d":"2026-10-30","e":"","r":"ruling","n":1,"src":[["衆議院 厚生労働委員会 第4号（自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/8","2026-10-30","国会会議録","救済対象者が居住するそれぞれの地域で身近な法律事務所等に相談しながら提訴できるよう、厚労省としても、給付金制度や和解手続、必要書類等を全国の弁護士事務所や司法書士事務所に周知徹底すべきと考えますが、いかがですか。"]],"id":688},{"a":"jimin","s":"ongoing","k":"法案・制度","f":"福祉","t":"請求期限延長の改正案に賛成","m":"特措法における請求期限の延長改正案に対し、多くの救済対象者に給付金を支給する機会を確保する観点から賛成した。","d":"2026-10-30","e":"","r":"ruling","n":1,"src":[["衆議院 厚生労働委員会 第4号（自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/4","2026-10-30","国会会議録","できるだけ多くの救済対象者に給付金を支給する機会、これを確保する観点から、今般の請求期限の延長の改正、賛成でございます。"]],"id":689},{"a":"government","s":"done","k":"政策の実施","f":"環境・エネルギー","t":"PFOS、PFOAの指針値を設定","m":"PFOS、PFOAを要監視項目に位置づけ、五十ナノグラム・パー・リットルを指針値として定めている。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第3号（環境省水・大気環境局長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00320261030/97","2026-10-30","国会会議録","環境省では、ＰＦＯＳ、ＰＦＯＡを要監視項目に位置づけまして、五十ナノグラム・パー・リットルを指針値として定めております。"]],"id":692},{"a":"government","s":"planned","k":"政策の実施","f":"環境・エネルギー","t":"PFAS処理方法について熊本県に技術的助言を実施","m":"工場排水の適切な処理方法について、実証実験の結果を踏まえ、関係省庁と連携し、熊本県に対して技術的な助言を行う。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第3号（国土交通省大臣官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122204006X00320261030/95","2026-10-30","国会会議録","国土交通省といたしましても、関係省庁と連携しながら、熊本県に対して技術的な助言を行うなど適切に対応してまいります。"]],"id":696},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"水俣病認定業務について関係県市を支援","m":"公健法の運用に関し、関係県市からの相談に真摯に対応し、引き続き密に連携しながら、認定業務について適時適切に支援していく。","d":"2026-10-30","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第3号（環境省大臣官房環境保健部長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00320261030/87","2026-10-30","国会会議録","引き続き、密に連携をしながら、関係県市の認定業務について適時適切に支援してまいりたいと考えております。"]],"id":697},{"a":"government","s":"done","k":"法案・制度","f":"福祉","t":"公健法改正のための法案を提出","m":"労働者災害補償保険法の改正に伴い、公健法の制度趣旨を考慮し、立法事実の確認を含め改正の必要性を判断し、法案を提出した。","d":"2026-10-30","e":"","r":"government","n":3,"src":[["衆議院 環境委員会 第3号（環境省大臣官房環境保健部長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00320261030/83","2026-10-30","国会会議録","この改正を受けまして、公健法の制度趣旨も考慮の上、立法事実の確認を含め、改正の必要性を判断しまして、この度、法案を提出することにしたものでございます。"],["衆議院 環境委員会 第3号（環境省大臣官房環境保健部長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00320261030/59","2026-10-30","国会会議録","この改正を受けまして、公健法の制度趣旨も考慮の上、立法事実の確認を含め改正の必要性を判断し、この度、法案を提出することにしたものでございます。"],["衆議院 環境委員会 第3号（環境省大臣官房環境保健部長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00320261030/5","2026-10-30","国会会議録","この改正を受け、公健法の制度趣旨も考慮の上、立法事実の確認を含め、改正の必要性を判断し、この度、法案を提出することにしたものでございます。"]],"id":702},{"a":"governmen "日本共産党","また、総会での討論でも、同趣旨の発言を行った。"]],"id":457},{"a":"government","s":"done","k":"閣議決定・計画","f":"環境・エネルギー","t":"GFC国内実施計画を取りまとめ","m":"GFCの理念に基づき、我が国の化学物質管理に関わる各分野で実施されている具体的な施策や今後の方向性を踏まえ、包括的な化学物質管理を示す計画を取りまとめた。","d":"2026-11","e":"","r":"government","n":1,"src":[["GFC国内実施計画","https://www.env.go.jp/content/000369162.pdf","2026-11-06","環境省","今般、GFC 国内実施計画を取りまとめたところである。"]],"id":472},{"a":"government","s":"ongoing","k":"その他","f":"福祉","t":"子供の自殺の実態把握と原因分析の継続","m":"関係省庁、関係機関の協力のもと、子供の自殺の実態把握に取り組み、原因及び背景を分析し、得られた知見を対策に生かしていく。","d":"2026-11","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（こども家庭庁長官官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/43","2026-11-05","国会会議録","こども家庭庁としては、引き続き、関係省庁、関係機関の協力も得ながら、子供の自殺の実態把握に取り組み、本日議員からの御指摘や専門家の意見等も参考にしながら、子供の自殺の原因及び背景を分析し、得られた知見を対策に生かしてまいりたいと思います。"]],"id":524},{"a":"government","s":"ongoing","k":"その他","f":"司法・治安","t":"家事事件手続のデジタル化全面施行に向け準備","m":"法務省は、家事事件手続のデジタル化を内容とする改正法の全面施行に向けて、裁判所等の関係機関と連携し、必要な準備に取り組む。","d":"2026-11","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/12","2026-11-05","国会会議録","法務省としては、家事事件手続のデジタル化を内容とする改正法の全面施行に向けて、引き続き裁判所等の関係機関と連携し、必要な準備に取り組んでまいりたいと考えております。"]],"id":536},{"a":"government","s":"ongoing","k":"予算・税制","f":"環境・エネルギー","t":"防災技術開発と国際防災協力を推進","m":"危機管理投資として防災技術に五年で2.6兆円の官民投資を想定し、防災技術の開発・実装を進めるとともに、国際防災の枠組みづくりをリードし、海外へのPRや実証事業支援を行う。","d":"2026-11","e":"","r":"government","n":1,"src":[["衆議院 災害対策特別委員会 第2号（防災大臣・復興大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204339X00220261105/2","2026-11-05","国会会議録","危機管理投資として、防災技術に五年で二・六兆円の官民投資を想定しており、産官学民連携による防災技術の開発、実装や防災産業の発展を進めるとともに、国際防災の枠組みづくりもリードしながら、国際会議などの機会を捉えた防災技術の海外へのＰＲや、企業による海外展開のための実証事業への支援を行うなど、国際防災協力を推進し、経済成長や世界の防災対策に貢献する攻めの防災を進めてまいります。"]],"id":541},{"a":"government","s":"ongoing","k":"政策の実施","f":"住宅・都市","t":"首里城正殿の復元工事を進行","m":"首里城の正殿の復元工事を本年11月に向け着実に進める。また、今後も北殿の復元等の取組を継続する。","d":"2026-11","e":"","r":"government","n":1,"src":[["参議院 沖縄・北方問題及び "government","n":1,"src":[["参議院 災害対策及び東日本大震災復興特別委員会 第2号（防災大臣・復興大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215384X00220261106/3","2026-11-06","国会会議録","十一月二日に防災庁が設置されました。防災庁では、千島海溝地震、日本海溝地震、首都直下地震や南海トラフ地震、富士山噴火などの国難級の大規模災害においても、国民の生命、身体、財産を守り抜くため、平時から発災時、復旧復興までの一貫した災害対応の司令塔として我が国の防災体制を強化し、世界一の防災大国を目指してまいります。"]],"id":464},{"a":"sdp","s":"done","k":"声明・談話","f":"政治・選挙","t":"憲法大行動を実施し「改憲・軍拡・差別反対」を訴える","m":"日本国憲法公布80年を記念し、国会正門前で憲法大行動を実施。党首や幹事長が登壇し、参加者と共に「改憲と軍拡、差別にＮＯ！」を訴えた。","d":"2026-11-03","e":"","r":"opposition","n":1,"src":[["「改憲・軍拡・差別にＮＯ！」 憲法公布８０年 ～ 国会正門前に１万４０００人","https://sdp.or.jp/sdp-paper/kenpo-8/","2026-11-13","社会民主党","日本国憲法の公布から８０年を迎えた１１月３日、国会正門前で憲法大行動が取り組まれ、「改憲と軍拡、差別にＮＯ！」を訴えて１万４０００人が参加した。"]],"id":17},{"a":"government","s":"done","k":"会議・協議","f":"行政・デジタル","t":"政府調達システムに対するデジタルインボイス請求の振り返り実施","m":"政府調達システム（GEPS）に対するデジタルインボイスでの請求について、NTTデータ・ウィズとの間で「振り返り」を実施した。","d":"2026-11-04","e":"","r":"government","n":1,"src":[["Peppolが輝かせる「主役」たち ～NTTデータ・ウィズ、デジタルインボイスの「自分ごと」化～（2026年11月4日）（PDF／532KB）","https://www.digital.go.jp/assets/contents/node/basic_page/field_ref_resources/968e4487-0cbb-48e7-a090-e097d925b5e7/988de544/20261113_policies_electronic_invoice_outline_01.pdf","2026-11-13","デジタル庁","2026年11月４日、デジタル庁は、株式会社NTTデータ・ウィズとの間で、政府調達システム（GEPS）に対するデジタルインボイスでの請求について「振り返り」を行いました。"]],"id":107},{"a":"government","s":"planned","k":"政策の実施","f":"福祉","t":"東部ニューギニア現地調査・遺骨収集（第４次）を実施","m":"パプアニューギニア独立国において、戦没者の遺骨収集（第４次）を実施する。厚生労働省職員2名が参加し、一般社団法人日本戦没者遺骨収集推進協会4名が参加する。","d":"2026-11-04","e":"2026-11-18","r":"government","n":2,"src":[["別添［PDF形式：1.3MB］","https://www.mhlw.go.jp/content/12103000/001769090.pdf","2026-11-13","厚生労働省","東部ニューギニア現地調査・遺骨収集（第４次）\n実施期間：令和８年11 月４日（水）から11 月18 日（水）まで（別紙１）"],["別添［PDF形式：1.3MB］","https://www.mhlw.go.jp/content/12103000/001769090.pdf","2026-11-13","厚生労働省","東部ニューギニア現地調査・遺骨収集（第５次）\n実施期間：令和８年11 月28 日（土）から12 月９日（水）まで（別紙７）"]],"id":154},{"a":"komei","s":"done","k":"会議・協議","f":"行政・デジタル","t":"サイバー対策の戦略推進本部を立ち上げ","m":"被害の防止や支援策などの検討を進め、専門家らの意見を聴きながら、実効性ある取り 動植物の種の保存に関する法律に基づく生息地等保護区及び管理地区の指定案に関する公告及び意見募集（パブリック・コメント）について","https://www.env.go.jp/press/press_05793.html","2026-11-12","環境省","今般、国内希少野生動植物種であるキタサンショウウオの保全を図るため、「釧路湿原キタサンショウウオ生息地保護区」及び「釧路湿原キタサンショウウオ生息地保護区管理地区」の指定を検討しており、当該指定案について、公告・縦覧、及び意見募集（パブリック・コメント）を行います。"]],"id":201},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"環境・エネルギー","t":"絶滅のおそれのある野生動植物の種の保存につき講ずべき措置について（答申案）に対する意見募集","m":"絶滅のおそれのある野生動植物の種の保存につき講ずべき措置について（答申案）に対する意見を募集する。","d":"2026-11-12","e":"2027-12-11","r":"government","n":1,"src":[["意見募集要領","https://www.env.go.jp/content/000441683.pdf","2026-11-12","環境省","絶滅のおそれのある野生動植物の種の保存につき講ずべき措置について（答申案）に対する意見募集"]],"id":209},{"a":"government","s":"planned","k":"法案・制度","f":"環境・エネルギー","t":"環境影響評価手続の実施要求","m":"本事業計画の今後の検討に際し、関係機関等との調整を十分に行い、環境影響評価手続を実施することが求められている。","d":"2026-11-12","e":"","r":"government","n":2,"src":[["別紙　「（仮称）伊佐・えびの・人吉風力発電事業　環境影響評価準備書」に対する環境大臣意見[PDF 127KB]","https://www.env.go.jp/content/000440898.pdf","2026-11-12","環境省","本事業計画の今後の検討に当たっては、関係機関等と調整を十分に行い、環境影響評価手続を実施すること。また、地域住民等に対し、丁寧かつ十分な説明を行うこと。"],["別紙　「（仮称）伊佐・えびの・人吉風力発電事業　環境影響評価準備書」に対する環境大臣意見[PDF 127KB]","https://www.env.go.jp/content/000440898.pdf","2026-11-12","環境省","ア 事後調査を適切に実施すること。また、事後調査の結果を踏まえ、必要に応じて、追加的な環境保全措置を適切に講ずること。"]],"id":214},{"a":"government","s":"planned","k":"閣議決定・計画","f":"環境・エネルギー","t":"事業計画の見直しと再評価の実施要求","m":"意見を踏まえ、事業計画の見直しを行う場合は、評価書にその考え方を記載し、環境影響評価項目について予測及び評価を再度実施することが求められている。","d":"2026-11-12","e":"","r":"government","n":1,"src":[["別紙　「（仮称）伊佐・えびの・人吉風力発電事業　環境影響評価準備書」に対する環境大臣意見[PDF 127KB]","https://www.env.go.jp/content/000440898.pdf","2026-11-12","環境省","本意見の内容及び今後の検討を踏まえ、風力発電設備の基数、配置の変更等の事業計画の見直しを行う場合には、評価書においてその考え方を正確かつ分かりやすく記載すること。また、事業計画の見直しの結果に応じて、騒音、風車の影その他の環境影響評価項目について予測及び評価を再度実施し、専門家等の助言を踏まえ、環境保全措置を検討・実施すること。"]],"id":215},{"a":"government","s":"done","k":"提言・要望","f":"環境・エネルギー","t":"鳥類への影響把握のための事後調査の実施を要求","m":"鳥類への影響を適切に把握するため、バードストライクの有無に加え、工事中・稼働後の生息・繁殖状況に関する事後調査を適切に実施することを求めた。","d":"2026-11-12","e":"","r":"government","n":2,"src":[["別紙　「（仮称）伊佐・えびの・人吉風力発電事業　環境影響評価準備書」に対する環境大臣意見[PDF 127KB]","https://www.env.go.jp/content/000440898.pdf","2026-11-12","環境省","ア 稼働後のバードストライクの有無に加え、工事中及び稼働後のクマタカの生息及び繁殖状況に関する事後調査を適切に実施すること。また、事後調査の結果、準備書に記載されている重要な鳥類において、バードストライクを含む重大な影響が認められた場合は、環境保全措置に係る最新の知見の収集に努め、専門家等からの助言を踏まえ、視認性を高める措置を含む追加的な環境保全措置を講ずること。"],["（仮称）伊佐・えびの・人吉風力発電事業に係る環境影響評価準備書に対する環境大臣意見の提出について","https://www.env.go.jp/press/press_05815.html","2026-11-12","環境省","（２） 鳥類への影響を適切に把握するため、バードストライクの有無に加え、工事中・稼働後の生息・繁殖状況に関する事後調査を適切に実施すること。その結果、重要な鳥類に対する重大な影響が認められた場合は、専門家等からの助言を踏まえ、鳥類からの視認性を高める措置を含む追加的な環境保全措置を講ずること"]],"id":217},{"a":"government","s":"done","k":"提言・要望","f":"環境・エネルギー","t":"風力発電事業の環境影響評価準備書に対する意見を提出","m":"環境省は、風力発電事業の環境影響評価準備書に対し、環境大臣意見を経済産業大臣に提出した。","d":"2026-11-12","e":"","r":"government","n":1,"src":[["（仮称）伊佐・えびの・人吉風力発電事業に係る環境影響評価準備書に対する環境大臣意見の提出について","https://www.env.go.jp/press/press_05815.html","2026-11-12","環境省","環境省は、「（仮称）伊佐・えびの・人吉風力発電事業環境影響評価準備書」（株式会社グリーンパワーインベストメント）に対する環境大臣意見を経済産業大臣に提出した。"]],"id":218},{"a":"government","s":"done","k":"提言・要望","f":"環境・エネルギー","t":"工事に伴う騒音増加に対する環境保全措置を要求","m":"工事実施に伴う騒音増加に対応するため、工事工程の分散等の環境保全措置を講じること、地域住民からの問い合わせ時には走行時間の調整を適切に検討することを求めた。","d":"2026-11-12","e":"","r":"government","n":1,"src":[["（仮称）伊佐・えびの・人吉風力発電事業に係る環境影響評価準備書に対する環境大臣意見の提出について","https://www.env.go.jp/press/press_05815.html","2026-11-12","環境省","（１） 工事の実施に伴い、騒音が現況より大きく増加するため、工事工程の分散等の環境保全措置を講ずること。さらに、地域住民から問い合わせがあった際には、走行時間の調整等を適切に検討すること"]],"id":219},{"a":"government","s":"done","k":"提言・要望","f":"環境・エネルギー","t":"土地改変の最小化と環境影響の回避・低減を要求","m":"土地の改変を最小限に抑制し、土砂の崩壊・流出による水環境や動植物の生息・生育環境への影響を回避・低減することを求めた。","d":"2026-11-12","e":"","r":"government","n":1,"src":[["（仮称）伊佐・えびの・人吉風力発電事業に係る環境影響評価準備書に対する環境大臣意見の提出について","https://www.env.go.jp/press/press_05815.html","2026-11-12","環境省","（３） 土地の改変を最小限に抑制し、土砂の崩壊・流出による水環境・動植物の生息・生育環境への影響を回避・低減すること"]],"id":221},{"a":"government","s":"planned","k":"閣議決定・計画","f":"環境・エネルギー","t":"環境影響評価書の作成等の手続を事業者に求める","m":"事業者は、環境大臣の意見及び関係地方公共団体の長の意見を受けた経済産業大臣勧告等を踏まえ、法に基づく環境影響評価書の作成等の手続が求められる。","d":"202 て、所要の改正を行うこととしている。","d":"2026-11-12","e":"","r":"government","n":2,"src":[["「温室効果ガス算定排出量等の報告等に関する命令第一条第五号に規定する環境大臣及び経済産業大臣が定める国内認証排出削減量の一部を改正する件（案）」等に対する意見募集（パブリックコメント）について","https://www.env.go.jp/press/press_05859.html","2026-11-12","環境省","「温室効果ガス算定排出量等の報告等に関する命令第一条第五号に規定する環境大臣及び経済産業大臣が定める国内認証排出削減量の一部を改正する件（案）」等について、広く国民の皆様から御意見を募集するため、令和８年11月12日（木）から同年12月11日（金）まで、意見募集（パブリックコメント）を行います。"],["「温室効果ガス算定排出量等の報告等に関する命令第一条第五号に規定する環境大臣及び経済産業大臣が定める国内認証排出削減量の一部を改正する件（案）」等に対する意見募集（パブリックコメント）について","https://www.env.go.jp/press/press_05859.html","2026-11-12","環境省","以上を踏まえ、以下の告示について、所要の改正を行うこととしています。\n・ 温室効果ガス算定排出量等の報告等に関する命令第一条第五号に規定する環境大臣及び経済産業大臣が定める国内認証排出削減量（平成22年３月経済産業省・環境省告示第３号）\n・ 温室効果ガス算定排出量等の報告等に関する命令第四条第五項及び第十三条第三項の規定に基づき環境大臣及び経済産業大臣が定める算定方法（令和７年３月経済産業省・環境省告示第２号）"]],"id":239},{"a":"government","s":"planned","k":"会議・協議","f":"くらし・消費","t":"食品寄附ガイドラインに関する説明会を開催","m":"食品寄附者、フードパントリー、こども食堂、地方公共団体などを対象に、本ガイドラインの趣旨や活動等を行う上での具体的なポイントを解説する説明会を開催する。","d":"2026-11-12","e":"","r":"government","n":5,"src":[["食品寄附ガイドラインに関する説明会開催のお知らせ","https://www.caa.go.jp/notice/entry/047968/","2026-11-12","消費者庁","このたび、食品寄附者、フードパントリー、こども食堂、地方公共団体等の皆様を対象に、本ガイドラインの趣旨や活動等を行う上での具体的なポイントを解説する説明会を開催いたしますので、ご案内申し上げます。"],["(地方公共団体向け)食品寄附ガイドラインに関する説明会の開催について[PDF:152.5 KB]","https://www.caa.go.jp/notice/assets/consumer_education_cms201_261112_04.pdf","2026-11-12","消費者庁","このたび、地方公共団体の皆様を対象に、本ガイドラインの趣旨や食品寄附における地方公共団体の役割、関係主体との連携等について解説する説明会を開催いたしますので、ご案内申し上げます。"],["(こども食堂等向け)食品寄附ガイドラインに関する説明会の開催について[PDF:153.7 KB]","https://www.caa.go.jp/notice/assets/consumer_education_cms201_261112_03.pdf","2026-11-12","消費者庁","このたび、こども食堂等の活動に従事される皆様を対象に、本ガイドラインの趣旨や活動を行う上での具体的なポイントを解説する説明会を開催いたしますので、ご案内申し上げます。"]],"id":250},{"a":"government","s":"done","k":"声明・談話","f":"くらし・消費","t":"重大事故等の概要を公表","m":"消費者安全法に基づき、関係行政機関等から通知された生命・身体被害に関する消費者事故等（重大事故等33件）の概要を公表した。","d":"2026-11-12","e":"","r":"government","n":2,"src":[["消費者安全法の重大事故等に係る公表について[PDF:708.4 KB]","https://www.caa.go.jp/notice/assets/consumer_safety_cms201_261112_01.pdf","20 けた定数増の必要性を主張","m":"次期参院選に向けて、まず格差を2倍以下に是正することを優先すべきとし、合区解消と投票価値の平等を両立させるため、東京など人口の多い地域の定数増もやむを得ないとの考えを示した。","d":"2026-11-13","e":"","r":"opposition","n":1,"src":[["【１１月１１日の福島党首会見】昨年参院選の「一票の格差」を違憲状態とした最高裁判決を重く受け止め、是正を急げ ～ 安保３文書改定で非核三原則の例外は認められない","https://sdp.or.jp/sdp-paper/toushu-131/","2026-11-13","社会民主党","その上で、次期参院選に向けて「まず格差を２倍以下に是正することを優先すべきだ」とした。」「東京など人口の多い地域の定数増もやむを得ない」との考えを示した。"]],"id":21},{"a":"sdp","s":"done","k":"声明・談話","f":"政治・選挙","t":"憲法に関する解説チラシを作成・配布","m":"憲法改正に反対する立場から、憲法が日々の生活にどう関わっているかを解説したチラシを作成し、配布している。","d":"2026-11-13","e":"","r":"opposition","n":1,"src":[["【憲法はあなたの味方！】チラシのご案内","https://sdp.or.jp/sdp-paper/261113shinpo-gogai/","2026-11-13","社会民主党","社民党は憲法改正に反対です。憲法は平和を守り、あなたの日々のくらしを守るものです。では、憲法はどのようにみなさんの日々の生活に関わっているのか。そのことを分かりやすく解説したチラシを作成しました。"]],"id":22},{"a":"komei","s":"ongoing","k":"提言・要望","f":"財政・税制","t":"消費税減税関連法案の白紙委任性について懸念表明","m":"来年4月から2年間限定の飲食料品減税と「就業者負担軽減支援金」について、支給額や対象範囲が具体的に示されていない点を指摘し、現段階では賛成できないとの見解を示した。","d":"2026-11-13","e":"","r":"opposition","n":1,"src":[["消費税減税法案　首相は疑問に答えよ","https://www.komei.or.jp/komeinews/p515800/","2026-11-13","公明党","支援金は数字が法律に書き込まれておらず、白紙委任するような法案が果たしてあり得るのか。現段階で全く賛成できる状況にはない"]],"id":29},{"a":"komei","s":"ongoing","k":"提言・要望","f":"政治・選挙","t":"衆院議員比例定数削減法案への疑問を呈する","m":"衆院議員比例定数を31削減する法案について、論理的な根拠を疑問視し、死票が広がる可能性を指摘し、制度改正に納得できないとの見解を述べた。","d":"2026-11-13","e":"","r":"opposition","n":1,"src":[["消費税減税法案　首相は疑問に答えよ","https://www.komei.or.jp/komeinews/p515800/","2026-11-13","公明党","比例定数を31削減するという、論理的な根拠があるのか。こうした制度改正には到底納得できない"]],"id":30},{"a":"komei","s":"ongoing","k":"提言・要望","f":"司法・治安","t":"政治資金規正法改正案の審議進展を要求","m":"企業・団体献金の規制を強化する政治資金規正法改正案の審議について、一日審議で終わらせるのではなく、国民が納得する進展が必要だと訴えた。","d":"2026-11-13","e":"","r":"opposition","n":1,"src":[["消費税減税法案　首相は疑問に答えよ","https://www.komei.or.jp/komeinews/p515800/","2026-11-13","公明党","政治とカネの問題について何らかの進展があることが必要だ"]],"id":31},{"a":"komei","s":"ongoing","k":"提言・要望","f":"司法・治安","t":"企業・団体献金の規制強化を提言","m":"政治とカネの問題解決のため、企業・団体献金の規制を強化する必要性を強調し、具体的な対策として議論を進めるべきだと訴えた。","d":"20  文部科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/128","2026-10-28","国会会議録","令和九年度概算要求におきましても、教職の魅力向上に向けた新規事業を改めて盛り込んだところでございます。"]],"id":834},{"a":"government","s":"ongoing","k":"予算・税制","f":"福祉","t":"令和9年度概算要求で1,541億円増を要求","m":"令和9年度から人事院勧告を踏まえた給与改定が可能となるように、必要額として1,541億円増を要求している。","d":"2027-04","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省高等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/134","2026-10-28","国会会議録","令和九年度概算要求におきましても、千五百四十一億増ということで要求をしておりますけれども、これは令和九年度から令和八年度人事院勧告を踏まえた給与改定が可能となるように必要額として盛り込んだものでございまして"]],"id":840},{"a":"government","s":"ongoing","k":"予算・税制","f":"福祉","t":"附属学校機能強化分として7億円を計上","m":"令和9年度の概算要求に、公立学校との人事交流に必要な経費にも活用可能な附属学校機能強化分として7億円を計上した。","d":"2027-04","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省高等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/134","2026-10-28","国会会議録","公立学校との人事交流に必要な経費にも活用可能な附属学校機能強化分として七億円計上いたしておりまして"]],"id":842},{"a":"government","s":"ongoing","k":"予算・税制","f":"福祉","t":"令和9年度の概算要求の実施","m":"質の高い公教育の再生、学校施設の整備、高等教育改革の推進、誰もが学ぶ機会の保障など、必要な予算の確保を求めた。","d":"2027-04","e":"","r":"government","n":3,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/98","2026-10-28","国会会議録","文部科学省といたしましては、令和九年度の概算要求におきまして、質の高い公教育の再生、新しい時代の学びの実現に向けました学校施設の整備、二〇四〇年を見据えた高等教育改革の推進、誰もが学ぶことができる機会の保障などの観点からも要求を行っておりまして、必要な予算の確保に全力で取り組む所存でございます。"],["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/17","2026-10-28","国会会議録","令和九年度の概算要求におきましては、文部科学省といたしまして総額八・八兆円を要求いたしております。これは、令和七年度補正予算と令和八年度当初予算の合計七・五兆円を上回る規模となっております。"],["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/75","2026-10-27","国会会議録","令和九年度の概算要求としては一千八百二十八億円を計上しておりますが"]],"id":869},{"a":"government","s":"planned","k":"予算・税制","f":"子育て・教育","t":"安全教育の調査研究・研修に必要な経費を計上","m":"令和九年度の概算要求において、指導方法に関する調査研究や外部講師による研修に必要な経費を計上する。","d":"2027-04","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/86","2026-10-28","国会会議録","令和九年度の概算要求におきましては、新たに指導方法に関する調査研究、また外部講師によります研修等、これらに必要な経費を計上いたしておるところでございます。"]],"id":877},{"a":"government","s":"ongoing","k":"予算・税制","f":"福祉","t":"給付型奨学金関連の予算要求実施","m":"物価や学生生活費の増大を見直し、給付型奨学金に関する事項要求として、令和9年度の予算要求を現在行っている。","d":"2027-04","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/59","2026-10-28","国会会議録","令和九年度の要求におきましても、物価や学生生活に関する費用の増大を我々もいろいろおもんぱかりまして見直しを図り、事項要求として予算に関しての要求を今行っているところでございます。"]],"id":902},{"a":"government","s":"done","k":"予算・税制","f":"子育て・教育","t":"教職の魅力向上に向けた新規事業を盛り込む","m":"教職の魅力向上に向けた意欲的な目標とその実行計画を定めた自治体を支援する新規事業を、概算要求に盛り込んだ。","d":"2027-04","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/49","2026-10-28","国会会議録","令和九年度概算要求におきましては、教職の魅力向上に向けました意欲的な目標とその実行計画を定めた自治体を支援する新規事業を盛り込むとともに"]],"id":906},{"a":"government","s":"planned","k":"予算・税制","f":"子育て・教育","t":"教職の魅力向上等に向けた自治体への支援を要求","m":"令和九年度の概算要求において、教職の魅力向上や意欲的な目標を定めた自治体への支援を含めた事項要求を行う。","d":"2027-04","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/47","2026-10-28","国会会議録","令和九年度の概算要求におきましては、教職の魅力向上とか意欲的な目標を定めた自治体への支援等も含めまして事項要求を行っているところでございます。"]],"id":909},{"a":"government","s":"ongoing","k":"予算・税制","f":"科学技術","t":"令和9年度概算要求に基づく研究予算の拡充要求","m":"科研費の採択率・平均配分額引き上げ、事務負担軽減、全面基金化推進のため4,552億円を要求。また、国立大学法人運営費交付金として1兆2,512億円、私学助成として4,803億円を要求している。","d":"2027-04","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省研究振興局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/21","2026-10-28","国会会議録","令和九年度概算要求におきましては、研究の質をしっかり確保した上で採択率や平均配分額を引き上げるとともに、研究者の事務負担軽減など、研究時間の確保に資する全面基金化の推進に向けて四千五百五十二億円の要求を行っているところであります。また、大学における研究活動を安定的、継続的に支える基盤的経費として、令和九年度概算要求におきましては、国立大学法人運営費交付金については一兆二千五百十二億円の要求を行うとともに、私学助成についても四千八百三億円の要求を行っているところであります。"]],"id":917},{"a":"government","s":"ongoing","k":"予算・税制","f":"子育て・教育","t":"高校教育改革交付金等の創設を要求","m":"パイロットケースの全国展開を支援するため、高校教育改革交付金等の創設を令和9年度概算要求に盛り込んでいる。","d":"2027-04","e":"","r":"government","n":3,"src":[["衆議院 文部科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/19","2026-10-28","国会会議録","現在、令和九年度概算要求におきまして、高校教育改革交付金等の創設を強く豊かな日本投資枠の中に盛り込んでございます。"],["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/172","2026-10-28","国会会議録","...来年度概算要求では高等学校教育改革交付金等の創設を盛り込んでいるところでございます。"],["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/116","2026-10-28","国会会議録","令和九年度の概算要求にも、この高等学校教育改革交付金の創設、これらの創設を通じまして都道府県の取組を面で支援をしていこう、そして魅力ある高等学校の教育の実現に向けまして更に支援を図ってまいりたいと思っておるところでございます。"]],"id":920},{"a":"government","s":"planned","k":"予算・税制","f":"財政・税制","t":"令和九年度概算要求での必要額要求","m":"令和九年度概算要求において、強く豊かな日本投資枠を活用しながら、人材育成に必要な必要額を要求し、政策を強力に推進する。","d":"2027-04","e":"2028-03","r":"government","n":2,"src":[["衆議院 文部科学委員会 第2号（文部科学省大臣官房総括審議官の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/7","2026-10-28","国会会議録","令和九年度概算要求では強く豊かな日本投資枠も活用しながら必要額を要求するなど、これらの政策を強力に推進することとしております。"],["参議院 文教科学委員会 第2号（文部科学省研究振興局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/17","2026-10-27","国会会議録","骨太の方針等も踏まえ、令和九年度概算要求におきまして、全面基金化の推進も含めて、四千五百五十二億円の要求をしているところでございます。"]],"id":924},{"a":"government","s":"planned","k":"予算・税制","f":"環境・エネルギー","t":"地熱資源開発関連予算の増額要求","m":"地熱発電の資源量調査・理解促進事業（131.9億円）と導入拡大技術開発事業（15.3億円）を合わせ、約147億円の予算増額を要求。","d":"2027-04","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（資源エネルギー庁資源・燃料部長の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/168","2026-10-28","国会会議録","地熱発電の資源量調査・理解促進事業が百三十一・九億円、それから、地熱・地中熱等導入拡大技術開発事業が十五・三億円、合わせて地熱資源開発に関連する予算額は約百四十七億円でございまして、これは、令和八年度当初予算額から約六億円の増額要求となってございます。"]],"id":949},{"a":"government","s":"planned","k":"予算・税制","f":"経済・産業","t":"令和九年度の振興予算および税制改正要望を計上","m":"ゲートウェイ二〇五〇プロジェクツ実現に向けた基地跡地の先行取得支援や、フィジカルAI・量子分野の取組を進めるため、総額2,897億円を計上。また、税制等の延長を要望。","d":"2027-04","e":"2028-03","r":"government","n":1,"src":[["参議院 沖縄・北方問題及び地方に関する特別委員会 第2号（国家公安委員会委員長・内閣府特命担当大臣（沖縄及び北方対策・消費者及び食品安全・アイヌ施策）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215382X00220261028/3","2026-10-28","国会会議録","総額二千八百九十七億円を計上したほか、防災・減災、国土強靱化に資する公共事業関係費等について事項要求を行っています。また、令和九年度税制改正要望においては、令和八年度末に適用期限を迎える税制等の計十一項目について、租税特別措置等の自己点検結果も踏まえつつ、一部拡充等を行った上での延長を要望しております。"]],"id":1130},{"a":"government","s":"planned","k":"予算・税制","f":"子育て・教育","t":"大学間の再編統合・連携等の経費要求","m":"高等教育の規模適正化を図りつつ、地域の大学が持続可能になるため、大学間の再編統合や連携等の取り組みに必要な経費を要求する。","d":"2027-04","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省高等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/191","2026-10-27","国会会議録","来年度に向けては、プラットフォームの拡充のための経費とともに、高等教育の規模適正化を図りつつ、地域の医療、インフラ、産業を支える大学についてはいかに規模が小さくとも持続可能にしていくため、大学間の再編統合、連携等の取組に必要となる経費を要求しているところでございます。"]],"id":1145},{"a":"government","s":"done","k":"予算・税制","f":"医療","t":"看護学部等の地域枠導入支援のための経費計上","m":"県と大学が協働し、看護学部等の定員に係る地域枠の導入に向けた取り組みを支援するため、新たに20億円を計上した。","d":"2027-04","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省高等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/191","2026-10-27","国会会議録","令和九年度概算要求では、県と大学が協働し、協議し、看護学部等の定員に係る地域枠の導入に向けた取組を支援するために必要な経費として新たに二十億円計上しているところでございます。"]],"id":1146},{"a":"government","s":"planned","k":"予算・税制","f":"経済・産業","t":"令和九年度の概算要求で大学機能強化に投資","m":"大学の規模適正化と機能強化を両輪で進めるため、成長分野転換基金の積み増しや地域構想推進プラットフォームの全国展開支援など、重点的な取り組みに2兆2750億円を要求している。","d":"2027-04","e":"2028-03","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省高等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/185","2026-10-27","国会会議録","令和九年度概算要求では、成長分野転換基金の積み増し、知的修羅場としての学部教育の実現、地域構想推進プラットフォームの全国展開への支援、私学助成の成長分野や地域を支える人材育成等の重点化、充実に取り組むため、高等教育局として二兆二千七百五十億円を要求しているところでございまして、必要な投資をしっかりやっていきたいと考えてございます。"]],"id":1148},{"a":"government","s":"planned","k":"予算・税制","f":"雇用・労働","t":"健康インフラ構築事業を概算要求に盛り込む","m":"運動・スポーツが持つ効果を生かした人材の定着や生産性維持向上を図る基盤（健康インフラ）の構築事業を令和九年度の概算要求として盛り込む。","d":"2027-04","e":"","r":"government","n":2,"src":[["参議院 文教科学委員会 第2号（スポーツ庁次長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/150","2026-10-27","国会会議録","健康インフラの構築を図る事業を令和九年度の概算要求として盛り込んでいるところでございます。"],["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/132","2026-10-27","国会会議録","令和九年度概算要求におきましても、教職の魅力向上に向けた意欲的な目標とその実行計画を定めた自治体を支援する新規事業を盛り込みました。"]],"id":1160},{"a":"government","s":"planned","k":"予算・税制","f":"科学技術","t":"基礎研究力強化のための競争的研究費を拡充","m":"科研費の大幅拡充、全面基金化の推進、戦略的創造研究推進事業等の支援強化など、基礎研究力強化に必要な競争的研究費の充実強化を図る。文科省は必要な予算を確保する方針。","d":"2027-04","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/148","2026-10-27","国会会議録","我が国の知の基盤の強化に向けました科研費の大幅拡充、この全面基金化の推進、そして革新的な新興・融合研究への挑戦促進のための戦略的創造研究推進事業等の支援強化など、我が国の基礎研究力強化に不可欠な競争的研究費の充実強化に関わります"]],"id":1165},{"a":"government","s":"done","k":"予算・税制","f":"医療","t":"大学病院機能強化のための予算要求を実施","m":"大学病院施設設備の緊急支援を進めるとともに、教育研究機能の強化と診療規模の適正化を図るための予算を要求した。","d":"2027-04","e":"2028-03","r":"government","n":2,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/146","2026-10-27","国会会議録","文科省といたしましては、令和九年度の概算要求におきまして、大学病院施設設備の緊急支援を進めることと併せまして、大学病院の教育研究機能の強化と診療規模の適正化を図るべく、大学病院機能のリバランス促進のための予算を要求をいたしておるところでございます。"],["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/19","2026-10-27","国会会議録","文部科学省といたしましては、令和九年度の概算要求におきまして、大学病院施設設備の緊急支援を進めることと併せまして、大学病院の教育研究機能の強化と診療規模の適正化を図るべく、大学病院機能のリバランス促進のための予算を要求をいたしておるところでございます。"]],"id":1166},{"a":"government","s":"ongoing","k":"予算・税制","f":"雇用・労働","t":"令和9年度の教職環境改善に必要な予算要求","m":"令和9年度概算要求において、教職員定数の改善や支援スタッフの配置拡充、行政支援体制構築に必要な予算を計上。自治体支援や奨学金返還支援の検討も行っている。","d":"2027-04","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/122","2026-10-27","国会会議録","令和九年度概算要求におきまして、教職員定数の改善や教員業務支援員等の支援スタッフの配置拡充、あるいは保護者等からの過剰な苦情等に対して行政支援ができる体制の構築に必要な予算を計上するとともに、教職の魅力に向けて意欲的な目標等を定めた自治体への支援や、教職に就いた者に係る奨学金の返還支援等経済的負担の更なる軽減に向けて検討を行い、必要な措置を講ずるための事項要求も行っているところでございます。"]],"id":1182},{"a":"government","s":"planned","k":"予算・税制","f":"雇用・労働","t":"令和九年度に教員業務支援員等の配置に必要な予算を計上","m":"全ての小中学校への教員業務支援員配置や、副校長・教頭マネジメント支援員、学習指導員の配置充実、行政支援体制構築、スクールガード等の配置支援に必要な予算を計上。","d":"2027-04","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/113","2026-10-27","国会会議録","令和九年度概算要求におきまして、全ての小中学校への教員業務支援員の配置や、副校長・教頭マネジメント支援員、学習指導員の配置充実、あるいは保護者等からの過剰な苦情等に対して行政が支援する体制の構築支援、そしてスクールガード・リーダー等の配置支援による見守り活動の充実に必要な予算を計上しております。"]],"id":1189},{"a":"government","s":"planned","k":"閣議決定・計画","f":"子育て・教育","t":"奨学給付金の給付時期早期化と給付額拡充を調整","m":"高校入学時等の費用の負担課題に対応するため、新入生の給付時期の抜本的早期化や、学習用端末購入費相当額の給付額拡充の実現に向けて調整を行う。","d":"2027-04","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/73","2026-10-27","国会会議録","その新入生の給付時期の抜本的早期化、また学習用端末の購入費等相当額の給付額の拡充など、この実現に向けて調整をしてまいりたいと思います。"]],"id":1204},{"a":"government","s":"done","k":"予算・税制","f":"子育て・教育","t":"支援が必要な児童生徒への配置拡充経費を計上","m":"定時制、通信制高校を含め、支援が必要な児童生徒に適切に対応できるよう、令和九年度概算要求で配置拡充のための経費を計上した。","d":"2027-04","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/69","2026-10-27","国会会議録","定時制、通信制高校を含めまして、支援が必要な児童生徒に適切に対応が行うことができるよう、令和九年度概算要求におきましても配置を拡充するための経費を計上しているところでございます。"]],"id":1207},{"a":"dpfp","s":"planned","k":"提言・要望","f":"外交・安全保障","t":"閣僚による竹島関連の意思表示を要望","m":"来年度、竹島の日には閣僚が島根松江を訪問し、国民に対して決意や意思を示すことを要望している。","d":"2027-04","e":"","r":"opposition","n":1,"src":[["参議院 外交防衛委員会 第2号（国民民主党・新緑風会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/140","2026-10-27","国会会議録","であれば、来年度、来年の竹島の日には閣僚の方、是非、島根松江を訪れていただきまして、その決意、意思を国民に対して示していただきたいと思います。"]],"id":1281},{"a":"government","s":"planned","k":"閣議決定・計画","f":"福祉","t":"退職自衛隊員・家族支援庁の設置に向けた動き","m":"隊員だけでなく家族の支援を強化するため、新たな庁の設置を力強く進めている。この庁の設置は令和九年度概算要求に計上されている。","d":"2027-04","e":"","r":"govern
