","d":"","e":"","r":"opposition","n":1,"src":[["参議院 文教科学委員会 第2号（日本共産党の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/198","2026-10-27","国会会議録","いつ解釈変更したのか、その経過が分かる資料を提出するようにと求めておりました。"]],"id":1140},{"a":"government","s":"planned","k":"閣議決定・計画","f":"福祉","t":"大学の早期判断と再編統合に向けた施策の推進","m":"在学生が全員卒業するまで責任を持って教育活動を継続できるよう、経営体力のある段階で早期に判断し、募集停止や再編統合などに踏み切るよう、あらゆる施策を通じて慫慂する。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省高等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/193","2026-10-27","国会会議録","あらゆる施策を通じて慫慂してまいります。"]],"id":1142},{"a":"government","s":"planned","k":"法案・制度","f":"福祉","t":"大学再編統合等の手続簡素化と学生保護措置の実施","m":"18歳人口減少期に向けて、学生の修学機会を保障しつつ大学の機能強化・規模適正化を進めるため、再編統合等の手続簡素化や必要な措置を早急に行う。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省高等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/193","2026-10-27","国会会議録","他大学との再編統合等の手続の簡素化や、学生保護に資する必要な措置につきまして早急に必要な対応を行ってまいりたいと考えてございます。"]],"id":1143},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"大学の評価を学部単位のデマンドサイド評価へ転換","m":"これまでの機関全体の評価から、学生が所属する学部単位での成長実感や教育の成果を評価する仕組みへ転換する。就職先調査や地域内就職率などの社会からの評価も勘案する。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省高等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/189","2026-10-27","国会会議録","これまでの機関全体の単位で法令適合性等を満たしているかどうかという、言わばサプライサイドに立った評価から、学生が所属する学部単位で、在学中にどのくらい成長したかや学生自身の成長実感を見るデマンドサイドへの、評価への転換を図るものでございます。"]],"id":1147},{"a":"government","s":"ongoing","k":"政策の実施","f":"環境・エネルギー","t":"中学校体育連盟等で再発防止の注意喚起を実施","m":"今後このような事態が生じないよう、中学校の体育連盟や競技団体等の関係者の集まる会議等において再発防止の取組に関する注意喚起を行う。現に行いつつある。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（スポーツ庁次長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/165","2026-10-27","国会会議録","今後このような事態が生じないように、中学校の体育連盟でありますとか、あるいは競技団体等の関係者の集まる会議等において再発防止の取組に関する注意喚起を行いたいというふうに考えております。現に行いつつございます。"]],"id":1153},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"民間団体による体験活動の支援実施","m":"国立青少年教育振興機構の子どもゆめ基金を通じ、民間団体が実施する体験活動を支援し、全国各地で多様な学びや成長の機会の充実を図っている。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/156","2026-10-27","国会会議録","文部科学省では、国立青少年教育振興機構の子どもゆめ基金によりまして、民間団体が実施する体験活動を支援して、全国各地で多様な学びや成長の機会の充実を図っています。"]],"id":1154},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"経済的困難な子どもの参加費負担軽減","m":"経済的に困難な状況にあるお子様に対し、通常は対象外となる交通費等の自己負担経費を支援対象とすることで参加ができるように負担軽減を図っている。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/156","2026-10-27","国会会議録","経済的に困難な状況にあるお子様方に対しましては、通常は対象外となる交通費等の自己負担の経費も支援対象とすることで参加ができるように、負担軽減を図っております。"]],"id":1155},{"a":"government","s":"planned","k":"閣議決定・計画","f":"子育て・教育","t":"学校での文化芸術体験機会の充実","m":"一流の文化芸術団体や芸術家が学校を訪問し、授業内で質の高い文化芸術を体験する機会や、本格的な舞台公演を子供が選んで鑑賞できる機会の提供を充実させる。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/156","2026-10-27","国会会議録","一流の文化芸術団体や芸術家が学校を訪問して、授業の中で質の高い文化芸術を体験する機会や、本格的な舞台公演を子供が自ら選んで鑑賞できるような機会も提供していく、これを更に充実するように努めてまいりたいと思います。"]],"id":1156},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"多様な学びの場の整備を推進","m":"不登校児童生徒が学びたいと思ったときには学ぶことができるよう、教育支援センターを含めた多様な学びの場の整備を進めている。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/154","2026-10-27","国会会議録","文部科学省では、不登校児童生徒が学びたいと思ったときには学ぶことができるように、教育支援センターも含めました多様な学びの場の整備を進めているところでございます。"]],"id":1157},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"地域の相談支援機関情報をホームページで周知","m":"不登校児童生徒が適切な支援につながるよう、地域の相談支援機関等の情報を文部科学省のホームページに掲載し、周知に努めている。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/154","2026-10-27","国会会議録","不登校児童生徒が適切な支援につながっていくために、地域の相談支援機関等の情報を文部科学省のホームページに掲載をいたしまして周知に努めております。"]],"id":1159},{"a":"government","s":"planned","k":"政策の実施","f":"雇用・労働","t":"自治体と連携した運動・スポーツ推進企業を支援","m":"現役世代の運動実施率向上のため、自治体と連携した運動・スポーツ推進企業に対する支援を行う。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（スポーツ庁次長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/150","2026-10-27","国会会議録","現役世代の運動実施率向上のための自治体と連携した運動、スポーツ推進企業に対する支援"]],"id":1161},{"a":"government","s":"planned","k":"政策の実施","f":"雇用・労働","t":"企業向け運動・スポーツ関連サービスを強化","m":"企業向けに提供される運動・スポーツ関連サービスを強化し、健康活躍社会の実現を目指す。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（スポーツ庁次長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/150","2026-10-27","国会会議録","企業向け運動、スポーツ関連サービスの強化"]],"id":1162},{"a":"government","s":"planned","k":"政策の実施","f":"福祉","t":"地域資源の開放を通じた運動・スポーツの場の確保","m":"身近な運動・スポーツの場の確保のため、企業や大学、学校等が所有する施設等の地域資源の開放を図る。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（スポーツ庁次長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/150","2026-10-27","国会会議録","身近な運動、スポーツの場の確保のための企業や大学、学校等が所有する施設等のいわゆる地域資源の開放"]],"id":1163},{"a":"government","s":"planned","k":"政策の実施","f":"福祉","t":"社会体育施設の屋内プール整備を実施","m":"学校利用も視野に入れ、社会体育施設の屋内プール整備などの取り組みを通じて健康活躍社会の実現を目指す。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（スポーツ庁次長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/150","2026-10-27","国会会議録","学校利用も視野に入れた社会体育施設の屋内プールの整備などの取組を通じまして、我が国の健康活躍社会の実現に向けて取り組んでまいりたい"]],"id":1164},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"多様な学びの場の整備や教育相談体制の充実","m":"不登校児童生徒数が増加している現状を受け、ＣＯＣＯＬＯプラン等に基づき、多様な学びの場の整備や教育相談体制の充実、魅力ある学校づくりに取り組んでいる。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/142","2026-10-27","国会会議録","ＣＯＣＯＬＯプラン等に基づきます多様な学びの場の整備や教育相談体制の充実、誰もが安心して学べます魅力ある学校づくりに取り組んでいるところでございます。"]],"id":1168},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"いじめの未然防止教育の推進と対策の徹底","m":"いじめの重大事態の発生件数が過去最多となっているため、未然防止教育の推進や相談体制の充実、ガイドラインに基づく対応の徹底など、総合的に対策を進める。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/142","2026-10-27","国会会議録","いじめの未然防止教育の推進や相談体制の充実、また、令和六年に改訂をいたしましたいじめの重大事態の、いじめの重大事態の調査に関するガイドラインに基づく対応の徹底など、いじめは未然防止から早期発見、早期対応、再発防止、ここまで総合的に対策を進めてまいります。"]],"id":1169},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"自殺防止に向けた取組の強化と体制整備","m":"自殺者数が過去最多となっているため、自殺予防教育の促進や一人一台端末を活用した心の健康観察の導入推進、スクールカウンセラー等の配置充実など取組を強化する。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/142","2026-10-27","国会会議録","文部科学省といたしましても、自殺予防教育の促進や一人一台端末等を活用いたしました心の健康観察の導入推進、スクールカウンセラー、スクールソーシャルワーカーの配置充実等、児童生徒の自殺防止に向けた取組を強化してまいります。"]],"id":1170},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"性暴力防止に向けた取り組みの徹底と根絶","m":"同法および指針に基づき、各教育委員会等に対して性暴力防止の徹底を求めており、根絶に向けて努めていく。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/140","2026-10-27","国会会議録","同法に基づきます指針、これを踏まえまして、取組についてはこれまでも様々な機会を捉えまして各教育委員会等に対して徹底を求めてきたところでございますが、もう本当におっしゃるとおりで、これはもう根絶を早くできるように努めてまいります。"]],"id":1172},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"第四期教育基本計画に基づき教育の質向上を推進","m":"文部科学省は、第四期の教育基本計画に基づき、各教育段階における教育の質の向上と環境整備を推進していく。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/130","2026-10-27","国会会議録","文部科学省といたしましては、第四期の教育基本計画に基づきまして、一人一人の豊かで幸せな人生、この社会の持続的な発展の実現に向けまして、各教育段階におきまして、教育の質の向上、環境整備、しっかりと推進してまいりたいと思います。"]],"id":1179},{"a":"government","s":"ongoing","k":"政策の実施","f":"雇用・労働","t":"労働時間縮減に向けた総合的な取り組みを推進","m":"働き方改革を加速させる仕組みを講じた上で、総合的な取り組みとして、教師の労働時間をしっかりと縮減させる取り組みを進めていく。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/117","2026-10-27","国会会議録","総合的な取組としてしっかりと労働時間を縮減させるような取組を進めてまいりたいというふうに思います。"]],"id":1184},{"a":"government","s":"planned","k":"政策の実施","f":"雇用・労働","t":"教師の時間外在校等時間の縮減を進める","m":"時間外在校等時間の縮減を進め、教師が働きやすさと働きがいを持って子供たちと向き合える環境の整備に努める。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/115","2026-10-27","国会会議録","このような取組を通じまして、教師の時間外在校等時間の縮減を進めまして、教師が働きやすさと働きがいを持って子供たちと向き合える、そういった環境の整備に努めてまいりたいと思います。"]],"id":1186},{"a":"government","s":"ongoing","k":"政策の実施","f":"行政・デジタル","t":"教育委員会への業務管理に関する伴走支援を実施","m":"教育委員会が首長部局と連携しながら、業務の精選、役割分担、そして業務量管理を徹底できるよう、伴走支援を行っている。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/113","2026-10-27","国会会議録","教育委員会が首長部局と連携しながら、業務の精選、役割分担、そして業務量管理を徹底できるよう、伴走支援をしているところでございます。"]],"id":1188},{"a":"government","s":"planned","k":"政策の実施","f":"子育て・教育","t":"学校法人の自浄作用が不十分な場合の措置命令","m":"私立学校法に基づき、学校法人の自浄作用が機能しているかを把握し、不十分であると判断した場合には必要な措置を命じる対応を行う。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/102","2026-10-27","国会会議録","私立学校法におけます学校法人の自浄作用、これが機能しているかをしっかりと把握をいたしまして、仮に不十分であると判断しました場合には、私立学校法に基づきまして必要な措置を命ずる等の対応を行ってまいります。"]],"id":1198},{"a":"government","s":"planned","k":"政策の実施","f":"福祉","t":"障害のある生徒へのキャリア教育を一層充実","m":"障害のある生徒が社会的、また職業的自立に向け必要な資質・能力を身に付けるため、キャリア教育の充実に取り組む。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/90","2026-10-27","国会会議録","文科省といたしましては、障害のある生徒が社会的、また職業的自立に向けまして必要な資質、能力を身に付けていただくキャリア教育、一層の充実に取り組んでまいりたいと思います。"]],"id":1199},{"a":"government","s":"planned","k":"政策の実施","f":"科学技術","t":"国立大学等の計画的な施設整備を支援","m":"国立大学等の計画的な施設整備が進むよう、政府として支援に取り組む意向を示した。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/75","2026-10-27","国会会議録","この各国立大学等の計画的な施設整備、これが進められますように、支援、しっかりと取り組んでまいりたいと思います。"]],"id":1201},{"a":"cdp","s":"ongoing","k":"提言・要望","f":"福祉","t":"自殺対策に関する相談対応の調査実施を提言","m":"自殺に関する子供たちの相談対応について調査を実施し、その結果に基づきスクールカウンセラーやスクールソーシャルワーカー、養護教諭の配置等について検討を求める。","d":"","e":"","r":"opposition","n":1,"src":[["参議院 文教科学委員会 第2号（立憲民主・無所属の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/70","2026-10-27","国会会議録","私は、その調査をやっていただけるのであれば、その結果を見て、このスクールカウンセラーやスクールソーシャルワーカー、養護教諭の配置等についても是非お考えをいただきたい、全部リンクすることだというふうに思います。"]],"id":1205},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"スクールカウンセラー等の配置充実のための支援を実施","m":"高等学校も含め、スクールカウンセラーやスクールソーシャルワーカーの配置充実のための支援を文部科学省が行っている。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/69","2026-10-27","国会会議録","文科省においては、高等学校も含め、スクールカウンセラーやスクールソーシャルワーカーの配置充実のための支援を行っているところでございます。"]],"id":1206},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"相談体制の充実等に努め課題解決に取り組む","m":"様々な悩みを抱える児童生徒の課題解決に向けて、文部科学省は相談体制の充実等に努めていく方針である。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/69","2026-10-27","国会会議録","文科省としては、相談体制の充実等に努めまして、様々な悩みを抱える児童生徒の課題解決に向けて取り組んでまいりたいと思います。"]],"id":1208},{"a":"cdp","s":"planned","k":"提言・要望","f":"福祉","t":"定時制・通信制高校の死亡者数別把握を要望","m":"定時制、通信制高校で亡くなった方の数を別々に把握するよう警察庁に強くお願いすること、および実態調査が必要であると提言した。","d":"","e":"","r":"opposition","n":1,"src":[["参議院 文教科学委員会 第2号（立憲民主・無所属の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/62","2026-10-27","国会会議録","定時制、通信制、それぞれ、先ほど残念ながらですけれども結果として亡くなってしまったその方の数については別々に把握をいただくように警察庁に強くお願いをしてくださいということを申し上げましたけれども、それぞれ別々の対応等についても実態調査が必要だろうというふうに思っています。"]],"id":1211},{"a":"cdp","s":"planned","k":"提言・要望","f":"福祉","t":"定時制・通信制高校の自殺リスク実態調査を提言","m":"全国の定時制、通信制高校を対象に、自殺リスクの把握方法、把握後の対応、学校内外の支援への接続の実態を課程別に明らかにする調査を行うべきと提言した。","d":"","e":"","r":"opposition","n":1,"src":[["参議院 文教科学委員会 第2号（立憲民主・無所属の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/62","2026-10-27","国会会議録","全国の定時制、通信制高校を対象として、自殺リスクの把握方法、それから把握後の対応、学校内外の支援への接続はどうしているかという実態など、課程別に明らかにするような、そういう意味の調査も行うべきだというふうに考えます。"]],"id":1212},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"生徒の自殺リスク対応のための組織的支援の実施","m":"一人一台端末等を用いたアンケート調査の結果を基に、スクールカウンセラーやスクールソーシャルワーカーを交えた会議を実施し、困難を抱える児童生徒を確認後、専門機関へつなぐ組織的な対応が行われている。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/61","2026-10-27","国会会議録","例えば、一人一台端末等を活用した生徒へのアンケート調査の結果等を基に、スクールカウンセラーやスクールソーシャルワーカーを交えた会議、これの会議において困難を抱える児童生徒を確認しまして、その上で、教員や専門職によるプッシュ型の面談を実施したり、必要に応じまして医療や福祉等の専門機関へつなぐといった組織的な対応が行われているものと承知しております。"]],"id":1213},{"a":"government","s":"planned","k":"会議・協議","f":"福祉","t":"児童生徒の自殺対策を検討し、関係省庁と協議","m":"高校生の自殺の実態を丁寧に把握した上で、児童生徒の自殺対策を検討し、関係省庁と対応をしっかりと協議する。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/55","2026-10-27","国会会議録","文部科学省としましても、高校生のこの自殺の実態を丁寧に把握をいたしました上で、児童生徒の自殺対策、ここを検討することがもう何より重要と考えておりまして、関係省庁と対応をしっかりと協議をしてまいりたいと思います。"]],"id":1214},{"a":"government","s":"ongoing","k":"政策の実施","f":"雇用・労働","t":"教師の在校等時間に関する調査を毎年実施","m":"教育委員会に対する調査を通じて、上限指針（月45時間以下）の教師の割合や月平均時間などを把握している。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/48","2026-10-27","国会会議録","教師の在校等時間の状況につきましては、毎年教育委員会に対する調査を行いまして、上限指針の原則である月四十五時間以下の教師の割合であったり、一か月当たりの平均時間などを把握しているところでございます。"]],"id":1215},{"a":"government","s":"ongoing","k":"その他","f":"雇用・労働","t":"教師を対象とする調査の実施について検討","m":"各教育委員会向けの調査結果を踏まえ、学校現場への負担に留意しながら、教師を対象とする調査の実施について検討する。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/48","2026-10-27","国会会議録","教師を対象とする調査の実施につきましては、各教育委員会向けの調査の結果を踏まえながら、調査に係る学校現場への負担等にも留意しながら検討してまいりたいと思います。"]],"id":1216},{"a":"government","s":"ongoing","k":"その他","f":"雇用・労働","t":"改正給特法に基づく調査内容を検討","m":"改正給特法の附則に基づく調査について、休憩時間の実態を含め、どのような内容で行うかしっかりと検討する。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/48","2026-10-27","国会会議録","そのため、休憩時間の実態も含めてどのような内容で行うかについては、しっかりと中で検討をしてまいりたいと思います。"]],"id":1217},{"a":"cdp","s":"planned","k":"提言・要望","f":"雇用・労働","t":"教育現場の休憩確保に向けた複合的対策の推進を提言","m":"教育現場の休憩確保が法令違反の状況にあるとし、時間外勤務手当の検討や、十五分の年休を認めるなど、法律改正を含めた複合的な対策を進めるべきと提言した。","d":"","e":"","r":"opposition","n":1,"src":[["参議院 文教科学委員会 第2号（立憲民主・無所属の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/47","2026-10-27","国会会議録","もう少し年休の時間等も含めて細かな、何というか、やりくりができるような、例えば十五分の年休を認めるとか、いろんなこと、複合的な対策を具体的に法律の改正も含めて進めていかないといけないのではないかというふうに思っているんです。"]],"id":1218},{"a":"government","s":"ongoing","k":"政策の実施","f":"雇用・労働","t":"教員服務監督に関する確認手続きの実施","m":"教職に就いている現職者に対し、施行から3年間で分散して確認を取り、その後5年後にも再度確認を行う仕組みが運用されている。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/42","2026-10-27","国会会議録","在籍者、既に現在教職に就いておられる施行時現職者につきましては、施行から三年間の間に分散してこの確認を取っていただくということになってございます。その分散して取っていただいた後の五年後からまた取っていただくということで、必ずしもその特定の期間に全てが集中するということではない仕組みにはなっているかと思います"]],"id":1221},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"学校の働き方改革を推進し環境整備に取り組む","m":"教員業務支援員などの支援スタッフ配置充実、地域学校協働活動を通じた体制づくり、行政の支援体制構築、伴走支援、人材投資などを通じて学校の働き方改革を加速させる。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/13","2026-10-27","国会会議録","教員業務支援員や学習指導員を始めとする支援スタッフの配置充実、あるいは、地域学校協働活動やコミュニティ・スクールを通じた学びを支える体制づくり、また、過剰な要求等、学校だけでは解決が難しい問題に対する行政の支援体制の構築、こういったことなどにおきまして地域と連携、協働しながら、学校を支える人材の充実やその環境整備に取り組んでいるところでございます。"]],"id":1233},{"a":"government","s":"ongoing","k":"法案・制度","f":"子育て・教育","t":"次期学習指導要領改訂に向けたAI教育の検討","m":"中教審において、次期学習指導要領で情報活用能力の抜本的向上を図るため検討を進めている。小学校ではメディアリテラシーを、中学校では情報・技術科を創設しAIリスクを学ぶ方向性を示している。","d":"","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/9","2026-10-27","国会会議録","現在、中教審におきましては、次期学習指導要領において、情報活用能力の抜本的向上を図ることとして検討を進めております。"]],"id":1234},{"a":"government","s":"ongoing","k":"政策の実施","f":"外交・安全保障","t":"現地情報隊による海外任務に必要な情報収集を実施","m":"自衛隊がＰＫＯなどで海外に派遣される際、任務遂行や安全確保に必要な現地の情報を、防衛省設置法に基づき収集している。一般市民の私的な情報を収集することを目的としたものではない。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（防衛省防衛政策局次長の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/266","2026-10-27","国会会議録","現地情報隊は、自衛隊がＰＫＯなどで海外に派遣される場合に備え、部隊の任務遂行や安全確保に必要な現地の情報の収集を行っております。これにつきましては、防衛省設置法第四条第一項第四号に基づき実施をしており、関係法令を遵守する形で業務を行っております。"]],"id":1237},{"a":"government","s":"ongoing","k":"その他","f":"防災・災害","t":"日米共同統合演習の安全な実施に向け努力を継続","m":"地元の安全、安心の確保と信頼の維持に努めながら、日米共同統合演習を安全かつ適切に実施できるようあらゆる努力を継続する。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（防衛大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/199","2026-10-27","国会会議録","引き続き、地元の安全、安心の確保と信頼の維持に努めながら、本演習を安全かつ適切に実施できるように、あらゆる努力を継続してまいります。"]],"id":1240},{"a":"government","s":"ongoing","k":"会議・協議","f":"外交・安全保障","t":"日米防衛産業協力の協議を推進","m":"DICASの下で、ミサイルの共同生産、米軍艦船・航空機の共同維持整備、重要鉱物に係る協力を含めたサプライチェーンの強靱化を目指し日米間で協議を進めている。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（防衛大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/190","2026-10-27","国会会議録","ＤＩＣＡＳの下でミサイルの共同生産、米軍艦船、航空機の共同維持整備、重要鉱物に係る協力を含めたサプライチェーンの強靱化、こういった取組を進めており、防衛生産・技術基盤の強化や日米同盟の抑止力、対処力に資する防衛産業協力の実現を目指して日米間で協議を進めています。"]],"id":1244},{"a":"government","s":"ongoing","k":"会議・協議","f":"経済・産業","t":"戦闘機用エンジンの修理拠点設置可能性を検討","m":"多国間協力の枠組みPIPIRにおいて、F100、F110戦闘機用エンジンの日本国内における修理拠点設置の実現可能性について検討している。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（防衛大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/190","2026-10-27","国会会議録","これにおいてＦ１００、Ｆ１１０戦闘機用エンジンの日本国内における修理拠点設置の実現可能性について検討をしています。"]],"id":1245},{"a":"government","s":"ongoing","k":"声明・談話","f":"外交・安全保障","t":"G7など同志国と連携し輸出規制への懸念を表明","m":"中国の恣意的な輸出規制に対し、G7など同志国と緊密に連携し、深刻な懸念を表明する発言を行っている。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（経済産業省貿易経済安全保障局貿易管理部長の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/183","2026-10-27","国会会議録","Ｇ７など、同志国とも緊密に連携しまして、日本のみをターゲットとしたこのデュアルユース品目の輸出規制措置も含めて、中国のこの恣意的な輸出規制に対する深刻な懸念をこれを表明するなど、発言を行っているところでございます。"]],"id":1249},{"a":"government","s":"ongoing","k":"政策の実施","f":"経済・産業","t":"重要鉱物関連事業を政府出資・助成金で支援","m":"レアアースを含む重要鉱物について、鉱山開発や分離精製事業などに対し、政府出資や助成金を通じて支援を行っている。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（経済産業省貿易経済安全保障局貿易管理部長の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/183","2026-10-27","国会会議録","レアアースを含む重要鉱物につきましては、これまでも鉱山開発や分離精製事業など、政府出資、助成金を通じて支援してきているところでございます。"]],"id":1250},{"a":"government","s":"ongoing","k":"政策の実施","f":"経済・産業","t":"供給源多角化とサプライチェーン事業者への支援を実施","m":"供給源の多角化に取り組むとともに、サプライチェーンの中下流に位置する事業者に対する調達ルートの切替えを支援していく。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（経済産業省貿易経済安全保障局貿易管理部長の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/183","2026-10-27","国会会議録","引き続き、このような供給源の多角化に取り組んでいくとともに、サプライチェーンの中下流に位置する事業者に対する調達ルートの切替えを支援してまいりたいと思います。"]],"id":1251},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"外交・安全保障","t":"非核三原則を政策上の方針として堅持","m":"政府として非核三原則を政策上の方針として堅持していることを繰り返し述べている。","d":"","e":"","r":"government","n":2,"src":[["参議院 外交防衛委員会 第2号（防衛大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/179","2026-10-27","国会会議録","政府として非核三原則を政策上の方針として堅持しているというのは繰り返し述べているとおりです。"],["参議院 外交防衛委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/169","2026-10-27","国会会議録","政府としては非核三原則を政策上の方針として堅持しております。"]],"id":1252},{"a":"government","s":"planned","k":"政策の実施","f":"外交・安全保障","t":"防衛力の整備を推進","m":"周辺の状況を踏まえ、まず防衛力をしっかり整備していく必要があるとしている。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（防衛大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/179","2026-10-27","国会会議録","我々としては、まず防衛力をしっかり整備をして、"]],"id":1253},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"外交・安全保障","t":"三文書における議論を具体化","m":"アメリカの核戦力による拡大抑止を含め、三文書の中で具体的かつ正確に様々な議論を積み上げていくことが重要であるとしている。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（防衛大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/179","2026-10-27","国会会議録","こういったことを含めて三文書の中で具体的かつ正確に様々な議論を積み上げていくことが大事だと思っております。"]],"id":1254},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"経済・産業","t":"G7各国と連携しサプライチェーンの多角化・強靱化を実施","m":"サプライチェーンの多角化、強靱化を含め、米国を始めとするG7の各国などと緊密に連携して必要な対応を行っていく考え。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（外務省大臣官房参事官の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/165","2026-10-27","国会会議録","同時に、サプライチェーンの多角化、強靱化を含めて、米国を始めとするＧ７の各国などとも緊密に連携しまして必要な対応を行っていく考えでございます。"]],"id":1262},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"外交・安全保障","t":"中国との関係で戦略的互恵関係を包括的に推進","m":"中国との関係において、課題がある中でも、戦略的互恵関係を包括的に推進するという方針を一貫して取っている。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（外務省大臣官房参事官の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/165","2026-10-27","国会会議録","これらを踏まえながら中国との関係で戦略的互恵関係を包括的に推進するという方針を一貫して取っております。"]],"id":1263},{"a":"government","s":"planned","k":"閣議決定・計画","f":"外交・安全保障","t":"国益を守るための対話を進め安定的な関係を構築","m":"国益を守るための対話を進め、建設的かつ安定的な関係を構築していく。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（外務省大臣官房参事官の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/165","2026-10-27","国会会議録","国益を守るための対話を進めて、建設的かつ安定的な関係を構築してまいります。"]],"id":1264},{"a":"government","s":"ongoing","k":"政策の実施","f":"外交・安全保障","t":"中国の措置を注視し注意喚起を実施","m":"在留邦人の安全、安心、日本企業のビジネスに影響を与え得る中国の措置について、高い関心を持って注視し、必要に応じて注意喚起を行っている。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（外務省領事局長の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/164","2026-10-27","国会会議録","平素より、在留邦人の安全、安心、あるいは日本企業のビジネスに影響を与え得る中国の措置につきましては、高い関心を持って注視し、必要に応じて注意喚起を行っております。引き続き適切に対応していく考えでございます。"]],"id":1265},{"a":"government","s":"ongoing","k":"提言・要望","f":"外交・安全保障","t":"中国側へ邦人拘束に関する対応を要請","m":"中国側に対し、これまで累次にわたり領事面会の実施、事実関係の説明、拘束された邦人の健康面への配慮等を申し入れており、引き続き適切な対応を求めている。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（外務省領事局長の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/164","2026-10-27","国会会議録","また、中国側に対しまして、これまで累次にわたり領事面会の実施、事実関係の説明及び拘束された邦人の健康面への配慮等を申し入れてきており、引き続き中国側に適切な対応を求めてまいります。"]],"id":1266},{"a":"government","s":"ongoing","k":"政策の実施","f":"外交・安全保障","t":"アデン湾等における海賊対処行動を実施","m":"ソマリア沖やバブ・エル・マンデブ海峡に隣接するアデン湾において、海賊対処行動を実施している。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（防衛大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/151","2026-10-27","国会会議録","ソマリア沖やバブ・エル・マンデブ海峡に隣接するアデン湾における海賊対処行動、そして、中東地域で日本関係船舶の安全確保に必要な情報を収集するための情報収集活動、これらに当たっております。"]],"id":1273},{"a":"government","s":"ongoing","k":"その他","f":"経済・産業","t":"新たな防衛産業エコシステム構築のための法人を検討","m":"防衛生産基盤強化、装備移転、防衛イノベーションの促進を一体的に推進するため、従来の防衛産業以外との連携を促進する新たな法人を検討している。経済産業省など関係省庁と連携し、三文書の策定過程で具体化する予定。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（防衛装備庁装備政策部長の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/143","2026-10-27","国会会議録","従来の防衛産業のみならず、非防衛産業、スタートアップ、国の研究開発法人、金融機関等のプレーヤーとの連携を促進し、新たな防衛産業エコシステムを構築するための中核的存在として、防衛生産基盤強化、装備移転、防衛イノベーションの促進を一体的に推進するものとすることを検討しているところでございます。"]],"id":1280},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"外交・安全保障","t":"竹島問題について適切な対応策を検討","m":"国際法にのっとり冷静かつ平和的に紛争を解決するという考えに基づき、今後も最も適切な対応策を検討していく。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/135","2026-10-27","国会会議録","政府としては、竹島問題については、国際法にのっとり冷静かつ平和的に紛争を解決するという考えに基づき、今後とも最も適切な対応策を検討してまいります。"]],"id":1282},{"a":"government","s":"ongoing","k":"政策の実施","f":"外交・安全保障","t":"事態打開に向けロシア側と粘り強くやり取りを継続","m":"日ロ関係が厳しい状況にあるが、事態の打開に向けてロシア側と粘り強くやり取りを続けていく。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/135","2026-10-27","国会会議録","事態の打開に向けてロシア側と粘り強くやり取りを続けていきたいと、このように考えています。"]],"id":1284},{"a":"government","s":"ongoing","k":"その他","f":"外交・安全保障","t":"北方領土情勢に関する情報収集を継続","m":"ロシア側の発表等を丹念にフォローしながら、北方領土をめぐる情勢や社会経済状況に影響を与える動向について必要な情報収集を継続している。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（外務省大臣官房参事官の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/133","2026-10-27","国会会議録","日本政府といたしましては必要な情報収集を行ってまいります。"]],"id":1285},{"a":"government","s":"planned","k":"閣議決定・計画","f":"外交・安全保障","t":"三文書の改定を実施","m":"我が国の安全保障への影響について、部隊の運用、生産技術基盤、イノベーションなどを含め、各国の動向に注視しながら三文書の改定を行う。","d":"2026-12","e":"","r":"government","n":3,"src":[["衆議院 外務委員会 第2号（防衛省防衛政策局次長の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/126","2026-10-28","国会会議録","年末に予定をしております三文書の改定におきましても、我が国の安全保障への影響というものについて、部隊の運用、また生産技術基盤、イノベーションとかも含めて、各国の動向には注視をしてまいりたいというふうに考えております。"],["参議院 外交防衛委員会 第2号（防衛大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/17","2026-10-27","国会会議録","急速な情勢の変化、これを反映をすべく、今、年末までの改定作業に非常に省内挙げて大変な努力を職員もしています。"],["参議院 外交防衛委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/169","2026-10-27","国会会議録","三文書の改定については年末に向けて今検討を進めているところでありまして、現時点でその具体的な内容であったりとか表現ぶりについて予断をすることは差し控えたいと思いますが"]],"id":1287},{"a":"government","s":"planned","k":"その他","f":"外交・安全保障","t":"三文書策定後の各国への説明を実施","m":"域外国との様々な場において検討状況を説明し、策定後には各国からの求めに応じて透明性高く説明を行う。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（防衛大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/17","2026-10-27","国会会議録","策定後にまたしっかりと求めがあれば各国に対して説明をしていくこと、こういったことについても透明性高くやっていきたいと思います。"]],"id":1288},{"a":"jimin","s":"ongoing","k":"提言・要望","f":"外交・安全保障","t":"外務省職員の海外勤務者8千人体制を目指す提言","m":"外務省の海外で勤務される職員を8千人目指すという目標について、人的な形と強靱化を含めた予算を考えた上で取り組む意向を示した。","d":"","e":"","r":"ruling","n":1,"src":[["参議院 外交防衛委員会 第2号（自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/10","2026-10-27","国会会議録","外務省の職員、海外で勤務される方々八千人を目指してということで提言もさせていただいているところでありまして、その点につきましては、人的な形で、また強靱化を含めた予算も考えた上でしっかり取り組んで我々もいく所存でありますので"]],"id":1294},{"a":"government","s":"ongoing","k":"政策の実施","f":"外交・安全保障","t":"外交力の人的・組織的基盤の強化","m":"外務省として、人員配置及び業務の分担の見直しやデジタル化の推進等を行い、人的・組織的基盤の強化に取り組んでいる。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/9","2026-10-27","国会会議録","外務省としても、人員配置及び業務の分担の見直しやデジタル化の推進等を行いつつ、できる限りの人員体制の充実を図るなど、外交力の根幹であります人的、組織的基盤の強化に取り組んでいるところであります。"]],"id":1296},{"a":"government","s":"planned","k":"政策の実施","f":"外交・安全保障","t":"邦人保護に向けた領事業務の充実","m":"邦人の保護体制の強化に向けて、領事業務をさらに充実させていく方針である。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/9","2026-10-27","国会会議録","邦人の保護体制の強化に向けて、領事業務の更なる充実、図っていきたいと考えております。"]],"id":1298},{"a":"government","s":"planned","k":"政策の実施","f":"外交・安全保障","t":"在外公館の強靱化への取り組み","m":"邦人保護の最後の砦として、海外にある在外公館の強靱化に取り組んでいく。","d":"","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/9","2026-10-27","国会会議録","同時に、海外における日本の顔であり、邦人保護の最後のとりででもあります在外公館の強靱化、こういったことにも取り組んでいきたいと、こう考えております。"]],"id":1299},{"a":"government","s":"planned","k":"法案・制度","f":"環境・エネルギー","t":"リサイクル事業への認定制度を創設","m":"太陽光パネルリサイクル法に基づき、一定水準以上のリサイクル事業に対して認定制度を設ける支援を行う。","d":"","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第2号（環境省環境再生・資源循環局資源循環グループ長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00220261027/124","2026-10-27","国会会議録","太陽光パネルリサイクル法により、一定水準以上のリサイクル事業について認定制度を設けるといった支援を行うとともに"]],"id":1302},{"a":"government","s":"planned","k":"政策の実施","f":"環境・エネルギー","t":"リサイクル設備導入支援と実証事業の推進","m":"リサイクル設備の導入支援や、収集運搬の効率化などの実証事業を進め、全国的な処理体制の構築を目指す。","d":"","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第2号（環境省環境再生・資源循環局資源循環グループ長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00220261027/124","2026-10-27","国会会議録","リサイクル設備の導入支援、収集運搬の効率化等の実証事業を進め、全国的な処理体制の構築に将来に備えて取り組んでまいりたいと考えてございます。"]],"id":1303},{"a":"government","s":"ongoing","k":"法案・制度","f":"環境・エネルギー","t":"小規模廃棄の連続を一体の廃棄と判断する方針","m":"公平かつ適正な届出制度とするため、小規模な廃棄を連続して行う等の不適正な廃棄は一体の廃棄と判断し、届出義務の対象とする方針で、引き続き審議会で議論される予定。","d":"","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第2号（環境省環境再生・資源循環局資源循環グループ長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00220261027/122","2026-10- の他","f":"行政・デジタル","t":"施策・政策の企画立案のための意見聴取を実施","m":"出入国在留管理庁は、施策・政策の企画立案に生かすことを目的として、日本人を対象とした意識調査など、様々な方から幅広く意見を聞く取り組みを行っている。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/165","2026-10-27","国会会議録","出入国在留管理庁においては、従前から、施策、政策の企画立案等に生かすことを目的として、例えば日本人を対象とした意識調査など、様々な方から幅広く御意見をお聞きする取組も行っております。"]],"id":1391},{"a":"government","s":"ongoing","k":"政策の実施","f":"雇用・労働","t":"制度を適正に運用","m":"様々な場面において関係者の声に耳を傾け、幅広い方々の理解を得ながら、制度を適正に運用していく。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/163","2026-10-27","国会会議録","法務省としては、引き続き、様々な場面において関係者の声に耳を傾けて、幅広い方々の理解を得ながら、制度を適正に運用してまいりたいと考えております。"]],"id":1395},{"a":"government","s":"planned","k":"政策の実施","f":"福祉","t":"養育費に関する制度の周知・広報に取り組む","m":"養育費の支払確保のための法改正など、養育費に関する制度があることを国民に周知・広報に取り組む。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/133","2026-10-27","国会会議録","養育費の支払確保のための法改正など、そういった養育費に関する制度、これがあるのだということはしっかり周知、広報に取り組んでまいりたいと考えております。"]],"id":1406},{"a":"government","s":"planned","k":"政策の実施","f":"子育て・教育","t":"改正法に基づく調査事項の追加実施","m":"改正民法施行後の実施として、単独親権・共同親権の選択状況、養育費の受領状況、子育ての分担に関する取決めとその状況について新たに設問を追加する。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（こども家庭庁長官官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/113","2026-10-27","国会会議録","具体的には、単独親権又は共同親権の選択状況、法定養育費を含む養育費の受領状況、子育ての分担に関する取決めとその状況について新たに設問を追加しているところでございます。"]],"id":1412},{"a":"government","s":"planned","k":"閣議決定・計画","f":"司法・治安","t":"離婚届の取決め率向上に向けた検討","m":"離婚届の取決め率向上を目指し、居住地だけでなく、個別の経緯や多角的な面から検討を進める方針を示した。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/103","2026-10-27","国会会議録","それぞれの至った経緯とか、いろんな多角的な面から検討して、更なる取決め率の向上に努めたいと考えております。"]],"id":1414},{"a":"government","s":"planned","k":"政策の実施","f":"司法・治安","t":"ハラスメント調査結果の公表","m":"ハラスメント調査の結果が出た場合、公表を行う予定である。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/80","2026-10-27","国会会議録","いずれにせよ、結果が出た場合には公表を行うというふうに承知しておりますので、それを踏まえて適切な対応を取っていきたいと考えております。"]],"id":1418},{"a":"government","s":"ongoing","k":"政策の実施","f":"雇用・労働","t":"ハラスメント防止対策の抜本的見直し","m":"有識者の提言を踏まえ、ハラスメント防止対策の抜本的な見直しを進め、ハラスメントを一切許容しない環境構築に取り組んでいる。","d":"","e":"","r":"government","n":2,"src":[["参議院 法務委員会 第2号（防衛省大臣官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/76","2026-10-27","国会会議録","防衛省といたしましては、有識者の御提言を踏まえ、ハラスメント防止対策の抜本的な見直しを進め、ハラスメントを一切許容しない環境の構築に取り組んでおります。"],["参議院 法務委員会 第2号（防衛省大臣官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/78","2026-10-27","国会会議録","相談体制や教育を始めとするハラスメント防止対策の見直しを進めております。"]],"id":1424},{"a":"government","s":"ongoing","k":"政策の実施","f":"防災・災害","t":"災害発生時の登記情報・地図情報の提供","m":"災害発生直後の支援として、地方公共団体からの求めに応じて登記情報や地図情報の提供を実施している。令和六年能登半島地震や令和八年熊本地震の際にも提供実績がある。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務省民事局長の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/68","2026-10-27","国会会議録","災害発生直後の支援として、地方公共団体が土地や建物の所有者の調査を円滑に行えるよう、地方公共団体からの求めに応じて登記情報や地図情報の提供を行っておりまして、例えば令和六年能登半島地震や令和八年熊本地震の際にもこれらを提供しております。"]],"id":1425},{"a":"government","s":"ongoing","k":"政策の実施","f":"住宅・都市","t":"地番・筆界特定のための資料提供と助言","m":"登記所備付け地図が未整備で地番や筆界が特定できない相談に対し、法務局が保有する旧土地台帳附属地図や地積測量図などの資料に基づき、必要な助言を行っている。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務省民事局長の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/68","2026-10-27","国会会議録","地方公共団体その他の公共事業の実施主体から登記所備付け地図が未整備で地番や筆界が特定できないとの相談がありましたら、法務局では、旧土地台帳附属地図や地積測量図など法務局が保有する資料に基づき、地番や筆界の特定のために必要な助言を行っているところでございます。"]],"id":1426},{"a":"government","s":"planned","k":"法案・制度","f":"司法・治安","t":"行政面での措置を予定","m":"民民間の費用回収が難しい状況に対応するため、民法上の関係ではなく、行政的な側面からの措置を予定している。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務省民事局長の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/62","2026-10-27","国会会議録","そのために、今、民民の関係、民法の世界ではなくて、様々な行政面での措置、そういうものも予定されているものと承知をしております。"]],"id":1427},{"a":"government","s":"planned","k":"閣議決定・計画","f":"防災・災害","t":"管理不全土地管理制度の活用を検討","m":"所有者不明土地管理制度の公告要件がない管理不全土地管理制度を、災害時の緊急対応としても活用できる余地があるか、関係省庁と連携して検討する。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/52","2026-10-27","国会会議録","そうした公告が要件になっていない管理不全土地管理制度というものは災害時の緊急対応としても活用し得る余地があるのではないかというふうに考えておりますので、関係省庁と連携の上、しっかりと検討してまいりたいと思います。"]],"id":1429},{"a":"government","s":"ongoing","k":"政策の実施","f":"司法・治安","t":"ヘイトスピーチの実態調査を現在実施","m":"有識者会議での検討を踏まえ、法務省がヘイトスピーチの実態調査を現在実施している。調査では、ヘイトスピーチに当たらない事例を除き、事例をできる限り整理することが適切とされている。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/49","2026-10-27","国会会議録","法務省としても、こうした考え方を含めて実態調査を現在実施しているところであります。"]],"id":1430},{"a":"cdp","s":"planned","k":"提言・要望","f":"人権・共生","t":"同性婚法制化に向けた準備を法務省に提言","m":"民法上の婚姻に同性カップルを包摂する法案の準備を、次期通常国会会期に向けて法務省に求める。","d":"","e":"","r":"opposition","n":1,"src":[["参議院 法務委員会 第2号（立憲民主・無所属の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/44","2026-10-27","国会会議録","法務省は、次期通常国会会期における速やかな同性婚の法制化に向けて御準備をすべきではないでしょうか。"]],"id":1433},{"a":"cdp","s":"ongoing","k":"法案・制度","f":"司法・治安","t":"婚姻平等法の再提出準備","m":"当事者の救済のため、違憲判決後速やかな法改正が必要であるとして、婚姻平等法の再提出を準備している。","d":"","e":"","r":"opposition","n":1,"src":[["参議院 法務委員会 第2号（立憲民主・無所属の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/42","2026-10-27","国会会議録","本来であれば、速やかに立憲民主党が再提出を準備中の婚姻平等法、これが必要であると思います。"]],"id":1434},{"a":"government","s":"ongoing","k":"政策の実施","f":"司法・治安","t":"再審制度の適切な運用を継続","m":"我が国の改正法に基づき、再審制度を適切に運用することで、刑事訴訟・刑事司法の信頼回復を目指す。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/32","2026-10-27","国会会議録","再審制度につきまして、やはり我が国の改正法に基づいて、適切に運用することによって、やはりこの刑事訴訟、刑事司法の信頼を回復していきたいという思いは同じでございますので、しっかりと運用、これから見ていきたいと思っております。"]],"id":1436},{"a":"government","s":"planned","k":"法案・制度","f":"司法・治安","t":"検察官の不服申立て規定の整備と運用","m":"検察官の不服申立てに関する規定を整備し、原則として禁止する。例外的に十分な根拠がある場合に限り不服申立てを認め、その理由等を遅滞なく公表する運用を行う。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/26","2026-10-27","国会会議録","不服申立てを原則として禁止し、例外的に十分な根拠がある場合に限って認めるということにしております。今回のは十分な根拠がある場合には例外的に不服申立てを認めますけれども、その不服申立ての理由等を遅滞なく公表するということで、そういう運用をするということをしっかりやっていきたいというふうに考えております。"]],"id":1438},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"福祉","t":"老朽化施設の施設整備計画を策定・実施","m":"老朽化した更生保護施設の施設整備について、5年ごとに施設整備計画を策定するなどして計画的に実施している。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務省保護局長の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/12","2026-10-27","国会会議録","老朽化した更生保護施設の施設整備につきましては、五年ごとに施設整備計画を策定するなどして計画的に実施をしております。"]],"id":1442},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"更生保護施設整備費補助金を交付","m":"改築等の費用について、国から更生保護施設整備費補助金を交付している。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務省保護局長の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/12","2026-10-27","国会会議録","改築等の費用については、国から更生保護施設整備費補助金を交付しております。"]],"id":1443},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"補助額算定に資材価格動向を反映","m":"建築資材等の高騰の影響に対応するため、補助額の算定に建築資材等の価格の動向を単価に反映する対応をしている。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務省保護局長の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/12","2026-10-27","国会会議録","補助額の算定に当たりましては、建築資材等の価格の動向を単価に反映するなどの対応をしているところであり"]],"id":1444},{"a":"government","s":"planned","k":"政策の実施","f":"福祉","t":"更生保護施設整備のための補助金充実に努める","m":"老朽化した更生保護施設の整備を着実に実施できるよう、補助金の充実に努めていく方針である。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務省保護局長の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/12","2026-10-27","国会会議録","法務省としては、引き続き、老朽化した更生保護施設の整備を着実に実施できるよう、補助金の充実に努めてまいりたいと考えております。"]],"id":1445},{"a":"government","s":"planned","k":"政策の実施","f":"福祉","t":"地方公共団体への保護司活動支援策を実施","m":"改正保護司法の趣旨を踏まえ、地方公共団体による保護司活動への支援の好事例の周知や情報提供を行うとともに、地方再犯防止推進計画の策定支援や保護観察所と地方公共団体との連携強化を図る。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務省保護局長の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/8","2026-10-27","国会会議録","地方公共団体による保護司活動への支援の好事例の周知や情報提供を行うとともに、地方再犯防止推進計画の策定支援や同計画に基づく施策の実施について、保護観察所と地方公共団体との連携強化を図ることなどにより、地域における保護司活動への支援が一層充実するよう取り組んでまいります。"]],"id":1449},{"a":"government","s":"planned","k":"政策の実施","f":"司法・治安","t":"保護司活動を支える具体策の推進","m":"保護司の皆様の声を丁寧にお聞きしながら、法改正の趣旨を踏まえた具体策を推進し、保護司の活動をしっかりと支えていく方針。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/6","2026-10-27","国会会議録","今後も、保護司の皆様の声を丁寧にお聞きしながら、法改正の趣旨を踏まえた具体策を推進することにより、保護司の皆様の活動をしっかりと支えてまいりたいと考えております。"]],"id":1453},{"a":"government","s":"ongoing","k":"政策の実施","f":"雇用・労働","t":"実質賃金上昇の定着と家計所得増加への取り組み","m":"経済活性化のため、物価上昇を上回る賃上げを継続的なものとして定着させ、全体として家計の所得が増加するように取り組む。","d":"","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（財務大臣・内閣府特命担当大臣（金融）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/187","2026-10-27","国会会議録","実質賃金上昇を定着させ、全体として家計の所得が増加するように取り組んでまいります。"]],"id":1464},{"a":"government","s":"ongoing","k":"予算・税制","f":"財政・税制","t":"税制改正における研究開発税制のゼロベース見直し","m":"八年度の税制改正において、試験研究費増加のためのインセンティブ強化（一般型控除率カーブ等）を見直している。また、総理方針に基づき、政策効果の低いものは廃止すべきとして、政府税調で研究開発税制も含めゼロベースで見直しを行う。","d":"","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（財務大臣・内閣府特命担当大臣（金融）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/170","2026-10-27","国会会議録","八年度の税制改正でその試験研究費の増加に向けたインセンティブ強化のために一般型の控除率カーブ等は見直しておりまして、今までも見直しはしてきておりますが、その上で、今回、政策効果が低いものは廃止すべきという総理の御方針もあって、政府税調でもいろいろ議論をしてゼロベースで見直すことになっておりますので、それは研究開発税制も決して例外ではないということはしっかりと申し上げておきます。"]],"id":1474},{"a":"jcp","s":"planned","k":"提言・要望","f":"財政・税制","t":"消費税の期限なし減税と廃止を提言","m":"時限的な減税ではなく、期限なしで消費税を減税し、廃止に向かうことが、全ての人に支援が行き届く対策であると提言した。","d":"","e":"","r":"opposition","n":1,"src":[["参議院 財政金融委員会 第2号（日本共産党の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/159","2026-10-27","国会会議録","やっぱり期限なしで消費税を減税すると、そして廃止に向かうというのが一番全ての人に支援が行き届く対策だということを言いたいと思うんですね。"]],"id":1476},{"a":"government","s":"ongoing","k":"政策の実施","f":"経済・産業","t":"個別事情に応じた債務返済への柔軟な対応","m":"被害者の個別事情や返済能力を確認した上で、個々の状況に即して債務の返済に柔軟に対応していく方針を表明した。","d":"","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（金融庁銀行・証券監督局長の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/148","2026-10-27","国会会議録","私どもといたしましては、当行に対しまして、この被害者の個別事情と返済能力、事情、今御指摘いただいた点も含めまして、そういった点をよく確認した上で、その個々の状況に即して柔軟に対応していくように改めて我々としてもよく話をしていきたいと思っております。"]],"id":1480},{"a":"government","s":"ongoing","k":"その他","f":"経済・産業","t":"銀行の示談・返済計画に関する対応状況の確認","m":"銀行との示談や返済計画において、被害者の生活再建に関する不安や問題が生じている点について、個別の対応が適切か、また銀行の対応に問題がないか確認し、問題があれば適切な対応を強く求める。","d":"","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（金融庁銀行・証券監督局長の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/146","2026-10-27","国会会議録","そういった声を踏まえまして、我々として、個別に適切な対応が行われているのかということについて我々としてもよく見ていかなきゃいけないと思いますし、スルガ銀行の対応に問題がないのかということについて我々も確認して、問題がある場合には、被害者に寄り添った対応を行うように、適切な対応を行うように改めて強く求めていきたいというふうに思っております。"]],"id":1481},{"a":"government","s":"planned","k":"閣議決定・計画","f":"財政・税制","t":"財政の持続可能性と成長投資を両立する方針を提示","m":"財政の持続可能性を今の形で確保しつつ、成長投資を大胆に進めるという方針を掲げている。","d":"","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（財務大臣・内閣府特命担当大臣（金融）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/136","2026-10-27","国会会議録","財政の持続可能性を今の形で確保しながらも成長投資は大胆に進めるということで"]],"id":1482},{"a":"government","s":"planned","k":"閣議決定・計画","f":"財政・税制","t":"経済強化のための投資確保と国債発行額のコントロール","m":"経済を強くするものについては上限を設けずしっかりと確保し、国債の通年発行額をコントロールしながら必要な規模を確保していく方針。","d":"","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（財務大臣・内閣府特命担当大臣（金融）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/136","2026-10-27","国会会議録","経済を強くするものにつきましては、当然上限が要求にないわけですからし 主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/127","2026-10-27","国会会議録","今後、予算編成改革という大きな方向性も掲げておりまして、税収動向等を見極めつつ、歳出歳入両面の見直しを進めることと併せて、"],["参議院 財政金融委員会 第2号（財務大臣・内閣府特命担当大臣（金融）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/189","2026-10-27","国会会議録","今後、予算編成改革という大きな枠組みの中で、税収動向等を見極めつつ、歳出歳入両面の見直しを進めることと併せて"]],"id":1491},{"a":"government","s":"planned","k":"閣議決定・計画","f":"財政・税制","t":"債務残高対GDP比の引き下げと財政規模の精査を実施","m":"債務残高の対ＧＤＰ比を安定的に引き下げていく中でも可能となる財政規模を精査し、国債発行額を適切にコントロールする。","d":"","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（財務大臣・内閣府特命担当大臣（金融）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/127","2026-10-27","国会会議録","債務残高の対ＧＤＰ比を安定的に引き下げていく中でも可能となる財政規模を精査して、当初と補正予算を通じた通年の国債発行額を、昨年同様、適切にコントロールしながら、支援金やつなぎを含めて様々な必要な財政需要に対応するというのが政府の方針でございます。"]],"id":1492},{"a":"government","s":"planned","k":"政策の実施","f":"経済・産業","t":"外食事業者に対しテークアウト等の多角化支援を講じる","m":"外食事業者に対し、テークアウト等の多角化の支援を講じる。影響を見極めた上で的確な支援を行うとしている。","d":"","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（農林水産省大臣官房新事業・食品産業部長の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/121","2026-10-27","国会会議録","特に外食事業者につきましては、テークアウト等の多角化の支援を講ずるなど、影響を見極めた上で的確な支援を講ずることとしているところでございます。"]],"id":1494},{"a":"government","s":"planned","k":"政策の実施","f":"財政・税制","t":"簡易課税事業者等に対し本則課税への移行支援を実施","m":"簡易課税事業者および免税事業者に対し、本則課税への移行に関する支援を行うとしている。","d":"","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（農林水産省大臣官房新事業・食品産業部長の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/121","2026-10-27","国会会議録","また、簡易課税事業者、免税事業者につきましては、本則課税への移行についても支援を行うということとしているところでございます。"]],"id":1495},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"経済・産業","t":"今後の予算編成過程で支援内容を具体化する","m":"関係者の声を丁寧に伺いながら検討を進め、今後の予算編成過程において、支援内容の規模も含めて具体化していく。","d":"","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（農林水産省大臣官房新事業・食品産業部長の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/121","2026-10-27","国会会議録","引き続き、関係者の皆様の声を丁寧に伺いながら、どのような支援が必要かということについて検討を進めまして、今後の予算編成過程において、規模も含めて支援内容をしっかりと具体 う。）の基本方針に基づき、温室効果ガス等の排出削減に配慮した契約を推進しています。"]],"id":482},{"a":"jimin","s":"done","k":"法案・制度","f":"外交・安全保障","t":"憲法改正の九条たたき台素案を発表","m":"平和主義の理念の下、九条一項、二項に加え、新たに九条の二を追加し、国防規定の創設、自衛隊の明記、シビリアンコントロールの明記を定めた。","d":"2018","e":"","r":"ruling","n":1,"src":[["衆議院 憲法審査会 第3号（自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204183X00320261105/2","2026-11-05","国会会議録","私たち自由民主党は、二〇一八年、憲法改正の条文イメージとして九条のたたき台素案を発表いたしました。それは、平和主義の理念の下、九条一項、二項に加えて、新たに九条の二を追加し、我が国の平和と独立を守り、国及び国民の安全を保つという国防規定の創設と、その担い手となる実力組織としての自衛隊を明記する、さらに、その活動を民主的な統制の下に置くためのシビリアンコントロールの明記、これを定めてはどうかというものであります。"]],"id":562},{"a":"jimin","s":"done","k":"法案・制度","f":"外交・安全保障","t":"九条の二を追加する憲法改正を提案","m":"現行の九条一項、二項に加えて、新たに九条の二を追加することを提案した。これは、国防規定の創設、自衛隊の明記、シビリアンコントロールの規定を設けることを目的としている。","d":"2018-04","e":"","r":"ruling","n":1,"src":[["衆議院 憲法審査会 第3号（自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204183X00320261105/16","2026-11-05","国会会議録","自民党は、平成三十年の条文イメージにおいて、現行の九条一項、二項に加えて、新たに九条の二を追加することを提案いたしております。"]],"id":549},{"a":"government","s":"done","k":"閣議決定・計画","f":"環境・エネルギー","t":"海岸漂着物対策の基本方針を改定し対策を実施","m":"2019年に海岸漂着物対策の基本方針を改定し、海岸漂着物等の円滑な処理、3R、発生抑制対策の強化等に取り組んでいる。","d":"2019-04","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第2号（環境大臣・内閣府特命担当大臣（原子力防災）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204006X00220261027/98","2026-10-27","国会会議録","政府として、二〇一九年に海岸漂着物対策の基本方針を改定して、海岸漂着物等の円滑な処理と３Ｒを始めとする資源循環の促進、発生抑制対策の強化等に取り組んでおります。"]],"id":1316},{"a":"government","s":"done","k":"政策の実施","f":"行政・デジタル","t":"マイナアプリの提供開始","m":"個人向け行政サービスの総合的な窓口であるマイナポータルの利用やデジタル認証サービスを活用したマイナンバーカードによる本人確認を行うアプリの提供を開始した。","d":"2019-11","e":"","r":"government","n":1,"src":[["参議院 デジタル社会の形成及び人工知能の活用等に関する特別委員会 第3号（デジタル庁統括官の発言）","https://kokkai.ndl.go.jp/txt/122215385X00320261028/112","2026-10-28","国会会議録","このマイナアプリにつきまして、アンドロイド、ｉＰｈｏｎｅ両方での提供を開始いたしました令和元年十一月から"]],"id":1033},{"a":"government","s":"done","k":"政策の実施","f":"子育て・教育","t":"生命の安全教育教材及び指導の手引を作成・公表","m":"学校における生命の安全教育を推進するため、教材及び指導の手引を作成し公表した。","d":"2021-04","e":"","r":"government","n":1,"src":[["衆議院 文部 策事業）"],["令和８年度特定外来生物防除等対策事業に係る間接交付事業者（地方公共団 体）公募要領[PDF 2.1MB]","https://www.env.go.jp/content/000441656.pdf","2026-11-12","環境省","本事業は、特定外来生物又は特定外来生物への指定を検討されている生物（以下、特定外来生物等）による生態系及び人の生命・身体に係る被害の防止に向け、地方公共団体が実施する事業の費用に充てるため、国が交付事業者を介して地方公共団体に対して交付するものです。"]],"id":232},{"a":"government","s":"done","k":"政策の実施","f":"雇用・労働","t":"職域の関係団体への検査受検勧奨の依頼","m":"令和5年3月に関係団体に対し、肝炎ウイルス検査の受検勧奨や、検査受診を希望する場合の特段の配慮を依頼している。","d":"2023-03","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/27","2026-10-30","国会会議録","職域においても、令和五年三月に関係団体に対して協力を依頼をしまして、肝炎ウイルス検査の受検の勧奨、それから検査の受診を希望する場合における特段の配慮等、これをお願いをしているところでございます。"]],"id":680},{"a":"government","s":"done","k":"閣議決定・計画","f":"環境・エネルギー","t":"生物多様性国家戦略の策定","m":"生物多様性の損失を止め、反転させる「ネイチャーポジティブ」を「2030 年ミッション」として掲げた。","d":"2023-04","e":"2030-03","r":"government","n":1,"src":[["絶滅のおそれのある野生動植物の種の保存につき講ずべき措置について（答申案）","https://www.env.go.jp/content/000441685.pdf","2026-11-12","環境省","令和５年（2023 年）に策定された「生物多様性国家戦略2023-2030」において、生物多様性の損失を止め、反転させるという、いわゆるネイチャーポジティブが「2030 年ミッション」として掲げられた。"]],"id":205},{"a":"government","s":"done","k":"会議・協議","f":"環境・エネルギー","t":"種の保存法に関する施行状況評価会議の設置","m":"種の保存に関する法律の施行状況について検討・評価し、課題を整理した。","d":"2023-04","e":"2024-03","r":"government","n":1,"src":[["絶滅のおそれのある野生動植物の種の保存につき講ずべき措置について（答申案）","https://www.env.go.jp/content/000441685.pdf","2026-11-12","環境省","環境省では、令和５～６年度（2023～2024 年度）にかけて「絶滅のおそれのある野生動植物の種の保存に関する法律の施行状況評価会議」を設置し、本法の施行状況について検討・評価し、課題を整理した。"]],"id":207},{"a":"government","s":"done","k":"その他","f":"福祉","t":"自殺に関する統計の集約と要因分析の実施","m":"令和五年度に取りまとめられたプランに基づき、警察、消防、学校、地方自治体等が保有する自殺に関する統計や関連資料を集約し、多角的な要因分析を行う調査研究に取り組んだ。","d":"2023-04","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（こども家庭庁長官官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/43","2026-11-05","国会会議録","こども家庭庁では、令和五年度に取りまとめられたこどもの自殺対策緊急強化プランに基づき、警察、消防、学校や教育委員会、地方自治体等が保有する自殺に関する統計や関連資料を集約し、多角的な要因分析を行う調査研究に取り組んでまいりました。"]],"id":522},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"子供の人権相談を様々なツールで実施","m":"法務省の人権擁護機関において、子供の人権問題に対し、ミニレター、電話、チャット、インターネットなど様々なツールを活用して人権相談に応じている。","d":"2023-04","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（法務省人権擁護局長の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/33","2026-11-05","国会会議録","法務省の人権擁護機関におきましては、子供の人権問題につきまして、先ほど大臣が答弁申し上げたとおり、様々なツールを活用して人権相談に応じております。"]],"id":529},{"a":"government","s":"done","k":"政策の実施","f":"医療","t":"肝炎ウイルス検査結果を踏まえた受療推進の協力依頼","m":"令和5年、関係団体の長に対し、手術前等に行われる肝炎ウイルス検査の結果を踏まえた受診、受療、フォローアップの推進について医療機関管理者への協力依頼を実施した。","d":"2023-04","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/73","2026-10-30","国会会議録","令和五年には、関係団体の長に対して、手術前等に行われる肝炎ウイルス検査の結果を踏まえた受診、それから受療、フォローアップ、これの推進等について医療機関管理者への協力依頼を行ったところでございます。"]],"id":643},{"a":"government","s":"done","k":"法案・制度","f":"環境・エネルギー","t":"特定外来生物防止法の一部改正を施行","m":"特定外来生物による生態系等に係る被害の防止に関する法律の一部改正法が成立し、施行された。","d":"2023-04-01","e":"","r":"government","n":1,"src":[["参考３_令和８年度特定外来生物防除等対策事業（概要）[PDF 509KB]","https://www.env.go.jp/content/000441670.pdf","2026-11-12","環境省","令和４年５月に「特定外来生物による生態系等に係る被害の防止に関する法律」の一部改正法が成立し、令和５年４月に施行された。"]],"id":223},{"a":"jimin","s":"done","k":"提言・要望","f":"行政・デジタル","t":"広報協議会規程等、関連法律改正の準備と協議を提案","m":"広報協議会規程、広報実施規程、事務局規程、国会職員法など関連法律の改正について、事務方での準備と各会派での協議を提案した。","d":"2023-05","e":"","r":"ruling","n":1,"src":[["衆議院 憲法審査会 第2号（自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204183X00220261029/5","2026-10-29","国会会議録","当時与党筆頭幹事を務めておりました私から、広報協議会について定めるべき広報協議会規程、広報実施規程、事務局規程、さらに、国会職員法など関連法律の改正について、まずは事務方で準備を進め、それを基に成案を得るべく、各会派で協議してはどうかという提案をいたしました。"]],"id":771},{"a":"government","s":"done","k":"法案・制度","f":"司法・治安","t":"家事事件手続のデジタル化改正法を成立","m":"家事事件手続のデジタル化を内容とする改正法が成立した。","d":"2023-06","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/12","2026-11-05","国会会議録","家事事件手続のデジタル化を内容とする改正法は令和五年六月に成立し"]],"id":535},{"a":"government","s":"done","k":"会議・協議","f":"雇用・労働","t":"特別防衛監察及び有識者会議を実施し結果を公表","m":"防衛省・自衛隊全体のハラスメント対応における組織的な課題を把握し、防止対策を抜本的に見直すため、監察を実施し、結果と提言を公表した。","d":"2023-08","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（防衛省大臣官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/78","2026-10-27","国会会議録","令和五年八月に監察結果及び提言を公表したものでございます。"]],"id":1419},{"a":"government","s":"done","k":"その他","f":"司法・治安","t":"特別防衛監察結果の公表","m":"特別防衛監察の結果を公表するとともに、有識者会議からの提言を得た。","d":"2023-08","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（防衛省大臣官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/76","2026-10-27","国会会議録","令和五年八月、特別防衛監察の結果を公表するとともに、有識者会議からも御提言をいただきました。"]],"id":1423},{"a":"government","s":"done","k":"会議・協議","f":"環境・エネルギー","t":"GFC関係省庁連絡会議を設置","m":"化学物質に関するグローバル枠組み（GFC）の採択を受け、政策対話やパブリックコメントを踏まえ、関係省庁間で議論を行うための会議体を設置した。","d":"2024-04","e":"","r":"government","n":2,"src":[["化学物質に関するグローバル枠組み（GFC） 第１回国際会議（IC1）の開催について","https://www.env.go.jp/press/press_05805.html","2026-11-06","環境省","2024年４月にGFC関係省庁連絡会議を設置"],["GFC国内実施計画","https://www.env.go.jp/content/000369162.pdf","2026-11-06","環境省","GFC の採択を受け、これに基づくGFC 国内実施計画を策定するため、政府内にGFC 関係省庁連絡会議を設置し、GFC 国内実施計画の策定を進めてきた。"]],"id":475},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"肝疾患診療拠点病院等への普及啓発支援を実施","m":"肝疾患診療拠点病院等に対し、普及啓発資材の作成や研修会等の開催の取組への支援を実施している。","d":"2024-04","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/112","2026-10-30","国会会議録","令和六年度から、肝疾患診療拠点病院等において、当該事業の普及啓発資材の作成や研修会等の開催の取組への支援を実施しております。"]],"id":602},{"a":"government","s":"done","k":"法案・制度","f":"福祉","t":"労災保険法等改正法の検討と見直し","m":"有識者で構成される検討会で現代的課題を踏まえ議論し、その結果を労働政策審議会で議論して見直しを行った。","d":"2024-04","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第3号（厚生労働省大臣官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122204006X00320261030/49","2026-10-30","国会会議録","今回の労災保険法等改正法につきましては、令和六年以降、有識者で構成されます検討会におきまして、女性の労働参加の進展、就労形態の多様化といった現代的課題を踏まえまして、労災保険制度全般の課題を包括的に御議論いただいた後、その結果を踏まえまして、先ほど申し上げました公労使から成ります労働政策審議会でも御議論いただき見直しを行った、こういう経緯になっております。"]],"id":709},{"a":"government","s":"planned","k":"政策の実施","f":"福祉","t":"修学支援新制度の拡充と支援拡大","m":"修学支援新制度の対象と支援額を大幅に拡充する。令和6年度には中間所得層の多子世帯の学生への支援拡大を目指す。","d":"2024-04","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/59","2026-10-28","国会会議録","この対象、支援額を大幅に拡充いたしますとともに、令和六年度には中間所得層の多子世帯の学生にも支援を拡大し、現在は四十四万人に対して支援を行っているところでございます。"]],"id":901},{"a":"government","s":"done","k":"閣議決定・計画","f":"環境・エネルギー","t":"パワー・アジアを立ち上げ","m":"エネルギー供給の不安定化の影響を強く受けているアジア全体のエネルギー安全保障の強化を目指す取組として立ち上げた。","d":"2024-04","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/162","2026-10-28","国会会議録","四月、エネルギー供給の不安定化の影響を強く受けているアジア全体のエネルギー安全保障の強化を目指す取組として、我が国は、御案内のとおり、パワー・アジア、これを立ち上げました。"]],"id":955},{"a":"government","s":"done","k":"閣議決定・計画","f":"防災・災害","t":"防衛省AI活用推進基本方針の策定","m":"令和六年に防衛省AI活用推進基本方針を策定。AIが人間の判断のサポートであり、その活用に当たっては人間の関与を確保する必要があることを明記した。","d":"2024-04","e":"","r":"government","n":1,"src":[["参議院 デジタル社会の形成及び人工知能の活用等に関する特別委員会 第3号（防衛省大臣官房サイバーセキュリティ・情報化審議官の発言）","https://kokkai.ndl.go.jp/txt/122215385X00320261028/152","2026-10-28","国会会議録","令和六年に策定した防衛省ＡＩ活用推進基本方針においても、ＡＩが行うのは人間の判断のサポートであって、その活用に当たっては人間の関与を確保する必要があると明記しているところ"]],"id":1008},{"a":"government","s":"done","k":"法案・制度","f":"福祉","t":"離婚後の共同親権制度を定めた民法改正法を制定・施行","m":"子の利益の観点から、父母が離婚後も適切な形で子の養育に関わり、その責任を果たすことが重要であるとして、令和六年民法改正法を制定し、4月から施行した。","d":"2024-04","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/143","2026-10-27","国会会議録","この令和六年民法改正法を作り、そして四月から施行されたわけでございます。"]],"id":1400},{"a":"government","s":"done","k":"政策の実施","f":"福祉","t":"離婚後の共同親権制度に関する周知活動を実施","m":"離婚後の共同親権の制度が利用されていることや、改正法の趣旨・内容の周知といった取組の効果が現れたと考えている。","d":"2024-04","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/143","2026-10-27","国会会議録","改正法の趣旨、内容の周知といった取組の効果が現れたものと考えております。"]],"id":1401},{"a":"government","s":"done","k":"政策の実施","f":"福祉","t":"民法改正法の趣旨・内容の周知活動を実施","m":"離婚後共同親権や法定養育費の新設など、子の養育費に関する規律を見直した改正法の趣旨・内容の周知に取り組んだ。自治体職員の研修協力やパンフレットの配付依頼などを行った。","d":"2024-04","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/99","2026-10-27","国会会議録","関係府省庁等と連携して、例えば自治体職員の研修に協力したり、改正法のパンフレットを離婚届に、用紙に挟み込んで配付することを自治体に依頼するなど、改正法の趣旨、内容の周知に取り組んでまいりました。"]],"id":1415},{"a":"government","s":"done","k":"閣議決定・計画","f":"環境・エネルギー","t":"第六次環境基本計画の閣議決定","m":"再生可能エネルギーの最大限の導入に向けた取組を加速化するとした上で、環境への悪影響を防ぎ、地域共生型の再生可能エネルギーの積極的な導入を目指す方針を決定した。","d":"2024-05","e":"","r":"government","n":3,"src":[["別紙　「（仮称）伊佐・えびの・人吉風力発電事業　環境影響評価準備書」に対する環境大臣意見[PDF 127KB]","https://www.env.go.jp/content/000440898.pdf","2026-11-12","環境省","令和６年５月に閣議決定された第六次環境基本計画では、再生可能エネルギーの最大限の導入に向けた取組を加速化するとした上で、再生可能エネルギー発電設備の不適正な導入による環境への悪影響を防ぎ、地域の自然の恵みを損なうことなく地域の合意形成を図りつつ、地域共生型の再生可能エネルギーの積極的な導入を目指す必要があるとしている。"],["化学物質に関するグローバル枠組み（GFC） 第１回国際会議（IC1）の開催について","https://www.env.go.jp/press/press_05805.html","2026-11-06","環境省","2024年５月に第六次環境基本計画を閣議決定（化学物質管理政策に関する記載をGFCの戦略的目的に沿って整理）"],["GFC国内実施計画","https://www.env.go.jp/content/000369162.pdf","2026-11-06","環境省","2024 年５月に閣議決定した第六次環境基本計画においてGFC の戦略的目的に沿って包括的な化学物質管理政策を以下の５点に整理して推進していくこととした。"]],"id":213},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"予防接種事務のデジタル化を推進","m":"従来紙ベースで行っていた予防接種事務をデジタル化し、自治体事務の効率化を図る。また、レセプト情報と連結してワクチンの有効性・安全性の評価にも活用する。","d":"2024-06","e":"2028-03","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/104","2026-10-30","国会会議録","今年の六月から開始をいたしまして、今、徐々に自治体に広がるように促進をしているところでございます。令和十年度には全ての自治体において施行をしていただくことを考えています。"]],"id":613},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"予防接種情報を国システムで保存","m":"デジタル化されたシステム上で、被接種者の氏名、生年月日、住所、接種の種類、実施年月日、ワクチンの名称などの情報を保存する。","d":"2024-06","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/104","2026-10-30","国会会議録","デジタル化を開始した後は、国が設けましたシステム上で、氏名や生年月日、住所などの被接種者情報、あるいは接種をした予防接種の種類、実施年月日、ワクチンの名称などの予防接種情報を確認することが可能となります。これらの情報は、被接種者が亡くなった後五年まで保存をされることとなります。"]],"id":615},{"a":"dpfp","s":"done","k":"会議・協議","f":"政治・選挙","t":"国会機能維持に関する改正案について他会派と合意","m":"大規模災害時等における議員任期の延長など、国会機能の維持に関する改正について、自民、公明、維新、有志の会を含む五会派と合意に至った。","d":"2024-06-01","e":"","r":"opposition","n":1,"src":[["衆議院 憲法審査会 第3号（国民民主党・無所属クラブの発言）","https://kokkai.ndl.go.jp/txt/122204183X00320261105/19","2026-11-05","国会会議録","二〇二四年六月、国民民主党を始め、自民、公明、維新、そして有志の会、五会派で、大規模災害時等における議員任期の延長など国会機能の維持に関する改正が合意までなされたところであります。"]],"id":545},{"a":"government","s":"done","k":"政策の実施","f":"行政・デジタル","t":"国家資格等情報連携・活用システムの運用開始","m":"国家資格等の手続きのデジタル化を図るためのシステムを構築し、運用を開始した。これは「デジタル社会の実現に向けた重点計画」等に基づいている。","d":"2024-08","e":"","r":"government","n":1,"src":[["国家資格等情報連携・活用システムにおけるオンライン決済サービスの調達に係る市場調査（PDF／308KB）","https://www.digital.go.jp/assets/contents/node/basic_page/field_ref_resources/e98a2d2e-f6da-4dce-a3c3-360a38616d8d/4ceb358a/20261029_procurement_request_for_information_1.pdf","2026-11-13","デジタル庁","本システムは、「デジタル社会の実現に向けた重点計画（令和5 年6 月9 日閣議決定）」等に基づき、ガバメントクラウドの活用を前提としてデジタル庁が構築し、令和６年８月から運用を開始している。"]],"id":114},{"a":"government","s":"done","k":"政策の実施","f":"行政・デジタル","t":"国家資格等手続きにおけるオンライン決済基盤の提供","m":"本システムの運用に伴い、国家資格等の手数料等についてオンライン決済や国庫等への納付を可能とするため、オンライン決済基盤を用意し、決済サービスとして提供を行っている。","d":"2024-08","e":"","r":"government","n":1,"src":[["国家資格等情報連携・活用システムにおけるオンライン決済サービスの調達に係る市場調査（PDF／308KB）","https://www.digital.go.jp/assets/contents/node/basic_page/field_ref_resources/e98a2d2e-f6da-4dce-a3c3-360a38616d8d/4ceb358a/20261029_procurement_request_for_information_1.pdf","2026-11-13","デジタル庁","令和６年８月に開始した本システムの運用について、国家資格等の手続に係る手数料等についてオンライン決済や国庫等への納付を可能とするため、本システムの連携先として、オンライン決済基盤を用意し、決済サービスとして提供を行っている。"]],"id":115},{"a":"government","s":"done","k":"閣議決定・計画","f":"環境・エネルギー","t":"第五次循環型社会形成推進基本計画を閣議決定","m":"GFCに基づき、ライフサイクル及びバリューチェーン全体を通じ、材料や製品に含まれる化学物質に関する信頼できる情報を可能な限り入手可能とする取組等を推進することとした。","d":"2024-08-01","e":"","r":"government","n":1,"src":[["GFC国内実施計画","https://www.env.go.jp/content/000369162.pdf","2026-11-06","環境省","2024 年８月に閣議決定した第五次循環型社会形成推進基本計画においても、GFC に基づき、ライフサイクル及びバリューチェーン全体を通じ、材料や製品に含まれる化学物質に関する信頼できる情報を可能な限り入手可能とする取組等を推進することとした。"]],"id":471},{"a":"government","s":"done","k":"閣議決定・計画","f":"防災・災害","t":"防衛省AI活用推進基本方針を策定","m":"防衛省は2年前にAI活用推進基本方針を策定した。この方針は、AI活用における人間の関与確保を基本としている。","d":"2024-10","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（防衛大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/172","2026-10-27","国会会議録","二年前に防衛省は防衛省ＡＩ活用推進基本方針を策定をしています。"]],"id":1255},{"a":"government","s":"done","k":"閣議決定・計画","f":"防災・災害","t":"防災庁を設置し防災体制を強化","m":"国難級の大規模災害に対応するため、防災庁を設置し、平時から復旧復興までの一貫した災害対応の司令塔として我が国の防災体制を強化し、世界一の防災大国を目指す。","d":"2024-11-02","e":"","r":"government","n":1,"src":[["衆議院 災害対策特別委員会 第2号（防災大臣・復興大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204339X00220261105/2","2026-11-05","国会会議録","十一月二日に防災庁が設置されました。防災庁では、千島海溝地震、日本海溝地震、首都直下地震や南海トラフ地震、富士山噴火などの国難級の大規模災害においても、国民の生命、身体、財産を守り抜くため、平時から発災時、復旧復興までの一貫した災害対応の司令塔として我が国の防災体制を強化し、世界一の防災大国を目指してまいります。"]],"id":538},{"a":"government","s":"done","k":"法案・制度","f":"くらし・消費","t":"食品寄附ガイドラインを策定","m":"食品寄附への社会的信頼の向上及び食品寄附促進を目的に、「食品寄附ガイドライン～食品寄附の信頼性向上に向けて～」を策定した。","d":"2024-12","e":"","r":"government","n":5,"src":[["(食品寄附者向け)食品寄附ガイドラインに関する説明会の開催について[PDF:154.5 KB]","https://www.caa.go.jp/notice/assets/consumer_education_cms201_261112_01.pdf","2026-11-12","消費者庁","食品寄附への社会的信頼の向上及び食品寄附促進を目的に、令和6 年12 月25 日に「食品寄附ガイドライン～食品寄附の信頼性向上に向けて～」が策定されました。"],["(地方公共団体向け)食品寄附ガイドラインに関する説明会の開催について[PDF:152.5 KB]","https://www.caa.go.jp/notice/assets/consumer_education_cms201_261112_04.pdf","2026-11-12","消費者庁","食品寄附への社会的信頼の向上及び食品寄附促進を目的に、令和6 年12 月25 日に「食品寄附ガイドライン～食品寄附の信頼性向上に向けて～」が策定されました。"],["(こども食堂等向け)食品寄附ガイドラインに関する説明会の開催について[PDF:153.7 KB]","https://www.caa.go.jp/notice/assets/consumer_education_cms201_261112_03.pdf","2026-11-12","消費者庁","令和6 年12 月25 日に「食品寄附ガイドライン～食品寄附の信頼性向上に向けて～」が策定されました。"]],"id":247},{"a":"government","s":"ongoing","k":"会議・協議","f":"環境・エネルギー","t":"日・インド間のJCM実施のための協議を実施","m":"2025年にMoCに署名して以降、日・インド間で二国間クレジット制度（JCM）の実施に向けた協議を継続的に行っている。","d":"2025-01","e":"","r":"government","n":1,"src":[["日・インド間の二国間クレジット制度（JCM）の詳細規則（Operational Manual）を策定しました","https://www.env.go.jp/press/press_05634.html","2026-11-09","環境省","日本とインドの間では2025年に二国間クレジット制度（Joint Crediting Mechanism: JCM）に関するMoCに署名して以降、その実施のための協議を行ってきました。"]],"id":426},{"a":"government","s":"done","k":"閣議決定・計画","f":"行政・デジタル","t":"マイナンバー情報連携に関する対応の方向性を自治体に周知","m":"課題把握の結果に基づき、マイナンバー情報連携に関する対応の方向性を取りまとめ、自治体に対して周知した。","d":"2025-01","e":"","r":"government","n":1,"src":[["参議院 デジタル社会の形成及び人工知能の活用等に関する特別委員会 第3号（デジタル大臣政務官・内閣府大臣政務官・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215385X00320261028/58","2026-10-28","国会会議録","これに対して対応の方向性を取りまとめ、二〇二五年の一月に自治体に周知したところでございます。"]],"id":1067},{"a":"government","s":"done","k":"法案・制度","f":"環境・エネルギー","t":"特定外来生物防除等対策事業実施要領の施行","m":"特定外来生物防除等対策事業実施要領が施行された。これにより、特定外来生物の被害防止のための事業の効率的かつ効果的な実施を図るための細目が定められた。","d":"2025-01-16","e":"","r":"government","n":2,"src":[["参考２_特定外来生物防除等対策事業実施要領[PDF 266KB]","https://www.env.go.jp/content/000441669.pdf","2026-11-12","環境省","附則１．この実施要領は、令和７年１月 16 日から施行する。"],["令和８年度特定外来生物防除等対策事業に係る間接交付事業者（地方公共団 体）公募要領[PDF 2.1MB]","https://www.env.go.jp/content/000441656.pdf","2026-11-12","環境省","＜追加公募・二次＞ 令和８年11 月 環境省自然環境局野生生物課 外来生物対策室"]],"id":227},{"a":"government","s":"done","k":"閣議決定・計画","f":"環境・エネルギー","t":"地球温暖化対策計画を改定し排出削減目標を設定","m":"2050年ネットゼロ実現に向け、2013年度比で2035年度60％減、2040年度73％減という排出削減目標を設定した。これは官民が予見可能性を持って排出削減と経済成長を両立させるための取り組みである。","d":"2025-02","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第2号（環境省地球環境局長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00220261027/106","2026-10-27","国会会議録","昨年二月の地球温暖化対策計画の改定に当たりましては、二〇五〇年ネットゼロの実現に向けた複数のシナリオとその条件下におけるコストなどを国立環境研究所が推計しています。その上で、官民が予見可能性を持って、排出削減と経済成長の同時実現に向けた取組を進めるため、二〇一三年度比で二〇三五年度六〇％減、二〇四〇年度七三％減という目標を設定したものでございます。"]],"id":1313},{"a":"government","s":"done","k":"閣議決定・計画","f":"環境・エネルギー","t":"野心的な温室効果ガス削減目標を国連に提出","m":"パリ協定の1.5度目標と整合的で野心的な温室効果ガス削減目標を国連に提出した。","d":"2025-02-01","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第2号（環境省地球環境局長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00220261027/21","2026-10-27","国会会議録","緩和策については、昨年二月に、パリ協定の一・五度目標と整合的で野心的な温室効果ガス削減目標を国連に提出しています。"]],"id":1383},{"a":"government","s":"done","k":"閣議決定・計画","f":"環境・エネルギー","t":"上下水道DX技術カタログを公開","m":"デジタル技術の導入を後押しするため、「上下水道DX 技術カタログ」を令和7年3月に公開した。","d":"2025-03-01","e":"","r":"government","n":4,"src":[["報道発表資料","http://www.mlit.go.jp/report/press/content/002045775.pdf","2026-11-12","国土交通省","国土交通省では、デジタル技術の導入を後押しする観点から、「上下水道DX 技術カタログ」を令和７年３月に公開しています。"],["老いゆくインフラを救う！上下水道を守るDX 技術を募集！〜上下水道DX 技術カタログに掲載する技術情報を募集します〜","http://www.mlit.go.jp/report/press/mizukokudo13_hh_000769.html","2026-11-12","国土交通省","今般、さらに技術情報を収集しカタログの内容を充実させるため、上下水道施設のメンテナンスの高度化・効率化に資するデジタル技術の情報を新たに募集します。"],["老いゆくインフラを救う！上下水道を守るDX 技術を募集！〜上下水道DX 技術カタログに掲載する技術情報を募集します〜","http://www.mlit.go.jp/report/press/mizukokudo13_hh_000769.html","2026-11-12","国土交通省","改訂版のカタログ公開は令和９年３月を予定しています。"]],"id":260},{"a":"government","s":"done","k":"その他","f":"環境・エネルギー","t":"GFC国内実施計画の案を公表","m":"政策対話やパブリック・コメントで寄せられた意見を踏まえ、GFC国内実施計画の案を公表し、国民からの意見聴取を行った。","d":"2025-03-01","e":"","r":"government","n":2,"src":[["GFC国内実施計画","https://www.env.go.jp/content/000369162.pdf","2026-11-06","環境省","2025 年３月には、案を公表して国民からの意見聴取を行った。"],["化学物質に関するグローバル枠組み（GFC） 第１回国際会議（IC1）の開催について","https://www.env.go.jp/press/press_05805.html","2026-11-06","環境省","2025年４月に「GFC国内実施計画」を策定"]],"id":474},{"a":"komei","s":"done","k":"会議・協議","f":"人権・共生","t":"選択的夫婦別姓制度に関する党プロジェクトチームを設置","m":"選択的夫婦別姓制度の導入実現に向け、2025年に党プロジェクトチームを設置し、精力的に議論を重ねた。","d":"2025-04","e":"","r":"ruling","n":1,"src":[["令和ニッポンを歩く　“結婚＝改姓”が生む苦しみ","https://www.komei.or.jp/komeinews/p515743/","2026-11-12","公明党","2025年には党プロジェクトチームを設置し、精力的に議論を重ねる。"]],"id":167},{"a":"government","s":"done","k":"法案・制度","f":"環境・エネルギー","t":"法律に基づく指定実施機関を立ち上げ","m":"JCMのプロセス加速化に取り組むため、法律に基づく指定実施機関を立ち上げた。","d":"2025-04","e":"","r":"government","n":1,"src":[["日・インド間の二国間クレジット制度（JCM）の詳細規則（Operational Manual）を策定しました","https://www.env.go.jp/press/press_05634.html","2026-11-09","環境省","昨年４月には、法律に基づく指定実施機関も立ち上げて、プロセスの加速化にも取り組んでいるところです。"]],"id":425},{"a":"government","s":"ongoing","k":"政策の実施","f":"環境・エネルギー","t":"化学物質管理と廃棄の適正管理に資する取組を推進","m":"GFCの趣旨及び国内実施計画に基づき、関係省庁と連携して化学物質管理と廃棄の適正管理に資する具体的な取り組みを推進している。","d":"2025-04","e":"","r":"government","n":1,"src":[["化学物質に関するグローバル枠組み（GFC） 第１回国際会議（IC1）の開催について","https://www.env.go.jp/press/press_05805.html","2026-11-06","環境省","GFCの趣旨及び同計画に基づき、関係省庁と連携して化学物質管理と廃棄の適正管理に資する取組を推進している。"]],"id":478},{"a":"government","s":"done","k":"法案・制度","f":"福祉","t":"児童生徒の自殺背景調査指針の改訂と仕組み構築","m":"令和七年には、文部科学省の児童生徒の自殺が起きたときの背景調査の指針を改訂し、標準的な調査項目を整理するとともに、保護者の同意が得られた場合の提供を受ける仕組みを構築した。","d":"2025-04","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（こども家庭庁長官官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/43","2026-11-05","国会会議録","令和七年には、文部科学省の児童生徒の自殺が起きたときの背景調査の指針を改訂し、標準的な調査項目を整理するとともに、保護者の同意が得られた場合には、文部科学省を通じてこども家庭庁が提供を受ける仕組みを構築してきたところでございます。"]],"id":523},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"不正受給額に関する実績報告の周知","m":"不正受給額を控除せずに令和七年度の自立支援給付費負担金の実績報告を行い、不正受給が確定した段階で再度の実績報告を行うよう関係自治体に周知した。","d":"2025-04","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省社会・援護局障害保健福祉部長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/63","2026-10-30","国会会議録","厚生労働省から関係自治体に対して、本事案に係る不正受給額を控除せずに令和七年度の自立支援給付費負担金の実績報告を行い、不正受給が確定したと考えられる段階で再度の実績報告を行うという旨を周知してございます。"]],"id":650},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"福祉","t":"地方からの提案等への対応方針の検討","m":"地方からの提案等に対する対応方針について、全国の実態調査と関係府省庁との協議を行い、令和八年度中に結論を得て必要な対応を講じる。","d":"2025-04","e":"2027-03","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省社会・援護局障害保健福祉部長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/63","2026-10-30","国会会議録","全国における実態調査を行った上で、関係府省庁と協議の上、他の国庫負担金等の状況も踏まえて対応について検討し、令和八年度中に結論を得る、その結果に基づいて必要な対応を講ずるとされてございます。"]],"id":651},{"a":"government","s":"done","k":"予算・税制","f":"福祉","t":"国立大学運営費交付金に計68億円を措置","m":"近年の物価・人件費上昇に対応するため、令和7年度補正予算と令和8年度当初予算を合わせて計68億円を措置した。","d":"2025-04","e":"2027-03","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省高等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/134","2026-10-28","国会会議録","令和七年度補正予算におきまして四百二十一億円措置をするとともに、令和八年度当初予算において百八十八億を増額し、令和七年度補正予算と令和八年度当初予算を合わせて計六百八億円を措置することになりました。"]],"id":839},{"a":"government","s":"done","k":"法案・制度","f":"雇用・労働","t":"給特法等改正法による働き方改革の促進","m":"昨年成立した給特法等改正法に基づき、学校における働き方改革の促進と処遇改善を図っている。","d":"2025-04","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/132","2026-10-27","国会会議録","昨年成立いたしました給特法等改正法においても、学校における働き方改革の更なる促進や処遇改善を図ったところでございます。"]],"id":1173},{"a":"government","s":"ongoing","k":"政策の実施","f":"雇用・労働","t":"教師の処遇改善等の取組を総合的に推進","m":"令和7年成立の改正給特法に基づき、学校と教師の業務の三分類を基にした業務量管理の徹底や、教職調整額の引上げなど、教師の処遇改善の取り組みを総合的に進めている。","d":"2025-04","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/122","2026-10-27","国会会議録","令和七年に成立した改正給特法を踏まえまして、学校と教師の業務の三分類、これを基にした教育委員会における業務量管理の徹底、教職調整額の引上げを始めとした教師の処遇改善等の取組を総合的に進めているところでございます。"]],"id":1181},{"a":"government","s":"done","k":"法案・制度","f":"雇用・労働","t":"改正給特法に基づく指針に業務分類を位置付け","m":"業務の仕分を行った学校と教師の業務の三分類を、令和七年に成立した改正給特法に基づく指針に位置付けた。","d":"2025-04","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/113","2026-10-27","国会会議録","文科省では、業務の仕分を行った学校と教師の業務の三分類を、令和七年に成立した改正給特法に基づく指針に位置付けたところでございます。"]],"id":1187},{"a":"government","s":"ongoing","k":"政策の実施","f":"財政・税制","t":"給食費等の学校徴収金の公会計化を推進","m":"令和七年度補正予算において、給食費等の学校徴収金の公会計化を推進している。","d":"2025-04","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/113","2026-10-27","国会会議録","令和七年度補正予算でございますが、給食費等の学校徴収金の公会計化を推進しているところでございます。"]],"id":1190},{"a":"government","s":"ongoing","k":"政策の実施","f":"行政・デジタル","t":"マイナンバーカード活用による戸籍提出の実現","m":"従事者の負担軽減のため、電算化された戸籍について、マイナンバーカードを活用した提出を可能にする取り組みを進めている。","d":"2025-04","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（内閣府副大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/38","2026-10-27","国会会議録","こども家庭庁においては、昨年四月に開催している有識者検討会での議論を通じて、従事者の負担軽減のため、先ほどお尋ねがあった電算化された戸籍については、一部かもしれませんが、マイナンバーカード活用することで提出を可能にすることや、従事者用のマニュアルの素案を提示し、対応が必要な手続を分かりやすく示すことなど取組を進めてまいりました。"]],"id":1223},{"a":"government","s":"done","k":"政策の実施","f":"外交・安全保障","t":"マレーシア海軍と共同訓練を実施","m":"昨年、マレーシア海軍とともにマラッカ海峡等において共同訓練を実施し、海洋安全保障の確保に向けた取り組みを進めた。","d":"2025-04","e":"","r":"government","n":1,"src":[["参議院 外交防衛委員会 第2号（防衛大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/151","2026-10-27","国会会議録","昨年は、マレーシア海軍とともにマラッカ海峡等において共同訓練を実施するなど、海洋安全保障の確保に向けた取組も進めておりますし、"]],"id":1274},{"a":"government","s":"ongoing","k":"その他","f":"行政・デジタル","t":"戸籍窓口と子育て部局の連携に関する情報提供準備","m":"昨年度の調査研究で実施した地域連携のネットワークを通じた支援の実証的検討の成果について、こども家庭庁と連携し自治体に情報提供する準備を進めている。","d":"2025-04","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/145","2026-10-27","国会会議録","現在、その成果について、こども家庭庁と連携し、自治体に情報提供する準備を進めているところであります。"]],"id":1398},{"a":"government","s":"planned","k":"予算・税制","f":"財政・税制","t":"高所得者層への追加的な負担を求める措置を導入","m":"極めて高い水準の所得を対象として追加的に負担を求める措置を導入する。これは、高所得者層の負担率の低下が著しい状況を踏まえた措置である。","d":"2025-04","e":"","r":"government","n":1,"src":[["参議院 財政金融委員会 第2号（財務大臣・内閣府特命担当大臣（金融）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122214370X00220261027/195","2026-10-27","国会会議録","極めて高い水準の所得を対象として追加的に御負担を求める措置を導入し、令和七年の所得から適用を開始しております。"]],"id":1456},{"a":"government","s":"planned","k":"法案・制度","f":"環境・エネルギー","t":"改正後の規定の適用開始","m":"この実施要領による改正後の規定は、令和7年度予算に係る交付金から適用される。令和6年度以前の予算に係る交付金については、従前の例が適用される。","d":"2025-04-01","e":"","r":"government","n":1,"src":[["参考２_特定外来生物防除等対策事業実施要領[PDF 266KB]","https://www.env.go.jp/content/000441669.pdf","2026-11-12","環境省","２．この実施要領による改正後の規定は、令和７年度予算に係る交付金から適用し、令和６年度以前の予算に係る交付金については、なお従前の例による。"]],"id":231},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"高校教育改革促進基金によるパイロットケース創出","m":"専門高校を含む先導的な学びの在り方を構築するパイロットケースの創出に向けた取り組みを進めている。","d":"2025-04-01","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/172","2026-10-28","国会会議録","現在、令和七年度補正予算における高校教育改革促進基金を通じまして、専門高校を含む先導的な学びの在り方を構築いたしますパイロットケースの創出に向けた取組を進めますとともに、..."]],"id":800},{"a":"government","s":"planned","k":"政策の実施","f":"行政・デジタル","t":"納税通知書等の電子的送付を早期に実現","m":"地方税における電子化の推進に関する検討会で具体化していくこととしており、令和七年度の検討会とりまとめ後、早期に納税通知書等の電子的送付を実現する予定。","d":"2025-04-01","e":"","r":"government","n":1,"src":[["参議院 デジタル社会の形成及び人工知能の活用等に関する特別委員会 第3号（総務省大臣官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122215385X00320261028/62","2026-10-28","国会会議録","令和七年度同検討会とりまとめにおきまして、納税通知書等の電子的送付の実現後、早期に実現をすることとされております。"]],"id":1064},{"a":"government","s":"done","k":"予算・税制","f":"環境・エネルギー","t":"指定管理鳥獣対策事業交付金の負担率引き上げ","m":"令和七年度の補正予算から、放任果樹の伐採など誘引物管理に係る国の負担率を二分の一から三分の二へ引き上げ、地方単独事業の経費に特別交付税措置を講じ、現場の取り組みを支援している。","d":"2025-04-01","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第2号（環境省自然環境局長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00220261027/27","2026-10-27","国会会議録","令和七年度の補正予算から、指定管理鳥獣対策事業交付金において、放任果樹の伐採など、誘引物の管理に係る国の負担率を二分の一から三分の二へ引き上げるとともに、自治体が交付金を活用せず、地方単独事業として実施する経費につきましても、特別交付税措置を講じることとして、現場の取組を支援しているところでございます。"]],"id":1375},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"行政・デジタル","t":"データベース活用に関する検討チームを立ち上げ、対応策に着手","m":"データベース活用等について、昨年の5月に審議官級の検討チームを立ち上げ、有識者検討会で議論した。直ちに工夫可能な対応として、各システムへのログイン方法を統一することに着手する。","d":"2025-05","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/40","2026-10-27","国会会議録","昨年の五月に審議官級の検討チームを立ち上げてございます。それで、昨年十一月にはこども家庭庁の有識者検討会で議論をし、直ちに工夫を図ることが可能な対応といたしまして、各システムへのログイン方法を統一することなどに着手することから始めることとしているところでございます。"]],"id":1222},{"a":"government","s":"done","k":"閣議決定・計画","f":"行政・デジタル","t":"不法滞在者ゼロプランの公表","m":"不法滞在者ゼロを目指し、外国人と安心して暮らせる秩序ある共生社会を実現することを理念としたプランを公表した。","d":"2025-05","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/171","2026-10-27","国会会議録","不法滞在者ゼロを目指し、外国人と安心して暮らせる秩序ある共生社会を実現することを理念として、昨年五月、不法滞在者ゼロプランを公表しているところであります。"]],"id":1386},{"a":"government","s":"done","k":"会議・協議","f":"行政・デジタル","t":"サービスプロバイダーミーティングの開催","m":"政府調達におけるデジタルインボイスでの請求実施が、サービスプロバイダーミーティング（第1回）で既定路線として確認された。","d":"2025-05-20","e":"","r":"government","n":1,"src":[["Peppolが輝かせる「主役」たち ～富士通、デジタルインボイスの「自分ごと」化～（2026年4月22日）（PDF／356KB）","https://www.digital.go.jp/assets/contents/node/basic_page/field_ref_resources/7e76828a-b1ff-4b10-a04a-b7eca50ea360/f8700b62/20260424_policies_electronic_invoice_outline_03.pdf","2026-11-13","デジタル庁","「政府調達におけるデジタルインボイスでの請求実施は、サービスプロバイダーミーティング（第１回、令和７年５月20日開催）で確認された既定路線だった」"]],"id":101},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"防災・災害","t":"基本計画を変更し、減災目標の拡充を実施","m":"首都直下地震緊急対策推進基本計画（2026年6月）および南海トラフ地震防災対策推進基本計画（2025年7月）を変更し、想定される被害の軽減に向けた減災目標の設定や具体的な個別目標の拡充を行った。","d":"2025-07","e":"","r":"government","n":1,"src":[["参議院 災害対策及び東日本大震災復興特別委員会 第2号（防災大臣・復興大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215384X00220261106/3","2026-11-06","国会会議録","政府では、本年六月に首都直下地震緊急対策推進基本計画、昨年七月に南海トラフ地震防災対策推進基本計画を変更し、想定される被害の軽減に向けた減災目標の設定や具体的な個別目標の拡充を行ったところであり、これらに向けた各施策の着実な実施などにより、想定される甚大な被害の軽減に資するよう対策を進めてまいります。"]],"id":466},{"a":"government","s":"done","k":"閣議決定・計画","f":"防災・災害","t":"地震・津波対策の基本計画を変更","m":"首都直下地震緊急対策推進基本計画および南海トラフ地震防災対策推進基本計画を変更し、想定される被害の軽減に向けた減災目標の設定や具体的な個別目標の拡充を行った。","d":"2025-07","e":"","r":"government","n":1,"src":[["衆議院 災害対策特別委員会 第2号（防災大臣・復興大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204339X00220261105/2","2026-11-05","国会会議録","政府では、令和六年に首都直下地震緊急対策推進基本計画、昨年七月に南海トラフ地震防災対策推進基本計画を変更し、想定される被害の軽減に向けた減災目標の設定や具体的な個別目標の拡充を行ったところであり、これらに向けた各施策の着実な実施などにより、想定される甚大な被害の軽減に資するよう対策を進めてまいります。"]],"id":539},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"避難生活環境の確保に向けた取り組みを推進","m":"災害対策基本法等の一部改正を踏まえ、被災者への福祉的支援の充実や備蓄の推進、快適なトイレやプライバシーが守られた空間の確保など、良好な避難生活環境の確保に取り組む。","d":"2025-07","e":"","r":"government","n":1,"src":[["衆議院 災害対策特別委員会 第2号（防災大臣・復興大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204339X00220261105/2","2026-11-05","国会会議録","昨年七月に施行された災害対策基本法等の一部を改正する法律の趣旨等を踏まえ、被災者への福祉的支援の充実や備蓄の推進に取り組むとともに、快適なトイレや温かく栄養バランスのよい食事、パーティションなどによりプライバシーが守られた空間や入浴機会の確保など良好な避難生活環境の確保により、災害関連死をなくしていくための取組を進めてまいります。"]],"id":540},{"a":"government","s":"done","k":"政策の実施","f":"環境・エネルギー","t":"緊急銃猟ガイドラインの改定と情報提供","m":"緊急銃猟の実施例や関係者間の連携を含めた留意点を、ガイドライン改定や現地研修会・事例報告会を通じて自治体に提供している。","d":"2025-09","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第2号（環境省自然環境局長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00220261027/25","2026-10-27","国会会議録","環境省では、緊急銃猟ガイドラインの改定、現地研修会や事例報告会の開催を通じて、緊急銃猟の実施例や、関係者間の連携を含めた実施の際の留意点を、随時自治体に提供してまいりました。"]],"id":1377},{"a":"government","s":"ongoing","k":"政策の実施","f":"環境・エネルギー","t":"交付金による緊急銃猟関係者への支援","m":"交付金により、緊急銃猟関係者向けの訓練実施、出没時の対応マニュアル整備、ガバメントハンターの人件費などを支援対象としている。","d":"2025-09","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第2号（環境省自然環境局長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00220261027/25","2026-10-27","国会会議録","さらに、交付金によりまして、緊急銃猟関係者向けの訓練の実施、出没時の対応マニュアルの整備、ガバメントハンターの人件費などについても支援対象としているところでございます。"]],"id":1378},{"a":"jimin","s":"done","k":"その他","f":"政治・選挙","t":"連立政権合意を締結","m":"日本維新の会と連立政権合意を締結し、衆院議員の定数削減を盛り込んだ。","d":"2025-10","e":"","r":"ruling","n":1,"src":[["意見書キーワード「衆院定数削減」","https://www.jimin.jp/news/information/214597.html","2026-11-12","自由民主党","わが党と日本維新の会が昨年10月に結んだ連立政権合意に衆院議員の定数削減が盛り込まれ、与野党による議論が進んでいます。"]],"id":192},{"a":"government","s":"done","k":"会議・協議","f":"環境・エネルギー","t":"種の保存に関する法律の在り方検討会の設置","m":"評価結果等を踏まえ、種の保存の観点から必要な措置を検討し、課題への対応の方向性等を取りまとめた。","d":"2025-10","e":"2026-06","r":"government","n":1,"src":[["絶滅のおそれのある野生動植物の種の保存につき講ずべき措置について（答申案）","https://www.env.go.jp/content/000441685.pdf","2026-11-12","環境省","その上で、その評価結果等を踏まえて、種の保存の観点から必要な措置を検討するため、令和７年（2025 年）10 月～令和８年（2026 年）６ 13_1.html","2026-11-13","農林水産省","農林水産省北陸農政局が、令和7年11月19日から令和8年10月15日までの間、アップルサンショウ及びアップルサンショウ栄町店...に対し、牛の個体識別のための情報の管理及び伝達に関する特別措置法...に基づく立入検査等を行いました。"]],"id":75},{"a":"government","s":"done","k":"閣議決定・計画","f":"環境・エネルギー","t":"メガソーラーに関する対策パッケージの決定","m":"希少種の保全上重要な生息・生育地を保全するため、生息地等保護区の設定を推進するとともに、開発行為への対応措置を検討する。","d":"2025-12","e":"","r":"government","n":2,"src":[["絶滅のおそれのある野生動植物の種の保存につき講ずべき措置について（答申案）","https://www.env.go.jp/content/000441685.pdf","2026-11-12","環境省","令和７年（2025 年）12 月に関係閣僚会議において「大規模太陽光発電事業（メガソーラー）に関する対策パッケージ」が決定され、その中で本法についても、「希少種の保全上重要な生息・生育地を保全するため、生息地等保護区の設定を推進するとともに、希少種保全に影響を与え得る開発行為について、事業者に対応を求める際の実効性を担保するための措置等について検討する。」こととされた。"],["「絶滅のおそれのある野生動植物の種の保存につき講ずべき措置について（答申案）」に対する意見募集（パブリック・コメント）について","https://www.env.go.jp/press/press_05803.html","2026-11-12","環境省","また、令和７年12月に決定された「大規模太陽光発電事業（メガソーラー）に関する対策パッケージ」においては、希少種の重要な生息・生育地を保全するための生息地等保護区の設定推進や、希少種保全に影響を与え得る開発行為への対応の実効性確保について検討することとされています。"]],"id":206},{"a":"jcp","s":"done","k":"提言・要望","f":"政治・選挙","t":"議員定数削減反対の国民的共同を呼びかけ","m":"昨年12月、自民・維新政権による民主主義破壊の策動に対し、議員定数削減反対の一点での国民的共同を呼びかけ、国会内外の運動と連帯して戦ってきた。","d":"2025-12","e":"","r":"opposition","n":1,"src":[["民意を切り捨て、民主主義の土台を破壊する議員定数削減をやめさせるため力をあわせましょう（2026年10月30日）","https://www.jcp.or.jp/web_policy/20007.html","2026-10-30","日本共産党","日本共産党は、昨年12月、自民・維新政権による民主主義破壊の策動に対して、議員定数削減反対の一点での国民的共同を呼びかけ、国会内外の運動と連帯してたたかってきました。"]],"id":753},{"a":"government","s":"done","k":"閣議決定・計画","f":"子育て・教育","t":"部活動改革に関するガイドラインの策定","m":"地域クラブ活動の認定制度の要件として、教育的意義の継承、低廉な参加費設定、研修受講指導者による指導、安全確保体制の整備などを定めた。","d":"2025-12","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（スポーツ庁次長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/9","2026-10-28","国会会議録","昨年十二月に策定されました部活動改革に関するガイドラインにございます地域クラブ活動の認定制度におきましては、学校部活動が担ってきた教育的意義を継承、発展させた活動であること、低廉な参加費の設定、市町村が定める研修等を受講して登録された指導者が指導すること、安全確保の体制等を整備していることなどをその要件としております。"]],"id":923},{"a":"government","s":"done","k":"閣議決定・計画","f":"行政・デジタル","t":"適正性確保に関する指針を策定","m":"AI法に基づく対応として、AI開発・提供事業者に対し、不適切な出力の抑制や意図しない動作の防止のため、最新の技術と知見を駆使 め、対前年度比増加となっている。"]],"id":258},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"福祉","t":"外国人受入れの影響分析と基本方針の検討","m":"外国人との秩序ある共生社会推進担当大臣の下、省庁横断的に受入れが社会に与える影響の分析を進め、本年度中に基本方針を取りまとめるための検討を進めている。","d":"2026-04","e":"2027-03","r":"government","n":2,"src":[["参議院 法務委員会 第3号（内閣官房内閣審議官の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/109","2026-11-05","国会会議録","現在、外国人との秩序ある共生社会推進担当大臣の下、省庁横断的に外国人の受入れが社会に与える影響の分析等を進めつつ、本年度中の基本方針の取りまとめに向け検討を進めているところと承知しております。"],["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/167","2026-10-27","国会会議録","現在、外国人との秩序ある共生社会推進担当大臣の下で、省庁横断的に、外国人の受入れが社会に与える影響の分析等を進めつつ、本年度中の基本方針の取りまとめに向け検討を進めていると承知しております。"]],"id":508},{"a":"government","s":"done","k":"政策の実施","f":"医療","t":"学校保健功労者への叙勲授与","m":"学校医、学校歯科医、学校薬剤師として功労を上げた方々に対し、令和八年春に合計六十八名が叙勲の対象となった。","d":"2026-04","e":"2027-03","r":"government","n":2,"src":[["衆議院 文部科学委員会 第3号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/39","2026-10-30","国会会議録","令和八年春の叙勲におきましては、学校医、学校歯科医、学校薬剤師として受章された方が合わせて六十八名となっております。"],["衆議院 文部科学委員会 第3号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/39","2026-10-30","国会会議録","令和八年度におきましては、全国の学校医六十三名、学校歯科医四十五名、学校薬剤師四十名が対象となっております。"]],"id":570},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"Ｂ型肝炎給付金制度の周知のためのリーフレット配布","m":"陽性者にＢ型肝炎給付金制度が周知されるよう、毎年度、厚生労働省から地方自治体や医療機関、検診機関にリーフレットを配布し、制度の案内を依頼している。","d":"2026-04","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/73","2026-10-30","国会会議録","陽性者にＢ型肝炎給付金制度が周知されるよう、毎年度、厚生労働省から地方自治体や医療機関、検診機関にリーフレットを配布し、制度の案内がされるようお願いをしております。"]],"id":645},{"a":"government","s":"done","k":"政策の実施","f":"福祉","t":"就労移行支援体制加算の算定人数上限を設定","m":"就労移行支援体制加算について、令和八年度の臨時の改定において、算定可能な人数の上限を設定した。","d":"2026-04","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/65","2026-10-30","国会会議録","御指摘の事案において焦点となりました就労移行支援体制加算については、令和八年度の臨時の改定において、算定可能な人数の上限を設定をいたしました。"]],"id":647},{"a":"government","s":"planned","k":"その他","f":"医療","t":"ドナーミルクの供給体制に関する情報調査を実施","m":"現行の登録施設の配置状況や今後の需給の伸びを考慮し、ドナーミルクの安全かつ安定的な提供体制の検討に資する情報についての調査を今年度実施する予定である。","d":"2026-04","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（こども家庭庁長官官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/23","2026-10-30","国会会議録","現行の登録施設の配置状況、今後の需給の伸びについても考慮の上、安全かつ安定的な提供体制の検討に資する情報についての調査を今年度実施する予定でございます。"]],"id":684},{"a":"government","s":"done","k":"政策の実施","f":"環境・エネルギー","t":"水道水質基準を施行し、水質検査を義務化","m":"健康リスク低減の観点から、水道水について、本年4月から遵守及び水質検査の義務がある水道水質基準を施行した。","d":"2026-04","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第3号（環境省水・大気環境局長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00320261030/97","2026-10-30","国会会議録","環境省では、水道水につきまして、本年四月から遵守及び水質検査の義務がある水道水質基準を施行したところでございます。"]],"id":691},{"a":"government","s":"done","k":"政策の実施","f":"子育て・教育","t":"地域クラブ活動支援のための新たな補助金創設","m":"学校施設確保、移動手段の確保、低廉な参加費設定などの要件を満たす地域クラブ活動の認定と、経済的に困窮する家庭への参加費負担軽減を地方公共団体の取り組みとして総合的に支援している。","d":"2026-04","e":"","r":"government","n":2,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/174","2026-10-28","国会会議録","文部科学省といたしましては、今年度から新たな補助金を創設いたしまして、学校施設など多くの生徒が集まりやすい活動場所の確保、スクールバス等の有効活用を含めました生徒のニーズや事情等を十分に踏まえた移動手段の確保、可能な限り低廉な参加費の設定などの要件を満たす地域クラブ活動の認定と併せて、経済的に困窮する家庭の生徒に対する参加費用の負担の軽減といいました地方公共団体の取組を総合的に支援をしております。"],["衆議院 文部科学委員会 第2号（スポーツ庁次長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/9","2026-10-28","国会会議録","今年度より新たに創設させていただきました補助金におきましては、地域クラブ活動の活動費等の支援、移動手段の確保やコーディネーターの配置等の体制整備、経済的困窮世帯の生徒への参加費等の支援など、地方公共団体の取組を総合的に支援させていただいているところでございます。"]],"id":798},{"a":"government","s":"done","k":"政策の実施","f":"子育て・教育","t":"高校生等奨学給付金の支援対象拡充と国庫負担率見直し","m":"令和八年度予算において、高校生等奨学給付金の支援対象を年収約490万円世帯まで拡充し、国庫負担率を三分の一から二分の一に見直した。","d":"2026-04","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省大臣官房学習基盤審議官の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/136","2026-10-28","国会会議録","令和八年度予算に
