参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/146","2026-11-05","国会会議録","第二に、一般の政府職員について、今回、転居手当を支給する措置を講ずることとしておりますことから、判事、判事補及び簡易裁判所判事並びに検事及び副検事には、一般の政府職員の例に準じて、これが支給されることになりますが、高等裁判所長官並びに次長検事及び検事長にも、一般の政府職員の例に準じて、この転居手当を支給する措置を講ずることとしております。"]],"id":497},{"a":"government","s":"done","k":"予算・税制","f":"医療","t":"地方交付税による学校医等手当の措置","m":"地方交付税措置により、市町村分（小学校・中学校）では学校医等手当として小学校一校当たり104万円、中学校一校当たり176万円が、高等学校では生徒600人当たり131万6千円が措置されている。","d":"2027-04-01","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第3号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/17","2026-10-30","国会会議録","これらの報酬については地方交付税措置が講じられておりまして、令和八年度におきましては、市町村分の教育費において、学校医四名、学校歯科医一名、学校薬剤師一名分の学校医等手当として合計六名分で、小学校一校当たり百十万四千円、中学校一校当たり百七万六千円が措置されてございます。高等学校につきましては、都道府県分の教育費におきまして非常勤校医等手当として、生徒六百人当たり百三十一万六千円が措置されていると承知しております。"]],"id":592},{"a":"government","s":"planned","k":"法案・制度","f":"年金","t":"労働者災害補償保険法改正法を成立・施行","m":"遺族補償年金に係る夫婦の年齢要件の差を解消する改正法が成立し、令和九年四月一日に施行される予定である。","d":"2027-04-01","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第3号（環境省大臣官房環境保健部長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00320261030/5","2026-10-30","国会会議録","さきの特別国会において、遺族補償年金に係る夫婦の年齢要件の差を解消する労働者災害補償保険法の改正法が成立し、令和九年四月一日に施行される予定でございます。"]],"id":728},{"a":"government","s":"planned","k":"政策の実施","f":"雇用・労働","t":"教師の処遇改善に向けた計画的施策の実施","m":"令和七年に給特法を改正し、教職調整額の率を令和十二年度までに10％まで順次引き上げる。管理職の本給改善や学級担任への手当加算など、全般的な処遇改善を計画的に進める。","d":"2027-04-01","e":"2030-03-31","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/176","2026-10-28","国会会議録","令和七年に給特法を改正し、教職調整額の率を令和十二年度までに一〇％まで順次引き上げますとともに、管理職の本給の改善、学級担任への手当の加算などを行うなど、全般的な教師の処遇改善を計画的に進めているところでございまして"]],"id":796},{"a":"government","s":"planned","k":"予算・税制","f":"子育て・教育","t":"令和9年度の教育支援体制強化に必要な経費を計上","m":"令和9年度の概算要求において、教育支援センターのアウトリーチ支援体制強化、保護者への相談支援体制強化、スクールカウンセラー等の配置充実に必要な経費を計上している。","d":"2027-04-01","e":"2028-03-31","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/154","2026-10-27","国会会議録","令和九年度の概算要求におきましては、教育支援センターにおけるアウトリーチ支援体制の強化、また、不登校児童生徒の保護者への相談支援体制の強化、また、スクールカウンセラーやスクールソーシャルワーカーの配置充実等について必要な経費を計上をいたしているところでございます。"]],"id":1158},{"a":"government","s":"planned","k":"政策の実施","f":"雇用・労働","t":"働き方改革と処遇改善の施策を実施","m":"働き方改革や処遇の改善を学校で一体的に進め、教師が心身共に健康であり、誇りを持って働き続けられるよう、令和九年度の概算要求で上げた項目を確保し実施していく。","d":"2027-04-01","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/125","2026-10-27","国会会議録","令和九年度の概算要求で上げております項目、これをしっかりと確保してまいりまして、各項目が実施できていきますようにしっかりと進めてまいりたいと思います。"]],"id":1180},{"a":"government","s":"planned","k":"予算・税制","f":"子育て・教育","t":"部活動指導員配置のための予算措置を実施","m":"教師に代わって部活動の指導や大会引率を担う部活動指導員を全国の学校に配置するため、令和八年度に予算措置を行う。","d":"2027-04-01","e":"","r":"government","n":1,"src":[["参議院 文教科学委員会 第2号（スポーツ庁次長の発言）","https://kokkai.ndl.go.jp/txt/122215104X00220261027/111","2026-10-27","国会会議録","令和八年度は全国の学校に一万七千人超の配置がなされるよう予算措置をしているところでございまして"]],"id":1192},{"a":"government","s":"planned","k":"閣議決定・計画","f":"環境・エネルギー","t":"地上設置型事業用太陽光の支援対象外化方針決定","m":"経済産業省の検証結果に基づき、地上設置型事業用太陽光について2027年度以降、支援の対象外とする方針を決定した。","d":"2027-04-01","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第2号（資源エネルギー庁省エネルギー・新エネルギー部長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00220261027/114","2026-10-27","国会会議録","地上設置型事業用太陽光については、二〇二七年度以降、支援の対象外とする方針を決定いたしました。"]],"id":1310},{"a":"government","s":"planned","k":"予算・税制","f":"福祉","t":"更生保護委託費をさらに充実させる概算要求を計上","m":"来年度（令和九年度）概算要求において、更生保護委託費を本年度比約五億五千万円増となる六十一億四千五百万円計上する。","d":"2027-04-01","e":"2028-03-31","r":"government","n":1,"src":[["参議院 法務委員会 第2号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00220261027/10","2026-10-27","国会会議録","来年度、令和九年度概算要求においても更なる充実を図るため、更生保護委託費として本年度比約五億五千万円増となる六十一億四千五百万円を計上しているところであります。"]],"id":1447},{"a":"government","s":"done","k":"提言・要望","f":"財政・税制","t":"国債に関する税制検討の要望を提出","m":"金融庁と財務省の連名で、国債に関する税制の検討を求める事項要望を提出した。","d":"2027-04-01" <script>
(function(){

const ACT = {}; DATA.actors.forEach(a => ACT[a.id] = a);
const PAGE = 50;

// ---- 保存領域 (使えないときは画面の中だけで覚える) ----
const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ mem[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

// ---- 出来事の下ごしらえ ----
const EV = DATA.events.map(e => {
  const srcDate = (e.src[0] && e.src[0][2]) || '';

    late: e.s === 'planned' && lastDay && endOf(lastDay) < TODAY,
    ahead: e.s === 'done' && !!e.d && e.d > TODAY,
    text: [e.t, e.m, e.k, e.f, ACT[e.a] && ACT[e.a].label, ...e.src.map(s => s[4] + ' ' + s[0])].join(' ').toLowerCase()
  });
});
const BYID = {}; EV.forEach(e => BYID[e.id] = e);
function endOf(d){ return d.length === 4 ? d + '-12-31' : d.length === 7 ? d + '-31' : d; }

function fmtDate(d){
  if(!d) return '';
  const p = d.split('-');
  return p[0] + '年' + (p[1] ? +p[1] + '月' : '') + (p[2] ? +p[2] + '日' : '');
}
function whenText(e){
  if(e.s === 'planned' && !e.d) return '時期の記載なし';
  let t = fmtDate(e.date);
  if(e.e && e.e !== e.d) t += ' 〜 ' + fmtDate(e.e);
  if(e.dateFromSrc) t = '資料の日付 ' + t;
  return t;
}

// ---- 状態 ----
const DEF = {status:'done', actors:[], field:'', q:'', cfield:''};
const prefs = Object.assign({}, DEF, store.get('pt.prefs', {}));
let tab = 'list';
let saved = store.get('pt.saved', null);
if(saved === null){
  // 初めて開いたときだけ、例を入れる (9. 例のデータ)
  saved = [
    {id:1120, memo:'年末までに策定するとの答弁。年明けに出たか確かめる', at:Date.now(), ex:true},
    {id:343,  memo:'参院でどうなったか、次に見る', at:Date.now(), ex:true},
    {id:1476, memo:'与党の法案と並べて比べる', at:Date.now(), ex:true}
  ].filter(s => BYID[s.id]);
  store.set('pt.saved', saved);
}
const savePrefs = () => store.set('pt.prefs', prefs);
const saveSaved = () => store.set('pt.saved', saved);
const isSaved = id => saved.some(s => s.id === id);

// ---- 上の部品 ----
$('#asof').textContent = DATA.built.replace(/-/g,'/') + ' 時点の資料';
$('#about').innerHTML = `省庁・政党の公開資料と国会会議録（${esc(fmtDate(DATA.built))}までに収集）から取り出した出来事 ${EV.length.toLocaleString()} 件を載せています。題名と要約は AI が資料から取り出したもので、誤りがありえます。詳細の「根拠の原文」と出典で確かめてください。国会議員個人の発言（党の立場として扱わないもの）と、発言者の氏名は載せていません。与党・野党は出来事の時点の立場です。`;

function fieldOptions(sel, label){
  const counts = {};
  EV.forEach(e => { if(e.f) counts[e.f] = (counts[e.f]||0) + 1; });
  sel.innerHTML = `<option value="">${label}</option>` +
    DATA.fields.filter(f => counts[f]).map(f => `<option value="${esc(f)}">${esc(f)}（${counts[f]}）</option>`).join('');
}
fieldOptions($('#field'), 'すべての分野');
fieldOptions($('#cfield'), 'すべての分野');

function drawChips(){
  const n = {}; EV.forEach(e => n[e.a] = (n[e.a]||0) + 1);
  const all = prefs.actors.length === 0;
  $('#chips').innerHTML = `<button class="chip" data-a="" aria-pressed="${all}">すべて</button>` +
    DATA.actors.map(a => `<button class="chip" data-a="${a.id}" aria-pressed="${prefs.actors.includes(a.id)}">
      <span class="dot" style="background:${a.color}"></span>${esc(a.label)}<span class="n">${n[a.id]||0}</span></button>`).join('');
}

// ---- 一覧 ----
let shown = PAGE, current = [];
function filtered(){
  const q = prefs.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return EV.filter(e => e.s === prefs.status
    && (!prefs.actors.length || prefs.actors.includes(e.a))
    && (!prefs.field || e.f === prefs.field)
    && q.every(w => e.text.includes(w)));
}
function sortList(list){
  const s = prefs.status;
  if(s === 'planned'){
    // 近い予定から。時期の記載がないもの、時期を過ぎたものは後ろにまとめる
    const g = e => !e.date ? 1 : e.late ? 2 : 0;
    return list.sort((a,b) => g(a)-g(b) || (g(a) === 2 ? cmp(b.date,a.date) : cmp(a.date,b.date)));
  }
  const g = e => !e.date ? 1 : e.ahead ? 2 : 0;
  return list.sort((a,b) => g(a)-g(b) || cmp(b.date,a.date));
}
const cmp = (a,b) => a < b ? -1 : a > b ? 1 : 0;

function groupOf(e){
  if(prefs.status === 'planned'){
    if(!e.date) return '時期の記載がない予定';
    if(e.late) return '時期を過ぎた予定（実施されたかは未確認）';
  }
  if(!e.date) return '時期の記載なし';
  if(e.ahead) return '実施済みだが、今日より先の時期が書かれたもの（要確認）';
  const [y,m] = e.date.split('-');
  return m ? `${y}年${+m}月` : `${y}年（月の記載なし）`;
}

function cardHTML(e){
  const a = ACT[e.a] || {label:e.a,color:'#999'};
  return `<button class="card" data-id="${e.id}" style="--c:${a.color}">
    <div class="who"><span class="name">${esc(a.label)}</span><span>${ROLE[e.r]||''}</span><span>${esc(e.f||'')}</span></div>
    <h3>${esc(e.t)}</h3>
    <div class="when"><span class="st ${e.s}"><i>${ST[e.s].g}</i>${ST[e.s].l}</span>　${esc(whenText(e))}${e.late?'<span class="late">時期を過ぎた</span>':''}</div>
    ${isSaved(e.id)?'<span class="saved-mark">保存済み</span>':''}
  </button>`;
}

function drawList(reset){
  if(reset){ shown = PAGE; current = sortList(filtered()); }
  const active = prefs.actors.length || prefs.field || prefs.q.trim();
  $('#count').innerHTML = `<b>${current.length.toLocaleString()}</b>件`;
  $('#reset').hidden = !active;
  if(!current.length){
    $('#list').innerHTML = `<div class="empty"><strong>当てはまる出来事がありません</strong>主体や分野をゆるめるか、別のことばで探してみてください。${active?'<br><button class="btn" data-act="reset">条件を外す</button>':''}</div>`;
    return;
  }
  let html = '', last = null, todayShown = prefs.status !== 'planned';
  current.slice(0, shown).forEach(e => {
    if(prefs.status === 'planned' && !todayShown && e.date && !e.late){ html += `<div class="today">今日 ${fmtDate(TODAY)}・ここから先の予定（期間が今日にかかるものを含む）</div>`; todayShown = true; }
    const g = groupOf(e);
    if(g !== last){ html += `<div class="month">${esc(g)}</div>`; last = g; }
    html += cardHTML(e);
  });
  if(current.length > shown) html += `<button class="more" id="more">さらに表示（残り ${(current.length-shown).toLocaleString()} 件）</button>`;
  $('#list').innerHTML = html;
  const more = $('#more');
  if(more && 'IntersectionObserver' in window){
    const io = new IntersectionObserver(es => { if(es[0].isIntersecting){ io.disconnect(); shown += PAGE; drawList(false); } }, {rootMargin:'400px'});
    io.observe(more);
  }
}

function drawSeg(){
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.st === prefs.status));
}
function refresh(){ drawSeg(); drawChips(); $('#field').value = prefs.field; $('#q').value = prefs.q; drawList(true); savePrefs(); }

// ---- 比べる ----
function drawCmp(){
  const f = prefs.cfield;
  const rows = DATA.actors.map(a => {
    const c = {done:0, ongoing:0, planned:0};
    EV.forEach(e => { if(e.a === a.id && (!f || e.f === f)) c[e.s]++; });
    return {a, c, tot:c.done+c.ongoing+c.planned};
  });
  const cell = (a,s,n) => `<td><button data-ca="${a}" data-cs="${s}" ${n?'':'disabled'} aria-label="${esc(ACT[a].label)} ${ST[s].l} ${n}件">${n}</button></td>`;
  $('#cmp').innerHTML = `<thead><tr><th>主体</th><th>● 実施</th><th>◐ 進行中</th><th>○ 予定</th><th>計</th></tr></thead><tbody>` +
    rows.map(r => `<tr style="--c:${r.a.color}"><td>${esc(r.a.label)}<small>${ROLE[r.a.role]||''}</small></td>
      ${cell(r.a.id,'done',r.c.done)}${cell(r.a.id,'ongoing',r.c.ongoing)}${cell(r.a.id,'planned',r.c.planned)}
      <td class="tot">${r.tot}</td></tr>`).join('') + '</tbody>';
}

// ---- 保存 ----
function drawSaved(){
  const list = saved.filter(s => BYID[s.id]);
  $('#scount').innerHTML = list.length ? `<b>${list.length}</b>件` : '';
  $('#clearEx').hidden = !list.some(s => s.ex);
  const b = $('#badge'); b.hidden = !list.length; b.textContent = list.length;
  if(!list.length){
    $('#saved').innerHTML = `<div class="empty"><strong>まだ保存した出来事はありません</strong>一覧で気になる出来事を開き、下の「保存する」を押すと、ここにメモと一緒に並びます。<br><button class="btn" data-tabgo="list">一覧を見る</button></div>`;
    return;
  }
  $('#saved').innerHTML = list.map(s => {
    const e = BYID[s.id], a = ACT[e.a];
    return `<div class="sv" style="--c:${a.color}" data-sid="${e.id}">
      <div class="who" style="font-size:12px;color:var(--sub);font-weight:600"><b style="color:var(--ink)">${esc(a.label)}</b>　<span class="st ${e.s}"><i>${ST[e.s].g}</i>${ST[e.s].l}</span>　${esc(whenText(e))}${e.late?'<span class="late">時期を過ぎた</span>':''}${s.ex?'<span class="ex">例</span>':''}</div>
      <h3>${esc(e.t)}</h3>
      <textarea data-memo="${e.id}" placeholder="メモ（例：次に確かめること）" aria-label="メモ">${esc(s.memo)}</textarea>
      <div class="svbtns"><button class="btn" data-open="${e.id}">詳細</button><button class="btn ghost" data-unsave="${e.id}">保存を外す</button><span class="saved-at" data-at="${e.id}"></span></div>
    </div>`;
  }).join('');
}

// ---- 詳細 ----
let openId = null, lastFocus = null;
function openSheet(id){
  const e = BYID[id]; if(!e) return;
  openId = id; lastFocus = document.activeElement;
  const a = ACT[e.a];
  const srcs = e.src.map((s,i) => `<div class="src">
      <div class="t">${esc(s[0]||'（題名なし）')}</div>
      <div class="s">${esc(s[3])}${s[2]?'・'+esc(fmtDate(s[2])):''}</div>
      ${i>0?`<blockquote>${esc(s[4])}</blockquote>`:''}
      <a href="${esc(s[1])}" target="_blank" rel="noopener noreferrer">原文を開く ↗</a>
    </div>`).join('');
  $('#d-body').innerHTML = `
    <div class="d-who"><span class="name"><i style="background:${a.color}"></i>${esc(a.name)}</span><span>${ROLE[e.r]||''}</span><span>${esc(e.f||'')}</span><span>${esc(e.k)}</span></div>
    <h2 id="d-title">${esc(e.t)}</h2>
    <div class="d-when"><span class="st ${e.s}"><i>${ST[e.s].g}</i>${ST[e.s].l}</span>　${esc(whenText(e))}${e.late?'<span class="late">時期を過ぎた（実施は未確認）</span>':''}</div>
    <p class="d-sum">${esc(e.m)}</p>
    <div class="lab">根拠の原文</div>
    <blockquote>${esc(e.src[0] ? e.src[0][4] : '')}</blockquote>
    <div class="lab">出典${e.n>1?`（同じ出来事が載った資料 ${e.n} 件${e.n>3?'のうち新しい3件':''}）`:''}</div>
    ${srcs}
    <p class="warn">題名・要約・時期は AI が資料から取り出したものです。正しいかは原文で確かめてください。</p>`;
  drawSaveBtn();
  $('#d-body').scrollTop = 0;
  $('#backdrop').classList.add('on'); $('#sheet').classList.add('on');
  document.body.style.overflow = 'hidden';
  setTimeout(() => $('#close').focus({preventScroll:true}), 50);
}
function closeSheet(){
  $('#backdrop').classList.remove('on'); $('#sheet').classList.remove('on');
  document.body.style.overflow = ''; openId = null;
  if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
}
function drawSaveBtn(){
  const on = isSaved(openId), b = $('#d-save');
  b.textContent = on ? '保存済み（外す）' : '保存する';
  b.classList.toggle('on', on);
}

// ---- 小さな反応 ----
let tt;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1600); }
function bump(){ const b = $('#badge'); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }

function toggleSave(id){
  if(isSaved(id)){ saved = saved.filter(s => s.id !== id); toast('保存を外しました'); }
  else { saved.unshift({id, memo:'', at:Date.now()}); toast('保存しました'); }
  saveSaved(); drawSaved(); bump();
}

function setTab(t){
  tab = t;
  document.querySelectorAll('nav.tabs button').forEach(b => { if(b.dataset.tab === t) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  $('#v-list').classList.toggle('on', t === 'list');
  $('#v-cmp').classList.toggle('on', t === 'cmp');
  $('#v-saved').classList.toggle('on', t === 'saved');
  if(t === 'cmp'){ $('#cfield').value = prefs.cfield; drawCmp(); }
  if(t === 'saved') drawSaved();
  if(t === 'list') drawList(true);
  window.scrollTo(0,0);
}

// ---- 操作 ----
document.querySelector('.seg').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if(!b) return;
  prefs.status = b.dataset.st; refresh(); window.scrollTo(0,0);
});
$('#chips').addEventListener('click', ev => {
  const b = ev.target.closest('.chip'); if(!b) return;
  const id = b.dataset.a;
  if(!id) prefs.actors = [];
  else prefs.actors = prefs.actors.includes(id) ? prefs.actors.filter(x => x !== id) : [...prefs.actors, id];
  refresh();
});
$('#field').addEventListener('change', ev => { prefs.field = ev.target.value; refresh(); });
let qt;
$('#q').addEventListener('input', ev => { clearTimeout(qt); qt = setTimeout(() => { prefs.q = ev.target.value; drawList(true); savePrefs(); }, 150); });
$('#q').addEventListener('keydown', ev => { if(ev.key === 'Enter') ev.target.blur(); });
function resetFilters(){ prefs.actors = []; prefs.field = ''; prefs.q = ''; refresh(); toast('条件を外しました'); }
$('#reset').addEventListener('click', resetFilters);
$('#list').addEventListener('click', ev => {
  if(ev.target.closest('[data-act=reset]')) return resetFilters();
  const m = ev.target.closest('#more'); if(m){ shown += PAGE; drawList(false); return; }
  const c = ev.target.closest('.card'); if(c) openSheet(+c.dataset.id);
});
$('#cfield').addEventListener('change', ev => { prefs.cfield = ev.target.value; savePrefs(); drawCmp(); });
$('#cmp').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-ca]'); if(!b || b.disabled) return;
  prefs.actors = [b.dataset.ca]; prefs.status = b.dataset.cs; prefs.field = prefs.cfield; prefs.q = '';
  refresh(); setTab('list');
});
$('#saved').addEventListener('click', ev => {
  const o = ev.target.closest('[data-open]'); if(o) return openSheet(+o.dataset.open);
  const u = ev.target.closest('[data-unsave]'); if(u) return toggleSave(+u.dataset.unsave);
  const g = ev.target.closest('[data-tabgo]'); if(g) return setTab(g.dataset.tabgo);
});
const memoTimers = {};
$('#saved').addEventListener('input', ev => {
  const id = +ev.target.dataset.memo; if(!id) return;
  const s = saved.find(x => x.id === id); if(!s) return;
  s.memo = ev.target.value;
  clearTimeout(memoTimers[id]);
  memoTimers[id] = setTimeout(() => {
    saveSaved();
    const at = document.querySelector(`[data-at="${id}"]`);
    if(at){ at.textContent = 'メモを保存しました'; at.classList.add('flash'); setTimeout(() => at.classList.remove('flash'), 800); }
  }, 400);
});
$('#clearEx').addEventListener('click', () => { saved = saved.filter(s => !s.ex); saveSaved(); drawSaved(); toast('例を消しました'); });
document.querySelector('nav.tabs').addEventListener('click', ev => { const b = ev.target.closest('button'); if(b) setTab(b.dataset.tab); });
$('#d-save').addEventListener('click', () => { if(openId != null){ toggleSave(openId); drawSaveBtn(); if(tab === 'list') drawList(false); } });
$('#close').addEventListener('click', closeSheet);
$('#backdrop').addEventListener('click', closeSheet);
document.addEventListener('keydown', ev => { if(ev.key === 'Escape' && openId != null) closeSheet(); });

refresh();
drawSaved();
})();
</script>
</body>
</html>
