<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>政治の動きタイムライン</title>
<meta name="description" content="政府と各党のこれまで・いま・これからを、一次資料の原文と出典つきで見比べる（試験公開版）">
<style>
:root{
  --paper:#f5f3ee; --card:#ffffff; --ink:#1b2430; --sub:#5d6672; --line:#e2ded5;
  --accent:#b8432c; --accent-soft:#f6e6e1; --navy:#24324a;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  font-size:15px;line-height:1.7;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;white-space:nowrap;-webkit-user-select:none;user-select:none}
a{color:var(--navy)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* 上の帯 */
header.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:10px}
h1{font-size:17px;font-weight:800;margin:0;letter-spacing:.02em}
.asof{font-size:12px;color:var(--sub);white-space:nowrap}

main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
section.view{display:none;padding-top:16px}
section.view.on{display:block;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 切り替え */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#e9e5dc;border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;min-height:44px;border-radius:9px;font-weight:700;font-size:15px;color:var(--sub);transition:background .15s,color .15s,transform .1s}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:active{transform:scale(.97)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;margin:0 -16px;scrollbar-width:none;scroll-padding:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:14px;font-weight:600;transition:background .15s,border-color .15s,transform .1s}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip .n{color:var(--sub);font-weight:500;font-size:12px}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[aria-pressed=true] .n{color:#c9d2e0}
.chip:active{transform:scale(.96)}

.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px;margin-top:10px}
.field,.search{position:relative}
select,input[type=search]{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;font-size:16px}
select{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
input[type=search]{-webkit-appearance:none}
select:focus,input:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:1px}

.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 6px;min-height:36px}
.count{font-size:14px;color:var(--sub)}
.count b{font-size:20px;color:var(--ink);margin-right:2px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;min-height:40px;padding:0 4px}
.legend{font-size:12px;color:var(--sub);margin:0 0 8px;display:flex;flex-wrap:wrap;gap:4px 14px}

/* 一覧 */
.month{position:sticky;top:51px;z-index:5;background:var(--paper);font-size:13px;font-weight:800;color:var(--sub);letter-spacing:.06em;padding:18px 0 8px}
.today{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:12px;font-weight:800;margin:14px 0 2px}
.today::after{content:"";flex:1;height:2px;background:var(--accent)}
.card{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:var(--r);padding:14px 16px 14px 18px;margin:0 0 10px;position:relative;box-shadow:0 1px 0 var(--line);white-space:normal;transition:transform .1s,box-shadow .15s}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 3px 3px 0;background:var(--c,#999)}
.card:active{transform:scale(.985);box-shadow:0 0 0 2px var(--line)}
.card .who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);font-weight:600}
.card .who .name{color:var(--ink);font-weight:800}
.card h3{font-size:16px;line-height:1.55;margin:4px 0 4px;font-weight:700}
.card .when{font-size:12px;color:var(--sub)}
.st{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;white-space:nowrap}
.st i{font-style:normal;font-size:13px}
.st.done{color:var(--ink)} .st.ongoing{color:var(--navy)} .st.planned{color:var(--accent)}
.late{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 6px;margin-left:6px;line-height:1.6}
.saved-mark{position:absolute;right:14px;top:12px;font-size:11px;font-weight:800;color:var(--accent)}
.more{display:block;width:100%;min-height:48px;margin:6px 0 20px;border:1px dashed var(--line);background:transparent;border-radius:12px;color:var(--sub);font-weight:700}

.empty{text-align:center;padding:48px 16px;color:var(--sub)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty button{margin-top:14px}

.note{font-size:12px;color:var(--sub);line-height:1.8;margin:24px 0 8px;padding-top:16px;border-top:1px solid var(--line)}

/* 比べる */
.lead{font-size:14px;color:var(--sub);margin:0 0 12px}
table.cmp{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:8px;table-layout:fixed}
.cmp th{white-space:nowrap;font-size:12px;color:var(--sub);font-weight:700;text-align:center;padding:0 2px 2px}
.cmp th:first-child{text-align:left;width:31%}
.cmp td{background:var(--card);text-align:center;padding:0}
.cmp td:first-child{text-align:left;padding:0 6px 0 12px;border-radius:12px 0 0 12px;font-weight:800;font-size:14px;position:relative}
.cmp td:first-child::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--c)}
.cmp td:first-child small{display:block;font-size:11px;color:var(--sub);font-weight:600;line-height:1.3}
.cmp td:last-child{border-radius:0 12px 12px 0}
.cmp button{width:100%;min-height:52px;border:0;background:transparent;font-size:17px;font-weight:800;border-radius:10px;transition:background .15s,transform .1s}
.cmp button:active{background:var(--accent-soft);transform:scale(.95)}
.cmp button:disabled{color:#c4beb2;font-weight:500;cursor:default}
.cmp .tot{color:var(--sub);font-weight:600;font-size:14px}

/* 保存 */
.sv{background:var(--card);border-radius:var(--r);padding:14px 16px 12px 18px;margin-bottom:12px;position:relative;box-shadow:0 1px 0 var(--line)}
.sv::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 3px 3px 0;background:var(--c)}
.sv h3{font-size:16px;margin:4px 0 2px;line-height:1.55}
.ex{display:inline-block;font-size:11px;font-weight:800;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 6px;margin-left:6px;line-height:1.7}
textarea{width:100%;min-height:68px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.6;resize:vertical;background:#fcfbf8;margin-top:10px}
.svbtns{display:flex;gap:8px;margin-top:8px;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;transition:background .15s,transform .1s,color .15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary.on{background:var(--card);color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.saved-at{font-size:12px;color:var(--sub);margin-left:auto;transition:color .3s}
.saved-at.flash{color:var(--accent)}

/* 下のタブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);padding:0 8px}
nav.tabs button{border:0;background:transparent;min-height:60px;font-size:13px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;transition:color .15s}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;transition:transform .15s}
nav.tabs button[aria-current=page]{color:var(--accent)}
nav.tabs button[aria-current=page]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs button:active svg{transform:scale(.88)}
.badge{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;padding:0 5px}
.badge.pop{animation:pop .3s ease-out}
@keyframes pop{50%{transform:scale(1.35)}}

/* 詳細 (下からせり上がる) */
.backdrop{position:fixed;inset:0;background:rgba(20,26,36,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:720px;margin:0 auto;background:var(--paper);border-radius:20px 20px 0 0;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab{flex:none;display:flex;justify-content:space-between;align-items:center;padding:8px 8px 4px 20px;background:var(--paper);border-radius:20px 20px 0 0}
.sheet .grab span{font-size:12px;color:var(--sub);font-weight:700}
.sheet .body{overflow-y:auto;padding:4px 20px 20px;overscroll-behavior:contain}
.sheet .foot{flex:none;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px}
.sheet .foot .btn{flex:1;min-height:50px;font-size:15px}
.close{border:0;background:transparent;min-width:48px;min-height:48px;font-size:26px;line-height:1;color:var(--sub);border-radius:12px}
.close:active{background:#e9e5dc}
.d-who{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;font-weight:700;color:var(--sub)}
.d-who .name{color:var(--ink);font-weight:800;display:inline-flex;align-items:center;gap:6px}
.d-who .name i{width:10px;height:10px;border-radius:50%;display:inline-block}
.sheet h2{font-size:21px;line-height:1.5;margin:8px 0 6px;font-weight:800}
.d-when{font-size:14px;color:var(--sub);margin-bottom:14px}
.d-sum{font-size:16px;line-height:1.85;margin:0 0 20px}
.lab{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.06em;margin:22px 0 8px}
blockquote{margin:0;background:var(--card);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 14px;font-size:15px;line-height:1.85}
.src{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:13px}
.src .t{font-weight:700;color:var(--ink);font-size:14px;line-height:1.5}
.src .s{color:var(--sub);margin:2px 0 6px}
.src a{display:inline-flex;align-items:center;min-height:40px;font-weight:700;color:var(--navy);text-decoration:none;border-bottom:1px solid currentColor;line-height:1.3}
.src blockquote{margin-top:8px;font-size:14px;background:#fcfbf8}
.warn{font-size:12px;color:var(--sub);background:#ece8df;border-radius:10px;padding:10px 12px;margin-top:18px;line-height:1.7}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:10px 18px;border-radius:999px;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (min-width:640px){
  h1{font-size:19px}
  .card h3{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>政治の動きタイムライン</h1>
  <span class="asof" id="asof"></span>
</div></header>

<main class="wrap">
  <!-- 一覧 -->
  <section class="view on" id="v-list" aria-label="一覧">
    <div class="seg" role="group" aria-label="時期">
      <button data-st="done">これまで</button>
      <button data-st="ongoing">進行中</button>
      <button data-st="planned">これから</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="主体"></div>
    <div class="row2">
      <div class="field"><select id="field" aria-label="分野"></select></div>
      <div class="search"><input type="search" id="q" placeholder="ことばで探す（例：消費税）" enterkeyhint="search" aria-label="ことばで探す"></div>
    </div>
    <div class="meta">
      <div class="count" id="count"></div>
      <button class="linkbtn" id="reset" hidden>条件を外す</button>
    </div>
    <div class="legend"><span>● 実施済み</span><span>◐ 進行中</span><span>○ 予定・目標</span><span>左の色＝主体</span></div>
    <div id="list"></div>
    <p class="note" id="about"></p>
  </section>

  <!-- 比べる -->
  <section class="view" id="v-cmp" aria-label="比べる">
    <p class="lead">分野を選ぶと、政府と各党の出来事の数を並べます。数字を押すと、その一覧を開きます。</p>
    <select id="cfield" aria-label="比べる分野"></select>
    <table class="cmp" id="cmp"></table>
  </section>

  <!-- 保存 -->
  <section class="view" id="v-saved" aria-label="保存">
    <div class="meta" style="margin-top:0">
      <div class="count" id="scount"></div>
      <button class="linkbtn" id="clearEx" hidden>例を消す</button>
    </div>
    <div id="saved"></div>
  </section>
</main>

<nav class="tabs" aria-label="画面"><div class="wrap">
  <button data-tab="list" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>一覧</button>
  <button data-tab="cmp"><svg viewBox="0 0 24 24"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>比べる</button>
  <button data-tab="saved"><svg viewBox="0 0 24 24"><path d="M7 3h10v18l-5-4-5 4z"/></svg>保存<span class="badge" id="badge" hidden></span></button>
</div></nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="d-title">
  <div class="grab"><span>出来事の詳細</span><button class="close" id="close" aria-label="閉じる">×</button></div>
  <div class="body" id="d-body"></div>
  <div class="foot"><button class="btn primary" id="d-save">保存する</button></div>
</div>

は、水辺・海辺について、これまでの「保全」に加え、「活用」の観点も重視し、地域とともに良好な環境を「守り・活かす」取組を進めています。"]],"id":420},{"a":"government","s":"ongoing","k":"法案・制度","f":"環境・エネルギー","t":"JCMクレジットの国際利用に関する調整を適用","m":"各政府は、自身が認可したJCMクレジットを他の国際的な緩和目的に使用する際、相応の調整を適用する。","d":"","e":"","r":"government","n":1,"src":[["日・インド間の二国間クレジット制度（JCM）の詳細規則[PDF 2.1MB]","https://www.env.go.jp/content/000440332.pdf","2026-11-09","環境省","b. Each government applies corresponding adjustments for the JCM credits that are authorized by it for use toward other international mitigation purposes."]],"id":422},{"a":"government","s":"ongoing","k":"会議・協議","f":"環境・エネルギー","t":"気候変動リスク産官学連携ネットワークの活動を継続","m":"気候変動リスク情報へのニーズ共有、情報基盤の充実、気候変動に関連するリスクや機会に関する情報の適切な活用の促進を目的として、産官学が連携して活動している。","d":"","e":"","r":"government","n":3,"src":[["気候変動リスク産官学連携ネットワーク公開シンポジウム～気候関連開示からレジリエンス強化への実践～の開催について公表しました。","https://www.fsa.go.jp/news/r8/sonota/20261109.html","2026-11-09","金融庁","気候変動リスク産官学連携ネットワークは、主に気候変動やその影響の予測、気候関連情報開示支援などのコンサルティングサービスを行う企業、行政機関、研究機関の意見交換・協働の場として設立されました。"],["気候変動リスク産官学連携ネットワーク公開シンポジウム～気候関連開示からレジリエンス強化への実践～の開催について公表しました。","https://www.fsa.go.jp/news/r8/sonota/20261109.html","2026-11-09","金融庁","金融庁は、環境省、文部科学省、国土交通省、及び国立環境研究所と連携して、気候変動リスクに対する企業のレジリエンス強化に向けた取組やその課題について、広く知っていただくことを目的に「気候変動リスク産官学連携ネットワーク公開シンポジウム」を開催します。"],["気候変動リスク産官学連携ネットワーク公開シンポジウム開催について　～気候関連開示からレジリエンス強化への実践～","https://www.env.go.jp/press/press_05782.html","2026-11-09","環境省","その一環として、今年度も「気候変動リスク産官学連携ネットワーク公開シンポジウム」をオンライン会議方式にて開催します。"]],"id":434},{"a":"government","s":"ongoing","k":"政策の実施","f":"住宅・都市","t":"不適切な民泊事業者への出入国在留管理を実施","m":"不適切な民泊事業者に対し、関係行政機関との連携を通じて適切な出入国在留管理を実施する方策を協議している。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（内閣官房外国人との秩序ある共生社会推進室室長代理／出入国在留管理庁次長の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/136","2026-11-05","国会会議録","例えば、不適切な民泊事業者に対し適切な出入国在留管理を実施する観点からも、関係行政機関との連携に向けて具体的な方策の協議を行っているところでございます。"]],"id":503},{"a":"government","s":"ongoing","k":"会議・協議","f":"行政・デジタル","t":"関係行政機関との情報連携構築を検討","m":"総合的対応策を踏まえ、国交省など関係行政機関との情報連携の構築について引き続き適切に検討していく。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（内閣官房外国人との秩序ある共生社会推進室室長代理／出入国在留管理庁次長の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/136","2026-11-05","国会会議録","出入国在留管理庁としましては、総合的対応策を踏まえまして、国交省とどまらず、関係行政機関との情報連携の構築についても引き続き適切に検討してまいりたい、このように考えております。"]],"id":504},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"困難な女性への相談窓口での支援を実施","m":"困難な問題を抱える女性への支援に関する法律に基づき、女性相談支援センター等の相談窓口において、個々の状況と本人の希望に応じた様々な支援を行っている。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（厚生労働省大臣官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/116","2026-11-05","国会会議録","この法律に基づきまして、様々な課題を抱える女性を支援するために、例えば女性相談支援センター等の相談窓口において個々の状況と御本人の希望に応じた様々な支援というものを行ってございますし"]],"id":505},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"困難な女性への支援事業を実施し国庫補助を行う","m":"公的機関と民間団体が連携し、アウトリーチ、相談対応、居場所の確保、地域での自立支援、定着まで切れ目なく支援を行う事業に対し国庫補助を実施している。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（厚生労働省大臣官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/116","2026-11-05","国会会議録","公的機関と民間団体が密接に連携して、アウトリーチから相談対応、居場所の確保、地域での自立支援、定着まで切れ目なく支援を行うというこういう事業につきまして国庫補助を行うといった対応も行ってございます。"]],"id":506},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"福祉","t":"法律の附則の検討規定に基づく検討を実施","m":"厚生労働省は、困難な問題を抱える女性への支援に関する法律の附則の検討規定に基づき、施行後3年の検討を実施している。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（厚生労働省大臣官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/116","2026-11-05","国会会議録","厚生労働省では、現在、法律の附則の検討規定に基づきまして、施行後三年の検討というものを実施をしているところでございます。"]],"id":507},{"a":"government","s":"ongoing","k":"政策の実施","f":"雇用・労働","t":"育成就労制度の運用開始に向けた準備を進める","m":"関係省庁と連携しながら、MOCの早期作成を含め、育成就労制度の運用開始に向けた準備を着実に進めていく。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（内閣官房外国人との秩序ある共生社会推進室室長代理／出入国在留管理庁次長の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/105","2026-11-05","国会会議録","出入国在留管理庁としましては、引き続き、関係省庁と連携しながら、ＭＯＣの早期作成を含め、制度運用開始に向けた準備を着実に進めてまいりたい、このように考えております。"]],"id":509},{"a":"government","s":"planned","k":"政策の実施","f":"雇用・労働","t":"不適切な監理団体への許可取消しなど厳正な対処","m":"監理費を含め不適切な費用の徴収が認められる監理団体に対し、許可の取消しなど厳正に対処する方針である。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/99","2026-11-05","国会会議録","その上で、監理費を含め不適切な費用の徴収が認められる監理団体に対しては監理団体の許可の取消しを行うなど、厳正に対処することとしております。"]],"id":511},{"a":"government","s":"ongoing","k":"その他","f":"行政・デジタル","t":"個票データの二次的利用への対応","m":"確定数の公表後、行政機関等による個票データの二次的利用が可能であり、求めがあれば必要な対応を行う方針である。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（厚生労働省大臣官房統計・政策立案総括審議官の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/86","2026-11-05","国会会議録","確定数の公表後におきましては、行政機関等におきまして個票データの二次的利用も可能となっております。お求めがありました際には必要な対応を行ってまいりたいというふうに考えております。"]],"id":513},{"a":"government","s":"ongoing","k":"その他","f":"行政・デジタル","t":"人口動態統計の集計・公表","m":"統計法に基づく調査計画に基づき、人口動態統計を集計し公表している。離婚後の親権に関するデータは、年に一度取りまとめた確定数で集計し、調査年の翌年9月頃に公表している。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（厚生労働省大臣官房統計・政策立案総括審議官の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/82","2026-11-05","国会会議録","厚生労働省の人口動態統計につきましては、統計法に基づく調査計画に基づき集計、公表を行っておりまして、離婚後の親権に関しましては、主に年に一度取りまとめております確定数において集計を行いまして、調査年の翌年九月頃に公表しております。"]],"id":515},{"a":"government","s":"ongoing","k":"その他","f":"行政・デジタル","t":"人口動態統計の個票データ二次利用への対応","m":"確定数の公表後、行政機関等において統計法に基づく手続により人口動態統計の個票データの二次的利用が可能であり、要望があれば必要な対応を行う。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（厚生労働省大臣官房統計・政策立案総括審議官の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/82","2026-11-05","国会会議録","お求めがありました際には必要な対応を行ってまいりたいというふうに考えております。"]],"id":516},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"親権の選択状況の数値把握に努める","m":"厚生労働省の協力のもと、人口動態統計や裁判所の手続を利用した共同親権が選択された事件数等の把握に努めている。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（法務副大臣・内閣府副大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/80","2026-11-05","国会会議録","厚生労働省に御協力をいただきながら、人口動態統計によってその数値の把握に努めているほか、最高裁判所に御協力をいただいて、裁判所の手続を利用した際に共同親権が選択された事件数等の把握に努めております。"]],"id":517},{"a":"government","s":"planned","k":"その他","f":"福祉","t":"施行状況の適切な把握の在り方を検討する","m":"施行の状況等の適切な把握の在り方について、関係府省庁等と連携し、今後も検討を進めていく。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（法務副大臣・内閣府副大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/80","2026-11-05","国会会議録","施行の状況等の適切な把握の在り方については、委員の問題意識も踏まえ、関係府省庁等とも連携をし、今後も検討をしてまいりたいと考えております。"]],"id":518},{"a":"government","s":"planned","k":"政策の実施","f":"福祉","t":"子供の手続代理人の実務運用状況を注視","m":"最高裁や関係機関と連携しつつ、子供の手続代理人の実務の運用状況について法務省として注視していく。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/66","2026-11-05","国会会議録","引き続き、こうした最高裁あるいは関係機関とも連携しつつ、子供の手続代理人の実務の運用状況について法務省としてもしっかり注視してまいりたいと考えております。"]],"id":521},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"司法・治安","t":"損害賠償額に関する規律の在り方について検討","m":"不法行為法制の研究会において、名誉毀損等の人格権侵害に関する救済の在り方の一つとして、損害賠償額に関する規律の在り方が検討されている。慰謝料額算定の適正化の方策も検討対象となっている。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（法務大臣・内閣府特命担当大臣（男女共同参画）・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/28","2026-11-05","国会会議録","名誉毀損等の人格権侵害に関する救済の在り方の一つとして、損害賠償額に関する規律の在り方も検討対象とされているところであります。"]],"id":530},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"児童被害事件における関係機関との情報共有体制を構築","m":"各地方検察庁において相談窓口を設置し、警察や児童相談所と情報交換を行う。また、三機関の代表者による対応方針の検討や、聴取記録の提供を含む情報共有を実施している。","d":"","e":"","r":"government","n":1,"src":[["参議院 法務委員会 第3号（法務省刑事局長の発言）","https://kokkai.ndl.go.jp/txt/122215206X00320261105/19","2026-11-05","国会会議録","各地方検察庁において、児童が被害者又は参考人である事件についての相談窓口を設置して、警察や児童相談所との緊密な情報交換を行うことであったり、あるいは、事案を認知した警察や児童相談所から情報提供を受け次第、速やかに警察や児童相談所の担当者と協議を行って、警察、検察、児童相談所の三機関のうちの代表者、何度も事情聴取を繰り返さないという趣旨から、誰が、どのような者がどのように代表者聴取を行うことを含めまして対応方針を検討することであったり、それから、代表者聴取実施後も、その聴取に係る記録媒体、録音、録画の記録媒体の提供を含めまして必要かつ相当な情報共有を行うことなどの取組を今実施しているところでござ"]],"id":533},{"a":"dpfp","s":"ongoing","k":"提言・要望","f":"政治・選挙","t":"選挙制度の抜本的見直し（合区解消）を要求","m":"参議院選挙における合区の解消を求め、選挙制度の抜本的見直しを主張している。制度導入から十年以上が経過している現状を指摘している。","d":"","e":"","r":"opposition","n":1,"src":[["衆議院 憲法審査会 第3号（国民民主党・無所属クラブの発言）","https://kokkai.ndl.go.jp/txt/122204183X00320261105/19","2026-11-05","国会会議録","国民民主党として、改憲項目として優先的に取り組むべきテーマは二つ、このように考えております。まずは、参議院で議論が進み、緊急避難措置とされたにもかかわらず、十年以上経過をしている合区の解消"]],"id":544},{"a":"government","s":"ongoing","k":"法案・制度","f":"医療","t":"学校医等の公務災害補償基準を政省令で改正","m":"国家公務員災害補償制度の見直しや人事院勧告を受け、医療職の給与改定が行われる都度、学校医等の公務災害補償の基準を見直し、公務災害補償水準の確保に寄与している。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第3号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/43","2026-10-30","国会会議録","国家公務員災害補償制度の見直しや人事院勧告を受けました医療職に関する給与改定が行われる都度、政省令の改正等によりまして学校医等の公務災害補償の基準を見直して、これによって学校医等の公務災害補償水準の確保に寄与してきたものと考えております。"]],"id":568},{"a":"government","s":"planned","k":"閣議決定・計画","f":"医療","t":"学校保健振興に向けた顕彰の推進","m":"顕彰の取り組みを通じて、学校医、学校歯科医、学校薬剤師の活動に対する理解と関心を高め、学校保健の振興につなげていく方針である。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第3号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00320261030/39","2026-10-30","国会会議録","文部科学省としては、このような顕彰の取組を通じまして、学校医、学校歯科医、学校薬剤師の活動に対する理解と関心を高め、学校保健の振興につなげてまいりたいと考えております。"]],"id":572},{"a":"jcp","s":"planned","k":"提言・要望","f":"医療","t":"高額医療費の要件緩和を求める提言","m":"肝がん・重度肝硬変の治療に係る医療費の窓口負担について、高額療養費算定基準の要件を「二月以上」から「一月以上」に緩和すべきと提言した。","d":"","e":"","r":"opposition","n":1,"src":[["衆議院 厚生労働委員会 第4号（日本共産党の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/113","2026-10-30","国会会議録","制度の対象者を増やすためには、一月以上を制度の対象者とするよう条件変更が期待される、こういう指摘もされているところでございます。"]],"id":601},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"地域ブロック会議等を通じた普及啓発の強化","m":"肝炎治療に関する地域ブロック会議等を通じて本取組の成果等を広く横展開することで、医療機関や患者への普及啓発を強化している。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/112","2026-10-30","国会会議録","肝炎治療に関する地域ブロック会議等を通じて本取組の成果等を広く横展開することで、医療機関や患者への普及啓発を強化しております。"]],"id":603},{"a":"government","s":"ongoing","k":"政策の実施","f":"行政・デジタル","t":"マイナンバー連携による申請手続の簡素化","m":"申請手続の簡素化として、マイナンバーを用いた情報連携により、申請書類の一部を省略可能としている。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/112","2026-10-30","国会会議録","申請手続の簡素化として、マイナンバーを用いた情報連携により、申請書類の一部を省略可能としているところでございます。"]],"id":604},{"a":"government","s":"planned","k":"政策の実施","f":"医療","t":"医療費請求時の提出書類の電子化を検討","m":"医療費の請求時、原本提出を義務付けているが、受給者の負担軽減のため、コピーや電子データによる提出が可能か、DX審査支払機構と調整の上、前向きに検討する。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/106","2026-10-30","国会会議録","今後、受給者の負担軽減という観点もございますので、コピーや電子データによる提出が可能かどうかについて、実際の支給事務を行っているＤＸ審査支払機構と調整の上、前向きに検討していきます。"]],"id":611},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"肝炎ウイルス検査の普及啓発と制度周知の推進","m":"「知って、肝炎プロジェクト」を通じた普及啓発や、地方自治体による検査委託の推進、健診機関等へのリーフレット配布などにより、検査受検と給付金制度の周知に取り組んでいる。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/100","2026-10-30","国会会議録","「『知って、肝炎プロジェクト』を通じまして普及啓発に取り組むとともに、地方自治体の行う肝炎ウイルス検査の医療機関への委託の推進など利便性の高い検査体制の確保、それから、職域での検査実施の働きかけ、陽性者には給付金制度のお知らせが行き渡るように健診機関等にリーフレットを配布し、制度の周知、広報に取り組んできた」"]],"id":617},{"a":"government","s":"planned","k":"政策の実施","f":"医療","t":"無症候性キャリア向け定期検査手当に関するリーフレット作成","m":"無症候性キャリアに対し、給付金に加え、定期的な検査費用や年二回までの一万五千円の定期検査手当等の支給があることを説明するリーフレットを作成する。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/100","2026-10-30","国会会議録","「新たな取組として、無症候性キャリアの方は、給付金のほかに、定期的な検査費用や年二回までの一万五千円の定期検査手当等の支給があることを説明するリーフレットの作成」"]],"id":618},{"a":"government","s":"planned","k":"政策の実施","f":"医療","t":"駅等でのデジタルサイネージを活用した広報の検討","m":"自治体や医療機関等を通じた周知に加え、多くの方に目にしていただけるよう、駅等でのデジタルサイネージ等を活用した広報を検討する。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/100","2026-10-30","国会会議録","「自治体や医療機関等を通じた周知に加えて、多くの方に目にしていただけるよう、例えば駅等でのデジタルサイ 260X00420261030/88","2026-10-30","国会会議録","法案が成立した暁には、給付金制度の周知に加えて、こうした本人訴訟のための支援、まさにハードルを下げる支援につきましてもしっかりと周知を行ってまいりたいと考えております。"]],"id":634},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"医療費助成の早期開始に向けた手続を進める","m":"医療費助成の早期開始に向け、実施要綱の改正や必要な手続を進めている。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/84","2026-10-30","国会会議録","現在、早期の開始に向けまして、実施要綱の改正、必要な手続を進めておるところでございまして、速やかに開始をするよう努めていきたいと思っております。"]],"id":635},{"a":"government","s":"planned","k":"政策の実施","f":"医療","t":"法案成立後、弁護士事務所等への手引き周知を検討","m":"法案が成立した場合、関係団体を通じて全国の弁護士事務所や司法書士事務所に対し、「B型肝炎訴訟の手引き」を活用した制度や和解手続、必要書類の周知を検討する。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/77","2026-10-30","国会会議録","法案が成立した暁には、関係団体を通じて、全国の弁護士事務所や司法書士事務所に対して、「Ｂ型肝炎訴訟の手引き」を活用して、制度や和解手続、必要書類について周知することを検討してまいりたいと考えております。"]],"id":640},{"a":"government","s":"planned","k":"政策の実施","f":"行政・デジタル","t":"遺骨収集の加速化に向けた取り組みを推進","m":"沖縄県と連携し、一柱でも多くの遺骨を一日でも早く収容できるよう、現在の取り組みをさらに推進していく。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/57","2026-10-30","国会会議録","引き続き、沖縄県と連携をして、一柱でも多くの御遺骨を一日でも早く収容できるように、こうした取組を更に推進をして、遺骨収集の加速化に取り組んでいきたいと考えております。"]],"id":654},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"創薬基盤の強化と治療薬開発の加速化","m":"共同利用可能な研究設備の整備や、創薬スタートアップ等への支援を通じて創薬クラスターの取り組みを支援し、B型肝炎ウイルスを含む疾病に係る革新的な新薬を継続的に生み出す創薬基盤の強化を図っている。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/41","2026-10-30","国会会議録","厚生労働省としても、こうした方向性を踏まえながら、Ｂ型肝炎ウイルスに関する研究成果の実用化の促進に努めてまいります。加えて、厚生労働省では、共同利用可能な研究設備の整備や、創薬スタートアップ等に対する創薬実用化に向けた支援など、湘南アイパークなどの創薬クラスターの取組に対する支援を行っているところでございますが、こうした創薬クラスターからＢ型肝炎も含めた様々な疾病に係る革新的な新薬を継続的に生み出す創薬基盤の強化を図っているところであります。"]],"id":658},{"a":"government","s":"planned","k":"閣議決定・計画","f":"医療","t":"肝炎対策基本指針への非ウイルス性肝炎記載を検討","m":"肝炎対策推進協議会において、肝炎対策基本指針に非ウイルス性肝炎に関する記載を議論するよう検討する。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/37","2026-10-30","国会会議録","肝炎対策基本指針に非ウイルス性肝炎に関し何らか記載することにつきまして、肝炎対策推進協議会において議論いただくよう検討してまいりたいと考えております。"]],"id":661},{"a":"government","s":"planned","k":"政策の実施","f":"医療","t":"肝炎情報センターの情報発信を予防の観点から強化","m":"肝炎情報センターによる情報発信について、今後は予防の観点も踏まえた情報発信に更に努めていく。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/37","2026-10-30","国会会議録","今後は、御提案も踏まえまして、予防の観点も踏まえた情報発信に更に努めてまいりたいと考えております。"]],"id":662},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"生活習慣の改善に関する取組を推進","m":"健康日本21に基づき、栄養、食生活、飲酒、身体活動、運動などについて目標を設定し、生活習慣の改善に関する取組を進めている。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/35","2026-10-30","国会会議録","厚生労働省では、健康日本21に基づき、栄養、食生活、飲酒、身体活動、運動などについて目標を設定いたしまして、生活習慣の改善に関する取組を進めてまいりました。"]],"id":665},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"健康づくりサポートネット等で情報発信","m":"生活習慣病予防のためのポータルサイトを通じ、運動、睡眠、健診などに関する分かりやすい情報発信を行っている。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/35","2026-10-30","国会会議録","生活習慣病予防のためのポータルサイトであります健康づくりサポートネット等を通じまして、運動、睡眠、健診などに関する分かりやすい情報発信を行っておりまして"]],"id":667},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"適正体重に関する資材の充実に取り組む","m":"関連学会と協力をしながら、適正体重に関する資材の充実に取り組んでいる。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/35","2026-10-30","国会会議録","現在、関連学会とも協力をしながら、適正体重に関する資材の充実にも取り組んでいるところでありますので"]],"id":668},{"a":"government","s":"planned","k":"政策の実施","f":"医療","t":"養成研修等で給付金制度を取り上げるよう通知","m":"法案が成立した暁には、肝炎コーディネーターの養成研修等において給付金制度に関する内容を取り上げるよう、更に通知を行う。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/31","2026-10-30","国会会議録","法案が成立した暁には、肝炎コーディネーターを通じた給付金制度のより一層の周知に向けまして、コーディネーターの養成研修等において給付金制度に関する内容を取り上げるよう更に通知を行う"]],"id":670},{"a":"government","s":"planned","k":"政策の実施","f":"医療","t":"地域ブロック会議で給付金制度の周知を図る","m":"肝炎対策に関する地域ブロック会議において、陽性者に対しコーディネーターから給付金制度に関する適切な情報提供を行うよう、改めて周知を図る。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/31","2026-10-30","国会会議録","肝炎対策に関する地域ブロック会議がございますので、この会議において、陽性者に対しコーディネーターから給付金制度に関する適切な情報提供を行うよう、改めて周知を図ることに取り組んでまいりたいと考えております。"]],"id":671},{"a":"government","s":"planned","k":"政策の実施","f":"医療","t":"検査説明機会を活用した給付金制度の周知を継続","m":"入院時や手術前検査の説明の機会を活用した陽性者への給付金制度の周知について、引き続き医療機関等に更なる協力を依頼していく方針である。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/29","2026-10-30","国会会議録","引き続き、入院時や手術前検査の説明の機会を活用した陽性者への給付金制度の周知について、更なる御協力をお願いしていきたいというふうに考えております。"]],"id":678},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"B型肝炎訴訟給付金制度の周知活動","m":"毎年度、地方自治体や健診機関等にリーフレットを配布し、検診で陽性であった方へ給付金制度の案内が行われるようお願いしている。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/27","2026-10-30","国会会議録","毎年度、地方自治体や健診機関等にリーフレットを配布をし、検診で陽性であった方へ本給付金制度の案内がされるようお願いをしております。"]],"id":681},{"a":"government","s":"planned","k":"政策の実施","f":"医療","t":"未提訴者向けリーフレット作成と広報方法の検討","m":"未提訴者が多い無症候性キャリア向けに新たなリーフレットを作成し、駅でのデジタルサイネージ活用などの広報方法を検討している。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/27","2026-10-30","国会会議録","今後は、未提訴者が多い無症候性キャリアの方に向けた新たな別のリーフレットを作成をいたしまして、多くの方に目にしていただけるようにしたいと思っています。例えば駅等でのデジタルサイネージを活用した広報、これも検討しているところでございます。"]],"id":682},{"a":"government","s":"planned","k":"閣議決定・計画","f":"医療","t":"肝炎ウイルス検査・給付金制度の周知徹底に関する検討","m":"請求期限延長を機に、職域の関係団体へ通知を発出するなど、肝炎ウイルス検査の受検勧奨や給付金制度の周知徹底について更なる検討を行う。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/27","2026-10-30","国会会議録","今回の請求期限延長を機に、改めて職域における関係団体へ通知を発出するなど、肝炎ウイルス検査の受検の勧奨や給付金制度についても併せて周知できないかなど、周知の徹底について更なる検討をしていきたいと考えております。"]],"id":683},{"a":"government","s":"ongoing","k":"政策の実施","f":"医療","t":"B型肝炎訴訟に関する支援策の実施","m":"専用の電話相談窓口の設置によるきめ細やかな支援や、体験談入りのリーフレットの周知・配布、手続の流れや必要な書類をまとめた「Ｂ型肝炎訴訟の手引き」のホームページへの掲載等に取り組んでいる。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/9","2026-10-30","国会会議録","専用の電話相談窓口の設置による、提訴を検討中の方へのきめ細やかな支援ですとか、提訴を難しいと考えておられる方にも提訴いただけるよう、提訴に係る体験談を入れたリーフレットの周知、配布、それから、手続の流れや必要な書類についてまとめた「Ｂ型肝炎訴訟の手引き」のホームページへの掲載等に取り組んできたところでございます。"]],"id":686},{"a":"government","s":"planned","k":"政策の実施","f":"医療","t":"弁護士等への訴訟手引きの周知","m":"法案が成立した暁には、関係団体を通じて、全国の弁護士事務所や司法書士事務所等に対し、「Ｂ型肝炎訴訟の手引き」を活用して制度や和解手続、必要書類等について周知を行う予定である。","d":"","e":"","r":"government","n":1,"src":[["衆議院 厚生労働委員会 第4号（厚生労働省健康・生活衛生局長の発言）","https://kokkai.ndl.go.jp/txt/122204260X00420261030/9","2026-10-30","国会会議録","法案が成立した暁には、関係団体を通じて、全国の弁護士事務所や司法書士事務所等に対しまして、「Ｂ型肝炎訴訟の手引き」を活用して、制度や和解手続、必要書類等について周知をしてまいりたいと考えております。"]],"id":687},{"a":"government","s":"ongoing","k":"政策の実施","f":"環境・エネルギー","t":"PFASの調査と有害性に関する知見を収集","m":"PFOS、PFOA以外のPFASについて、八物質を水環境に関する知見の集積が必要な物質に位置づけ調査を進め、有害性に関する科学的知見を収集している。","d":"","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第3号（環境省水・大気環境局長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00320261030/97","2026-10-30","国会会議録","ＰＦＯＳ、ＰＦＯＡ以外のＰＦＡＳにつきましても、国際的な動向や国内における検出状況を踏まえまして、八物質を水道水や水環境に関する知見の集積が必要な物質に位置づけ、調査を進めるほか、その他のＰＦＡＳも含め、有害性に関する科学的知見を収集しております。"]],"id":693},{"a":"government","s":"ongoing","k":"政策の実施","f":"環境・エネルギー","t":"PFASに関する知見を地方自治体等に共有","m":"PFASに関する収集した知見について、地方自治体や関係省庁に共有している。","d":"","e":"","r":"government","n":1,"src":[["衆議院 環境委員会 第3号（環境省水・大気環境局長の発言）","https://kokkai.ndl.go.jp/txt/122204006X00320261030/97","2026 みについて、一定期間を経た後に地方団体を交えて検証を行う予定である。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/146","2026-10-28","国会会議録","今回の学校給食費の抜本的な負担軽減の取組につきましては、一定期間を経た後に地方団体を交えて検証することとしておりまして、その際にはこれらの調査結果についても参考にしてまいります。"]],"id":821},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"学校給食栄養報告を実施し結果を公表","m":"学校給食栄養報告を調査実施年度の六月及び十一月に実施し、その結果を翌年度六月頃に公表している。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/146","2026-10-28","国会会議録","文部科学省において実施しております学校給食栄養報告により把握しておりまして、調査実施年度の六月及び十一月に実施し、その結果を翌年度六月頃に公表しているところでございます。"]],"id":822},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"給食費負担軽減交付金実施要領等で対象者例を自治体に提示","m":"給食費負担軽減交付金実施要領や事務連絡において、学校設置者が非喫食者に対する金銭給付を行う場合の対象者として想定される例などを自治体に具体的に示し、統一的な考え方を示している。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/144","2026-10-28","国会会議録","文部科学省では、給食費負担軽減交付金実施要領や事務連絡におきまして、学校設置者が非喫食者に対する給食費相当額の金銭給付を行う場合におきます事業の対象者として想定される例などを自治体に具体的にお示しをするなど、統一的な考え方を示しているところでございます。"]],"id":823},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"非喫食者支援に取り組む自治体事例などの情報提供を実施","m":"非喫食者への支援に取り組む自治体の事例など、必要な情報提供を行いながら、各自治体において地域の実情に応じた適切な対応をいただけるよう取り組んでいく。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/144","2026-10-28","国会会議録","文部科学省といたしましては、非喫食者への支援に取り組む自治体の事例など、必要な情報提供を行いながら、各自治体において地域の実情に応じた適切な対応をいただけるよう取り組んでまいります。"]],"id":824},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"高校生等奨学給付金による教育費支援","m":"低中所得世帯のお子様に対し、高校生等奨学給付金を通じて教育費を支援している。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省大臣官房学習基盤審議官の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/138","2026-10-28","国会会議録","低中所得世帯のお子様に関しましては、先ほど申し上げました高校生等奨学給付金、こういったものによるもの"]],"id":830},{"a":"government","s":"planned","k":"政策の実施","f":"子育て・教育","t":"高校生等奨学給付金の拡充を目指す","m":"教育費支援の一環として、高校生等奨学給付金の拡充を目指している。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省大臣官房学習基盤審議官の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/138","2026-10-28","国会会議録","またそれの拡充を目指す中で教育費を支援してまいりたいと思っておりまして"]],"id":831},{"a":"government","s":"ongoing","k":"その他","f":"子育て・教育","t":"教育費負担軽減に引き続き努める","m":"文科省として、引き続き教育費の負担軽減に努めていく方針である。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省大臣官房学習基盤審議官の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/138","2026-10-28","国会会議録","文科省といたしましては引き続きこうした負担軽減に努めてまいりたいと思っているところでございます。"]],"id":832},{"a":"government","s":"ongoing","k":"政策の実施","f":"雇用・労働","t":"基礎定数による教職員定数の改善","m":"児童生徒数に応じた基礎定数措置により、小中学校の35人学級の実施など、安定的かつ計画的な採用を可能にする改善を図っている。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/132","2026-10-28","国会会議録","小中学校の三十五人学級の実施など、基礎定数についても改善を図ってきております。"]],"id":844},{"a":"government","s":"ongoing","k":"会議・協議","f":"雇用・労働","t":"今後の教職員定数の在り方について検討","m":"定数改善計画の進捗や働き方改革の状況、中央教育審議会での議論などを踏まえ、自治体の意見も伺いながら幅広く検討を行う。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/132","2026-10-28","国会会議録","今後の教職員の定数の在り方につきましては、定数改善計画の進捗や学校におきます働き方改革の取組の状況、また、現在、中央教育審議会で議論が進められております教員養成の在り方や次期学習指導要領に関する議論の状況などを踏まえまして、自治体の御意見等も伺いながら、幅広く検討を行ってまいりたいと思います。"]],"id":845},{"a":"government","s":"ongoing","k":"政策の実施","f":"福祉","t":"地域教員希望枠を活用した教員養成大学・学部の機能強化事業で支援","m":"地域教員希望枠を活用した教員養成大学・学部の機能強化事業を通じて、スーパールーキー教員養成プログラムなど、全国で43件の取組を支援している。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省高等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/130","2026-10-28","国会会議録","文部科学省では、このスーパールーキー教員養成プログラムにつきましては、地域教員希望枠を活用した教員養成大学・学部の機能強化事業で御支援を申し上げているところでございます。"]],"id":847},{"a":"government","s":"planned","k":"閣議決定・計画","f":"福祉","t":"事業を通じた支援、効果検証、成果の普及・展開を図る","m":"今後、この事業を通じ各大学や教育委員会の取組を支援するとともに、取組の効果検証を行い、日本教育大学協会などで共有の上、事業成果の更なる普及、展開を図る。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省高等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/130","2026-10-28","国会会議録","今後、この事業を通じまして各大学や教育委員会の取組を支援するとともに、取組の効果検証を行った上で、初中局とも連携をいたしまして、日本教育大学協会などで共有の上、事業成果の更なる普及、展開を図ってまいりたいと思っております"]],"id":848},{"a":"government","s":"ongoing","k":"政策の実施","f":"雇用・労働","t":"学校における働き方改革と処遇改善を継続","m":"教師に優れた人材を確保するため、学校における働き方改革の更なる加速化と教師の処遇改善に引き続き取り組む。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/128","2026-10-28","国会会議録","学校における働き方改革の更なる加速化、教師の処遇改善、こういったことに引き続き取り組みますとともに、"]],"id":851},{"a":"government","s":"ongoing","k":"会議・協議","f":"雇用・労働","t":"中教審で教職参入制度の在り方を議論","m":"多様な社会人等が教職へ参入しやすくなるような制度の在り方について、中教審で議論が進められている。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/128","2026-10-28","国会会議録","現在、中教審においても、多様な社会人等が教職へ参入しやすくなるような制度の在り方、こういったことについても御議論いただいているところでございます。"]],"id":853},{"a":"government","s":"planned","k":"政策の実施","f":"子育て・教育","t":"教職員定数改善による指導体制の充実を図る","m":"教職員定数の改善による指導、運営体制の充実を図り、全ての子供たちへよりよい環境を実現させる。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/128","2026-10-28","国会会議録","教職員定数の改善による指導、運営体制の充実を図ることで、全ての子供たちへよりよい環境を実現させていきたいと思います。"]],"id":854},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"未策定の教育委員会に対し計画策定を働きかけ","m":"計画が未策定である教育委員会に対し、策定するよう積極的に働きかけている。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/126","2026-10-28","国会会議録","文科省といたしましては、計画が未策定である教育委員会に対して策定するよう積極的に働きかけを行っているところでございます。"]],"id":855},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"時間外在校等時間に関する計画策定を促す","m":"時間外在校等時間に関する目標を大臣指針に位置づけ、各服務監督教育委員会に適切に計画が策定されるよう促す。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/126","2026-10-28","国会会議録","御指摘の時間外在校等時間に関する目標も大臣指針に位置づけておりますので、各服務監督教育委員会におきまして適切に計画が策定されるよう促してまいりたいと思います。"]],"id":856},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"時間外在校等時間の状況把握と働き方改革を推進","m":"毎年度、本調査で時間外在校等時間の状況を把握しながら、学校における働き方の改革を進めていく。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省初等中等教育局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/126","2026-10-28","国会会議録","今後も毎年度、本調査で時間外在校等時間の状況を把握しながら、今ほど御指摘のありました学校における働き方の改革を進めてまいりたいと思います。"]],"id":857},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"高校教育改革促進基金による先導校の採択","m":"公立高校の役割として生徒のアクセス確保を重視し、基金を用いて158の先導校を採択し、パイロットケースの創出を進めている。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/116","2026-10-28","国会会議録","文部科学省としまして、現在、公立高校の役割としまして、一人一人の高校生たちのアクセス確保を図るという観点も重視をしながら、高校教育改革促進基金によりまして百五十八の先導校を採択いたしましてパイロットケースの創出を進めているところでございます。"]],"id":860},{"a":"government","s":"done","k":"政策の実施","f":"子育て・教育","t":"就学支援金制度の支給限度額を設定","m":"文部科学省が令和七年度の全国の私立高校平均授業料を調査し、三党合意に基づき、私立全日制・定時制は45.72万円、私立通信制は33.72万円とした。","d":"2026-10-28","e":"","r":"government","n":2,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/110","2026-10-28","国会会議録","就学支援金制度が、改正法の附則の第五条に基づいて施行後の三年以内に検討となっておりますので、その結果に基づきまして必要な措置を講ずる旨が定められておりますので、この支給限度額の在り方につきましても、新たな制度の実施状況等を踏まえまして検証してまいりたい、そのように考えておる次第でございます。"],["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/108","2026-10-28","国会会議録","文部科学省が調査いたしました令和七年度における全国の私立高校平均授業料を踏まえまして、三党合意によりまして、私立全日制、定時制は四十五万七千二百円、私立通信制は三十三万七千二百円等としたところでございます。"]],"id":862},{"a":"government","s":"planned","k":"法案・制度","f":"子育て・教育","t":"新たな就学支援金制度の検討を実施","m":"改正法の附則の第五条に基づき、新たな就学支援金制度は施行後三年以内に検討を行い、その結果に基づいて必要な措置を講じることとなっている。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/108","2026-10-28","国会会議録","新たな就学支援金制度は、改正法の附則の第五条に基づきまして、施行後三年以内に検討を行いまして、その結果に基づいて必要な措置を講ずることが定められております。"]],"id":864},{"a":"government","s":"planned","k":"閣議決定・計画","f":"子育て・教育","t":"新たな就学支援金制度の影響検証を推進","m":"学校基本調査のデータ等の客観的情報を幅広く丁寧に分析し、新たな就学支援金制度の実施条件やその影響等について検証を進めていく。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/104","2026-10-28","国会会議録","今後、学校基本調査のデータ等の客観的情報を幅広く丁寧に分析して、新たな就学支援金制度の実施条件やその影響等については検証をしっかり進めてまいりたいと思います。"]],"id":865},{"a":"government","s":"planned","k":"政策の実施","f":"子育て・教育","t":"学校における性に関する指導の周知強化","m":"児童生徒の個々の状況を踏まえ、指導を萎縮させないよう、各種会議や研修の場を通じ繰り返し丁寧に周知を行う方針。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/94","2026-10-28","国会会議録","各学校におきます指導を萎縮させることのないように、各種会議や研修の場を通じまして繰り返し丁寧に周知を行ってまいりたいと思います。"]],"id":870},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"生命の安全教育の推進と強化","m":"性暴力等に関する正しい知識、他者への尊重や人間関係などの様々な内容について教育課程の内外を通じて指導することを推進している。目的の周知も含めて更に推進を図りたい。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/92","2026-10-28","国会会議録","生命（いのち）の安全教育は、性暴力等に関する正しい知識、他者への尊重や人間関係などの様々な内容について教育課程の内外を通じて指導することを推進しておりますので、...その目的の周知も含めて更に推進を図ってまいりたいと考えております。"]],"id":871},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"子育て・教育","t":"安全教育の実施方法の検討と関連付け","m":"安全教育の実施にあたり、各教科等の学習内容と関連を図りながら行うことが考えられる。性に関する指導と関連づける場合、児童生徒の発達の差異や保護者の理解に留意する必要がある。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省総合教育政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/92","2026-10-28","国会会議録","各教科等の学習内容と関連を図りながら行われることも考えられるところでございます。例えば、性に関する指導と関連を図って実施をするということ、この場合、例えば保健体育などと関連づけながらということになるかと思いますけれども"]],"id":872},{"a":"government","s":"planned","k":"政策の実施","f":"子育て・教育","t":"生命の安全教育の趣旨理解に向けた周知を図る","m":"各学校が生命（いのち）の安全教育の趣旨を理解した上で取り組めるよう、予算事業等を活用しながら周知を図る。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/88","2026-10-28","国会会議録","文部科学省といたしましては、各学校におきまして生命（いのち）の安全教育の趣旨をきちんと理解をした上で取り組んでいただきますように、予算事業等も活用しながら周知を図ってまいりたいと思います。"]],"id":873},{"a":"government","s":"ongoing","k":"政策の実施","f":"子育て・教育","t":"地域における安全教育モデル構築の支援を普及展開","m":"地域におけるモデル構築の支援などの普及、展開を図っている。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/86","2026-10-28","国会会議録","地域におきますモデル構築の支援などの普及、展開を図っておりますほか"]],"id":876},{"a":"government","s":"planned","k":"政策の実施","f":"環境・エネルギー","t":"高レベル放射性廃棄物に関する研究開発を推進","m":"経済産業省が策定した全体計画に基づき、経済産業省をはじめとする関係機関と連携して研究開発を推進する。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/82","2026-10-28","国会会議録","同計画に基づきまして、経済産業省を始めとした関係機関と連携をいたしまして、研究開発を推進してまいりたいと思います。"]],"id":880},{"a":"government","s":"ongoing","k":"政策の実施","f":"住宅・都市","t":"公立学校施設の改修・改築に対する国庫補助の実施","m":"老朽化した公立小中学校等の長寿命化のための改修や構造上危険な状態にある建物の改築に対し、三分の一の国庫補助を行うなど、地方自治体の取り組みを支援している。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省大臣官房文教施設企画・防災部長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/74","2026-10-28","国会会議録","老朽化した公立小中学校等の長寿命化のための改修や構造上危険な状態にある建物の改築に対して三分の一の国庫補助を行うなど、各地方自治体のニーズを踏まえ、取組を支援しているところでございます。"]],"id":881},{"a":"government","s":"planned","k":"政策の実施","f":"科学技術","t":"科研費の大幅拡充と全面基金化の推進","m":"科研費の大幅拡充や全面基金化を推進し、我が国の知の基盤の強化に取り組む。また、若手研究者による新興・融合領域研究への挑戦促進のための競争的研究費の充実強化も行う。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省科学技術・学術政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/72","2026-10-28","国会会議録","科研費につきましては、大幅拡充や全面基金化の推進により、我が国の知の基盤の強化に取り組みます。また、科研費だけでなく、若手研究者による新興・融合領域研究への挑戦促進のための競争的研究費の充実強化に取り組みます。"]],"id":883},{"a":"government","s":"ongoing","k":"政策の実施","f":"科学技術","t":"大学等の基盤的経費の拡充","m":"大学や国立研究開発法人などの基盤的経費を拡充し、科学技術の国際的な優位性を取り戻すことを目指す。","d":"","e":"","r":"government","n":2,"src":[["衆議院 文部科学委員会 第2号（文部科学省科学技術・学術政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/72","2026-10-28","国会会議録","基盤的経費の拡充につきましては、我が国の成長分野の牽引や、地域の医療、産業、インフラ等の維持に不可欠な質の高い人材の確保を図り、基礎研究、研究開発から社会実装までを行う基盤を強化するための国立大学法人運営費交付金の拡充や、国立研究開発法人の機能強化、老朽化対策等に取り組みます。"],["衆議院 文部科学委員会 第2号（文部科学大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/71","2026-10-28","国会会議録","二つには、大学や国立研究開発法人などの基盤的経費の拡充"]],"id":884},{"a":"government","s":"planned","k":"政策の実施","f":"経済・産業","t":"研究大学群形成に向けた研究力強化の支援","m":"産業競争力強化に貢献する強い意思を持つ大学に対し、十七の戦略分野を核とした基盤的な研究力と産学連携機能の強化の支援を行う。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省科学技術・学術政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/72","2026-10-28","国会会議録","三つ目、研究大学群の形成につきましては、我が国の産業競争力強化に貢献する強い意思を持つ大学に対し、十七の戦略分野を核とした基盤的な研究力と産学連携機能の強化の支援に取り組みます。"]],"id":885},{"a":"government","s":"planned","k":"政策の実施","f":"科学技術","t":"AIを活用した研究開発と次世代インフラの構築","m":"策定された戦略方針に基づき、AIを利活用した研究開発やAI基盤技術の研究開発を進める。これらを支える次世代の研究インフラの構築も推進する。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省科学技術・学術政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/72","2026-10-28","国会会議録","ＡＩ・フォー・サイエンスの戦略的な推進に向けては、本年三月に策定いたしましたＡＩ・フォー・サイエンスの推進に向けた基本的な戦略方針等を踏まえ、ＡＩを利活用した研究開発やＡＩそのものの基盤技術の研究開発に加えて、これらを支える次世代の研究インフラの構築を推進します。"]],"id":886},{"a":"government","s":"planned","k":"政策の実施","f":"外交・安全保障","t":"国家安全保障と科学技術の連携強化と研究セキュリティー確保","m":"第七期科学技術・イノベーション基本計画に基づき、先端科学技術の研究開発を進める。安全保障貿易管理の徹底や、重要技術流出防止に向けた研究セキュリティーの確保に取り組む。","d":"","e":"","r":"government","n":1,"src":[["衆議院 文部科学委員会 第2号（文部科学省科学技術・学術政策局長の発言）","https://kokkai.ndl.go.jp/txt/122205124X00220261028/72","2026-10-28","国会会議録","第七期科学技術・イノベーション基本計画を踏まえ、関係府省と連携しながら、広く大学や国立研究開発法人等の研究機関から理解と参画を得た上で先端科学技術に関する研究開発を進めるとともに、大学、研究機関における安全保障貿易管理の徹底に加え、経済安全保障上の重要技術の流出防止等に向けた研究機関による研究者情報の把握等の研究インテグリティー、研究セキュリティーの確保に取り組みます。"]],"id":887},{"a":"government","s":"ongoing","k":"政策の実施","f":"科学技術","t":"競争的研究 txt/122203968X00220261028/168","2026-10-28","国会会議録","これに加えまして、次世代型地熱の国内実証についても、グリーンイノベーション基金を活用して、千百二億円を上限に支援を行うことといたしております。"]],"id":950},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"環境・エネルギー","t":"地熱発電導入拡大に向けた連携の継続","m":"JOGMECやNEDOと連携しながら、地熱発電の導入拡大に向けて引き続き取り組んでいく方針。","d":"","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（資源エネルギー庁資源・燃料部長の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/168","2026-10-28","国会会議録","これらの支援を活用いたしまして、引き続き、ＪＯＧＭＥＣやＮＥＤＯと連携しながら、地熱発電の導入拡大に向けて取り組んでまいりたいと考えてございます。"]],"id":951},{"a":"government","s":"planned","k":"閣議決定・計画","f":"環境・エネルギー","t":"国内資源探査の継続的な推進","m":"エネルギー安定供給の確保に資するため、民間事業者と密接に連携しながら、国内の資源探査を継続的に進めていく計画である。","d":"","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（資源エネルギー庁資源・燃料部長の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/164","2026-10-28","国会会議録","引き続き、我が国のエネルギー安定供給の確保に資するよう、民間事業者とも密接に連携しながら、国内の資源探査を進めていく計画でございます。"]],"id":953},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"経済・産業","t":"湾岸諸国との協力計画を取りまとめ中","m":"中東の湾岸諸国の経済、エネルギー強靱化に向けた包括的な協力計画を取りまとめている。","d":"","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/162","2026-10-28","国会会議録","さらに、現在、中東の湾岸諸国の経済、エネルギー強靱化に向けた包括的な協力計画も取りまとめているところであります。"]],"id":956},{"a":"government","s":"ongoing","k":"閣議決定・計画","f":"外交・安全保障","t":"中東地域への外交努力と安全保障強化を継続","m":"中東地域全体の早期鎮静化、安定化に向けた外交努力を続け、エネルギーの安全保障の確保、法の支配に基づく自由で開かれた海洋秩序の維持強化に取り組む。","d":"","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/162","2026-10-28","国会会議録","政府としては、まずは、中東地域全体、これはイランだけに限らず、今、イエメンであったりとか様々なところに飛び火というか、紛争が拡大をする、こういう状況にあるわけでありますが、その早期鎮静化、安定化に向けた外交努力を続けながら、引き続き、エネルギーの安全保障の確保、そして、法の支配に基づく自由で開かれた海洋秩序の維持強化に取り組んでいきたい、こんなふうに考えています。"]],"id":958},{"a":"government","s":"planned","k":"政策の実施","f":"外交・安全保障","t":"ウクライナ支援及び対ロ制裁を継続する方針","m":"総合的な国益を踏まえ、ウクライナ支援及び対ロ制裁を続けていきたいと考えている。","d":"","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/160","2026-10-28","国会会議録","そういった総合的な国益、これを踏まえながら、ウクライナ支援及び対ロ制裁、これを続けていきたいと考えております。"]],"id":960},{"a":"government","s":"ongoing","k":"提言・要望","f":"外交・安全保障","t":"EU産業加速化法の適用除外について提言","m":"EUの産業加速化法が日本に適用されることについて問題であるとし、ヨーロッパのカウンターパートに話をしている。","d":"","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/160","2026-10-28","国会会議録","私からもヨーロッパのカウンターパートにも話をしておりまして、同士討ちをするのはやめようという話もさせていただいております。"]],"id":961},{"a":"government","s":"planned","k":"政策の実施","f":"環境・エネルギー","t":"チョルノービリ修復支援に知見を共有し貢献","m":"チョルノービリ原子力発電所の新シェルター修復支援について、東京電力福島第一原子力発電所の廃炉に係る取組で得られた知見をウクライナに共有することで貢献を行う。","d":"","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（外務省大臣官房審議官の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/156","2026-10-28","国会会議録","チョルノービリ原子力発電所の新シェルター修復支援につきましては、日本として、東京電力福島第一原子力発電所の廃炉に係る取組を通じて得られた知見をウクライナに共有することで貢献を行うこととしてございます。"]],"id":963},{"a":"government","s":"ongoing","k":"提言・要望","f":"経済・産業","t":"EU産業加速化法案への懸念伝達","m":"日本企業が不利益を被らないよう、関連情報収集を行いながら、EU側に懸念を伝達している。","d":"","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（外務省大臣官房参事官の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/152","2026-10-28","国会会議録","日本企業が不利益を被ることのないよう、関連の情報収集を行いつつ、様々なレベルでＥＵ側に懸念を伝達しているところでございます。"]],"id":964},{"a":"government","s":"ongoing","k":"政策の実施","f":"外交・安全保障","t":"ウクライナ支援と対ロ制裁への取り組み","m":"EUを始めとした国際社会と緊密に連携し、ウクライナ支援及び対ロ制裁に取り組む。これは公正かつ永続的な平和実現を目指す。","d":"","e":"","r":"government","n":3,"src":[["衆議院 外務委員会 第2号（外務省大臣官房参事官の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/152","2026-10-28","国会会議録","ＥＵを始めとした国際社会と緊密に連携し、ウクライナ支援及び対ロ制裁に取り組んでまいります。"],["参議院 沖縄・北方問題及び地方に関する特別委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122215382X00220261028/5","2026-10-28","国会会議録","一日も早く公正かつ永続的な平和を実現するため、Ｇ７を始めとした各国と連携し、ウクライナ支援と対ロ制裁を継続していきます。"],["参議院 外交防衛委員会 第2号（外務大臣・自由民主党・無所属の会の発言）","https://kokkai.ndl.go.jp/txt/122213950X00220261027/194","2026-10-27","国会会議録","我が国としては、引き続き、国際社会と緊密に連携して、ウクライナ支援及び対ロ制裁に取り組んでいきたいと思っております。"]],"id":965},{"a":"dpfp","s":"planned","k":"提言・要望","f":"防災・災害","t":"事前防災のパラダイムシフトを世界に促す","m":"災害発生後の復旧ではなく、事前に備えることが重要であるという観点から、世界各国に対して事前防災のパラダイムシフトを促すことを提言した。","d":"","e":"","r":"opposition","n":1,"src":[["衆議院 外務委員会 第2号（国民民主党・無所属クラブの発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/142","2026-10-28","国会会議録","事前防災をやっていくんだというパラダイムシフトを世界各国に対してしっかりと促していただきたいというところが、一番我が国にできる大きな貢献じゃないかというふうに思います。"]],"id":967},{"a":"dpfp","s":"planned","k":"提言・要望","f":"医療","t":"日本の医薬品・創薬力を世界の保健課題解決に活用","m":"日本の医薬品や創薬の力を、世界の保健課題の解決にどのように生かしていくのかという具体的な取り組みについて政府に問いかけた。","d":"","e":"","r":"opposition","n":1,"src":[["衆議院 外務委員会 第2号（国民民主党・無所属クラブの発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/142","2026-10-28","国会会議録","日本の医薬品の力、そして創薬の力を、世界の保健課題の解決にどう生かしていくのかといった観点から伺っていきたいというふうに思います。"]],"id":968},{"a":"dpfp","s":"planned","k":"提言・要望","f":"医療","t":"世界の保健衛生への貢献における日本の役割を明確化","m":"国際保健を支える協力環境の変化を踏まえ、日本がこれまで積み重ねてきた貢献を維持・発展させるために、日本として果たすべき役割を政府に求めた。","d":"","e":"","r":"opposition","n":1,"src":[["衆議院 外務委員会 第2号（国民民主党・無所属クラブの発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/142","2026-10-28","国会会議録","そのために今、日本としてできること、果たすべき役割は何であると考えているのか、茂木外務大臣からお聞かせいただきたいと思います。"]],"id":969},{"a":"government","s":"ongoing","k":"政策の実施","f":"外交・安全保障","t":"ウクライナの改革努力に対する支援の継続","m":"日本政府として、ウクライナが取り組む汚職対策や司法、企業統治といった改革の姿勢を支援していく方針である。","d":"","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（外務省大臣官房参事官の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/130","2026-10-28","国会会議録","日本政府として、このようなウクライナの姿勢、取組、これを支援していきたい、支援しているところでございます。"]],"id":972},{"a":"government","s":"ongoing","k":"政策の実施","f":"外交・安全保障","t":"対ウクライナ支援の継続と改革への後押し","m":"対ウクライナ支援が適切に実施されるよう取り組みを継続し、汚職対策を含めたウクライナの改革努力を国際社会と連携しながら後押ししていく。","d":"","e":"","r":"government","n":1,"src":[["衆議院 外務委員会 第2号（外務省大臣官房参事官の発言）","https://kokkai.ndl.go.jp/txt/122203968X00220261028/130","2026-10-28","国会会議録","引き続き、日本といたしましては、対ウクライナ支援が適切に実施されるよう取組を継続したい、そのため、また、汚職対策を含めて、ウクライナ自身の改革に係る努力を
